"ヨーロッパ州","q":"ヨーロッパ連合（EU）の多くの加盟国で使われている共通通貨を何といいますか。","c":["ユーロ","ポンド","ドル","フラン"],"a":0,"e":"ユーロの導入により両替の手間や為替の損失がなくなりました。ただしEU加盟国でも導入していない国があります。"},{"t":"ヨーロッパ州","q":"ヨーロッパの西部が高緯度のわりに温暖な理由となる、暖流の北大西洋海流の上を吹く風を何といいますか。","c":["偏西風","季節風","貿易風","やませ"],"a":0,"e":"暖流の北大西洋海流の上を偏西風が吹くため、西ヨーロッパは高緯度でも冬が比較的温暖な西岸海洋性気候になります。"},{"t":"ヨーロッパ州","q":"地中海沿岸で、夏の乾燥に強いオリーブやぶどうなどを栽培する農業を何といいますか。","c":["地中海式農業","混合農業","酪農","焼畑農業"],"a":0,"e":"地中海沿岸は夏に乾燥し冬に雨が降る地中海性気候です。混合農業は小麦などの穀物栽培と家畜の飼育を組み合わせた農業です。"},{"t":"アフリカ州","q":"特定の農産物や鉱産資源の輸出に頼っているアフリカの国々に多く見られる経済を何といいますか。","c":["モノカルチャー経済","プランテーション","市場経済","計画経済"],"a":0,"e":"モノカルチャー経済は価格の変動の影響を受けやすく、国の収入が不安定になります。植民地時代の名残でもあります。"},{"t":"アフリカ州","q":"アフリカ大陸を北へ流れて地中海に注ぐ、世界最長の川は何ですか。","c":["ナイル川","コンゴ川","ニジェール川","アマゾン川"],"a":0,"e":"ナイル川は全長約6700kmで世界最長です。その流域には古代エジプト文明が栄えました。"},{"t":"北アメリカ州","q":"アメリカ合衆国で、その土地の自然環境に最も適した作物を栽培することを何といいますか。","c":["適地適作","混合農業","二毛作","促成栽培"],"a":0,"e":"アメリカ合衆国は適地適作と大型機械を使った企業的な農業で、世界の食料庫と呼ばれています。"},{"t":"北アメリカ州","q":"サンフランシスコの近郊にあり、ICT関連の企業や研究所が集まる地域を何といいますか。","c":["シリコンバレー","デトロイト","ピッツバーグ","ヒューストン"],"a":0,"e":"シリコンバレーには世界的なICT企業が集中しています。デトロイトは自動車、ピッツバーグは鉄鋼で知られた都市です。"},{"t":"南アメリカ州","q":"ブラジルの公用語は何ですか。","c":["ポルトガル語","スペイン語","英語","フランス語"],"a":0,"e":"ブラジルはかつてポルトガルの植民地だったためポルトガル語が公用語です。南アメリカの他の多くの国はスペイン語です。"},{"t":"南アメリカ州","q":"南アメリカ大陸を流れる、流域面積が世界最大の川は何ですか。","c":["アマゾン川","ラプラタ川","ミシシッピ川","ナイル川"],"a":0,"e":"アマゾン川の流域面積は約700万km2で世界最大です。流域には広大な熱帯雨林（セルバ）が広がっています。"},{"t":"オセアニア州","q":"オーストラリアに古くから住んでいた先住民を何といいますか。","c":["アボリジニ","マオリ","イヌイット","メスチソ"],"a":0,"e":"アボリジニはオーストラリアの先住民です。マオリはニュージーランドの先住民、イヌイットは北極周辺の先住民です。"},{"t":"オセアニア州","q":"かつてオーストラリアがとっていた、ヨーロッパ系以外の移民を制限する政策を何といいますか。","c":["白豪主義","アパルトヘイト","鎖国","一人っ子政策"],"a":0,"e":"白豪主義は1970年代に廃止され、その後オーストラリアは多文化社会をめざすようになりました。アパルトヘイトは南アフリカ共和国の人種隔離政策です。"},{"t":"世界の宗教","q":"下のグラフは世界の宗教別人口の割合です。最も信者が多いAの宗教はどれですか。","fig":"<svg viewBox='0 0 300 150'><text x='10' y='31' font-size='12' fill='#333'>A</text><rect x='30' y='18' width='150' height='16' fill='#93c5fd'/><text x='185' y='31' font-size='11' fill='#333'>約31％</text><text x='10' y='61' font-size='12' fill='#333'>B</text><rect x='30' y='48' width='120' height='16' fill='#93c5fd'/><text x='155' y='61' font-size='11' fill='#333'>約25％</text><text x='10' y='91' font-size='12' fill='#333'>C</text><rect x='30' y='78' width='72' height='16' fill='#93c5fd'/><text x='107' y='91' font-size='11' fill='#333'>約15％</text><text x='10' y='121' font-size='12' fill='#333'>D</text><rect x='30' y='108' width='34' height='16' fill='#93c5fd'/><text x='69' y='121' font-size='11' fill='#333'>約7％</text><text x='10' y='143' font-size='11' fill='#333'>世界の宗教別人口の割合</text></svg>","c":["キリスト教","イスラム教","ヒンドゥー教","仏教"],"a":0,"e":"世界で最も信者が多いのはキリスト教で、次いでイスラム教、ヒンドゥー教、仏教の順です。三大宗教はキリスト教・イスラム教・仏教です。"},{"t":"世界の宗教","q":"イスラム教の信者が1日5回礼拝のときに向かう、サウジアラビアにある聖地はどこですか。","c":["メッカ","エルサレム","バチカン","ガンジス川"],"a":0,"e":"メッカはムハンマドが生まれた地で、イスラム教最大の聖地です。エルサレムはユダヤ教・キリスト教・イスラム教の聖地です。"}],"2":[{"t":"日本の位置","q":"日本の標準時子午線である東経135度が通る、兵庫県の都市はどこですか。","c":["明石市","神戸市","姫路市","西宮市"],"a":0,"e":"兵庫県明石市を通る東経135度の経線が日本の標準時子午線です。市内には日本標準時子午線を示す標識があります。"},{"t":"日本の領域","q":"日本の東のはしにあたる島はどれですか。","c":["南鳥島","沖ノ鳥島","与那国島","択捉島"],"a":0,"e":"日本の東端は南鳥島、南端は沖ノ鳥島、西端は与那国島、北端は択捉島です。いずれも東京都や沖縄県などに属します。"},{"t":"日本の領域","q":"波の侵食から守るため護岸工事が行われた、日本の南のはしの島はどれですか。","c":["沖ノ鳥島","南鳥島","与那国島","竹島"],"a":0,"e":"沖ノ鳥島が水没すると広大な排他的経済水域を失うため、日本は多額の費用をかけて護岸工事を行いました。"},{"t":"排他的経済水域","q":"図のAで示した、沿岸から200海里以内で領海を除く水域を何といいますか。","fig":"<svg viewBox='0 0 300 140'><rect x='10' y='38' width='60' height='50' fill='#e2e8f0' stroke='#94a3b8' stroke-width='1.5'/><text x='20' y='68' font-size='12' fill='#333'>陸地</text><line x1='70' y1='26' x2='70' y2='96' stroke='#333' stroke-width='2'/><line x1='100' y1='26' x2='100' y2='96' stroke='#94a3b8' stroke-width='2'/><line x1='270' y1='26' x2='270' y2='96' stroke='#4a6cf7' stroke-width='2.5'/><text x='72' y='20' font-size='10' fill='#333'>海岸線</text><line x1='70' y1='46' x2='100' y2='46' stroke='#94a3b8' stroke-width='1.5'/><text x='72' y='41' font-size='9' fill='#333'>領海</text><line x1='100' y1='72' x2='270' y2='72' stroke='#4a6cf7' stroke-width='1.5'/><text x='178' y='66' font-size='13' fill='#333'>A</text><line x1='70' y1='110' x2='270' y2='110' stroke='#333' stroke-width='1'/><line x1='70' y1='104' x2='70' y2='116' stroke='#333' stroke-width='1'/><line x1='270' y1='104' x2='270' y2='116' stroke='#333' stroke-width='1'/><text x='126' y='134' font-size='11' fill='#333'>海岸から200海里</text></svg>","c":["排他的経済水域","領海","公海","大陸だな"],"a":0,"e":"排他的経済水域では沿岸国が水産資源や鉱産資源を利用する権利をもちます。領海は海岸から12海里までの範囲です。"},{"t":"領土問題","q":"日本固有の領土でありながらロシアが占拠している北方領土のうち、最も面積が大きい島はどれですか。","c":["択捉島","国後島","色丹島","歯舞群島"],"a":0,"e":"北方領土は択捉島・国後島・色丹島・歯舞群島からなり、択捉島が最大です。日本は返還を求め続けています。"},{"t":"領土問題","q":"島根県に属する日本固有の領土でありながら、韓国が不法に占拠している島はどこですか。","c":["竹島","尖閣諸島","対馬","佐渡島"],"a":0,"e":"竹島は島根県隠岐の島町に属します。尖閣諸島は沖縄県に属し、中国などが領有を主張していますが領土問題は存在しません。"},{"t":"日本の地形","q":"グラフのAが示す、日本の国土のおよそ4分の3を占める地形は何ですか。","fig":"<svg viewBox='0 0 300 110'><rect x='20' y='32' width='195' height='36' fill='#93c5fd' stroke='#333' stroke-width='1'/><rect x='215' y='32' width='65' height='36' fill='#bbf7d0' stroke='#333' stroke-width='1'/><text x='95' y='55' font-size='13' fill='#333'>A 約75％</text><text x='224' y='55' font-size='12' fill='#333'>平地</text><text x='20' y='95' font-size='11' fill='#333'>日本の国土にしめる地形の割合</text></svg>","c":["山地","平野","台地","盆地"],"a":0,"e":"日本は国土の約4分の3が山地・丘陵地で、平地は約4分の1しかありません。そのため平野部に人口が集中しています。"},{"t":"日本の地形","q":"本州の中央部にある飛驒山脈・木曽山脈・赤石山脈をまとめて何と呼びますか。","c":["日本アルプス","フォッサマグナ","奥羽山脈","中国山地"],"a":0,"e":"3000m級の山が連なることから日本アルプスと呼ばれます。飛驒が北アルプス、木曽が中央アルプス、赤石が南アルプスです。"},{"t":"日本の地形","q":"本州の中央部を南北に走り、日本列島を東西に分ける大きな溝状の地形を何といいますか。","c":["フォッサマグナ","リアス海岸","カルデラ","三角州"],"a":0,"e":"フォッサマグナは大地溝帯ともいい、その西のふちが糸魚川・静岡構造線です。これを境に東日本と西日本で地形が異なります。"},{"t":"日本の地形","q":"日本で最も長い川はどれですか。","c":["信濃川","利根川","石狩川","北上川"],"a":0,"e":"信濃川は長野県から新潟県を流れる全長約367kmの日本最長の川です。長野県内では千曲川と呼ばれます。"},{"t":"日本の地形","q":"日本で最も流域面積が広い川はどれですか。","c":["利根川","信濃川","石狩川","木曽川"],"a":0,"e":"利根川は関東平野を流れ、流域面積が日本最大です。長さでは信濃川が日本一である点と区別して覚えましょう。"},{"t":"日本の地形","q":"日本で最も面積が広い平野はどこですか。","c":["関東平野","石狩平野","越後平野","濃尾平野"],"a":0,"e":"関東平野は日本最大の平野で、火山灰が積もった関東ロームにおおわれています。日本の人口のおよそ3分の1が関東地方に住んでいます。"},{"t":"日本の地形","q":"図のように、川が山地から平地に出るところに土砂が積もってできた扇形の地形を何といいますか。","fig":"<svg viewBox='0 0 280 150'><polygon points='15,62 65,15 115,62' fill='#e2e8f0' stroke='#94a3b8' stroke-width='1.5'/><polygon points='85,62 135,18 185,62' fill='#e2e8f0' stroke='#94a3b8' stroke-width='1.5'/><polygon points='105,62 55,132 175,132' fill='#fef3c7' stroke='#4a6cf7' stroke-width='2'/><line x1='105' y1='62' x2='118' y2='132' stroke='#4a6cf7' stroke-width='2'/><text x='20' y='50' font-size='11' fill='#333'>山地</text><text x='205' y='120' font-size='11' fill='#333'>平地</text></svg>","c":["扇状地","三角州","台地","リアス海岸"],"a":0,"e":"扇状地は水はけがよいため果樹園などに利用されます。山梨県の甲府盆地の扇状地はぶどうやももの産地として有名です。"},{"t":"日本の地形","q":"川が海や湖に注ぐ河口付近に、細かい土砂が積もってできた低く平らな地形を何といいますか。","c":["三角州","扇状地","カルデラ","砂丘"],"a":0,"e":"三角州はデルタともいい、水を得やすいため水田や市街地に利用されます。広島市は太田川の三角州の上に発達した都市です。"},{"t":"日本の地形","q":"山地が海に沈んでできた、出入りの複雑な海岸地形を何といいますか。","c":["リアス海岸","砂浜海岸","フィヨルド","大陸だな"],"a":0,"e":"リアス海岸は三陸海岸や志摩半島、若狭湾に見られます。波がおだやかで養殖に適する一方、津波の被害が大きくなりやすい地形です。"},{"t":"日本の気候","q":"下の雨温図が示す日本の気候区分はどれですか。","fig":"<svg viewBox='0 0 260 150'><line x1='35' y1='20' x2='35' y2='120' stroke='#333' stroke-width='1.5'/><line x1='35' y1='120' x2='240' y2='120' stroke='#333' stroke-width='1.5'/><text x='4' y='25' font-size='10' fill='#333'>30℃</text><text x='10' y='124' font-size='10' fill='#333'>0℃</text><rect x='45' y='50' width='12' height='70' fill='#93c5fd'/><rect x='75' y='75' width='12' height='45' fill='#93c5fd'/><rect x='105' y='95' width='12' height='25' fill='#93c5fd'/><rect x='135' y='85' width='12' height='35' fill='#93c5fd'/><rect x='165' y='80' width='12' height='40' fill='#93c5fd'/><rect x='195' y='60' width='12' height='60' fill='#93c5fd'/><polyline points='51,110 81,97 111,63 141,33 171,53 201,93' fill='none' stroke='#ef4444' stroke-width='2'/><text x='42' y='138' font-size='10' fill='#333'>1月</text><text x='190' y='138' font-size='10' fill='#333'>12月</text></svg>","c":["日本海側の気候","太平洋側の気候","瀬戸内の気候","南西諸島の気候"],"a":0,"e":"冬の降水量が多いのは、大陸からの北西の季節風が日本海で水分を含み大雪を降らせるためです。太平洋側は逆に冬が乾燥します。"},{"t":"日本の気候","q":"中国山地と四国山地にはさまれ、一年を通して降水量が少ない気候区分はどれですか。","c":["瀬戸内の気候","日本海側の気候","中央高地の気候","北海道の気候"],"a":0,"e":"瀬戸内は2つの山地が季節風をさえぎるため降水量が少なく、香川県では農業用のため池が多く作られてきました。"},{"t":"日本の気候","q":"夏と冬の気温差が大きく、年間の降水量が少ない内陸の気候区分はどれですか。","c":["中央高地の気候","太平洋側の気候","南西諸島の気候","日本海側の気候"],"a":0,"e":"中央高地（内陸性）の気候は海から離れているため気温の年較差が大きく、標高が高いので夏でもすずしいのが特徴です。"},{"t":"日本の気候","q":"一年を通して気温が高く、冬でも温暖な亜熱帯の気候が見られる地域はどこですか。","c":["南西諸島","北海道","中央高地","北陸"],"a":0,"e":"沖縄県などの南西諸島は年平均気温が20度を超え、台風の通り道になることが多く降水量も多い地域です。"},{"t":"日本の気候","q":"夏に東北地方の太平洋側に吹き、稲などに冷害をもたらすことがある冷たい北東の風を何といいますか。","c":["やませ","からっ風","おろし","フェーン"],"a":0,"e":"やませが続くと日照不足と低温で稲が育たず冷害が起こります。からっ風は冬に関東平野に吹く乾いた北西風です。"},{"t":"日本の人口","q":"図は現在の日本の人口ピラミッドです。この形を何といいますか。","fig":"<svg viewBox='0 0 300 172'><line x1='150' y1='18' x2='150' y2='154' stroke='#333' stroke-width='1'/><rect x='130' y='140' width='20' height='10' fill='#93c5fd'/><rect x='150' y='140' width='20' height='10' fill='#93c5fd'/><rect x='128' y='128' width='22' height='10' fill='#93c5fd'/><rect x='150' y='128' width='22' height='10' fill='#93c5fd'/><rect x='124' y='116' width='26' height='10' fill='#93c5fd'/><rect x='150' y='116' width='26' height='10' fill='#93c5fd'/><rect x='118' y='104' width='32' height='10' fill='#93c5fd'/><rect x='150' y='104' width='32' height='10' fill='#93c5fd'/><rect x='110' y='92' width='40' height='10' fill='#93c5fd'/><rect x='150' y='92' width='40' height='10' fill='#93c5fd'/><rect x='105' y='80' width='45' height='10' fill='#93c5fd'/><rect x='150' y='80' width='45' height='10' fill='#93c5fd'/><rect x='108' y='68' width='42' height='10' fill='#93c5fd'/><rect x='150' y='68' width='42' height='10' fill='#93c5fd'/><rect x='114' y='56' width='36' height='10' fill='#93c5fd'/><rect x='150' y='56' width='36' height='10' fill='#93c5fd'/><rect x='124' y='44' width='26' height='10' fill='#93c5fd'/><rect x='150' y='44' width='26' height='10' fill='#93c5fd'/><rect x='136' y='32' width='14' height='10' fill='#93c5fd'/><rect x='150' y='32' width='14' height='10' fill='#93c5fd'/><text x='60' y='168' font-size='11' fill='#333'>男</text><text x='230' y='168' font-size='11' fill='#333'>女</text><text x='10' y='40' font-size='10' fill='#333'>高齢</text><text x='10' y='150' font-size='10' fill='#333'>年少</text></svg>","c":["つぼ型","富士山型","つりがね型","ひょうたん型"],"a":0,"e":"子どもが少なく高齢者の割合が高いつぼ型は、少子高齢化が進んだ社会を表します。発展途上国に多いのは富士山型です。"},{"t":"日本の人口","q":"農村や山間部・離島などで人口が減り続け、地域社会の維持が難しくなる現象を何といいますか。","c":["過疎","過密","ドーナツ化現象","都心回帰"],"a":0,"e":"過疎地域では学校や病院、公共交通の維持が難しくなります。逆に大都市で人口が集中しすぎる状態を過密といいます。"},{"t":"資源とエネルギー","q":"日本が石油を最も多く輸入している地域はどこですか。","c":["西アジア","東南アジア","アフリカ","南アメリカ"],"a":0,"e":"日本は石油の大部分をサウジアラビアやアラブ首長国連邦など西アジアの国から輸入しており、特定地域への依存が課題です。"},{"t":"日本の農業","q":"大都市の周辺で、新鮮な野菜などを大消費地に出荷する農業を何といいますか。","c":["近郊農業","促成栽培","抑制栽培","焼畑農業"],"a":0,"e":"近郊農業は輸送費が安く新鮮なまま届けられる利点があります。千葉県や茨城県、埼玉県などでさかんです。"},{"t":"日本の農業","q":"高知平野や宮崎平野で、ビニールハウスなどを使って野菜の出荷時期を早める栽培方法を何といいますか。","c":["促成栽培","抑制栽培","二毛作","輪作"],"a":0,"e":"促成栽培は他の産地の出荷が少ない時期に出荷でき、高く売れる利点があります。なすやピーマン、きゅうりなどが作られます。"},{"t":"日本の農業","q":"長野県や群馬県の高原で、レタスなどの出荷時期を遅らせる栽培方法を何といいますか。","c":["抑制栽培","促成栽培","近郊農業","栽培漁業"],"a":0,"e":"高原のすずしい気候を利用した抑制栽培で作られる野菜を高原野菜といいます。群馬県嬬恋村のキャベツが有名です。"},{"t":"日本の水産業","q":"卵からかえした稚魚をある程度育てて海に放流し、成長したものをとる漁業を何といいますか。","c":["栽培漁業","養殖業","遠洋漁業","沖合漁業"],"a":0,"e":"栽培漁業は途中で放流する点が、出荷まで人の管理下で育てる養殖業と異なります。どちらも育てる漁業と呼ばれます。"},{"t":"日本の工業","q":"関東地方南部から九州北部にかけて、工業地帯・工業地域が帯状に連なる地域を何といいますか。","c":["太平洋ベルト","環太平洋造山帯","フォッサマグナ","シリコンロード"],"a":0,"e":"太平洋ベルトは原料の輸入や製品の輸出に便利な臨海部に発達しました。日本の工業生産の大部分がここに集中しています。"},{"t":"日本の工業","q":"グラフのAは製造品出荷額が日本最大の工業地帯です。どれですか。","fig":"<svg viewBox='0 0 280 160'><line x1='40' y1='14' x2='40' y2='130' stroke='#333' stroke-width='1.5'/><line x1='40' y1='130' x2='268' y2='130' stroke='#333' stroke-width='1.5'/><rect x='60' y='20' width='34' height='110' fill='#93c5fd'/><rect x='115' y='67' width='34' height='63' fill='#93c5fd'/><rect x='170' y='81' width='34' height='49' fill='#93c5fd'/><rect x='225' y='111' width='34' height='19' fill='#93c5fd'/><text x='72' y='146' font-size='12' fill='#333'>A</text><text x='127' y='146' font-size='12' fill='#333'>B</text><text x='182' y='146' font-size='12' fill='#333'>C</text><text x='237' y='146' font-size='12' fill='#333'>D</text><text x='44' y='11' font-size='10' fill='#333'>製造品出荷額</text></svg>","c":["中京工業地帯","阪神工業地帯","京浜工業地帯","北九州工業地域"],"a":0,"e":"中京工業地帯は愛知県豊田市の自動車工業を中心に、製造品出荷額が全国第1位です。機械工業の割合がとても高いのが特徴です。"},{"t":"資源とエネルギー","q":"グラフのAは日本の発電量の中で最も大きな割合を占めています。どの発電方法ですか。","fig":"<svg viewBox='0 0 300 130'><rect x='15' y='35' width='205' height='34' fill='#93c5fd' stroke='#333' stroke-width='1'/><rect x='220' y='35' width='22' height='34' fill='#fde68a' stroke='#333' stroke-width='1'/><rect x='242' y='35' width='43' height='34' fill='#bbf7d0' stroke='#333' stroke-width='1'/><text x='105' y='58' font-size='14' fill='#333'>A</text><text x='226' y='58' font-size='14' fill='#333'>B</text><text x='258' y='58' font-size='14' fill='#333'>C</text><text x='15' y='95' font-size='11' fill='#333'>日本の発電量の内訳（Aが最も多い）</text></svg>","c":["火力発電","水力発電","原子力発電","風力発電"],"a":0,"e":"日本は石油・石炭・天然ガスを燃やす火力発電が中心で、発電量の4分の3ほどを占めます。二酸化炭素の排出が多いため、再生可能エネルギーの拡大が課題です。"}],"3":[{"t":"九州地方","q":"熊本県にある阿蘇山に見られる、噴火によってできた世界最大級のくぼ地を何といいますか。","c":["カルデラ","三角州","扇状地","リアス海岸"],"a":0,"e":"カルデラは噴火で山頂部が陥没してできた地形です。阿蘇山のカルデラの中には市街地や水田が広がっています。"},{"t":"九州地方","q":"鹿児島県から宮崎県南部に広がる、火山の噴出物が積もってできた台地を何といいますか。","c":["シラス台地","関東ローム","武蔵野台地","根釧台地"],"a":0,"e":"シラス台地は水もちが悪く稲作に向かないため、さつまいもや茶の栽培、畜産がさかんに行われています。"},{"t":"九州地方","q":"沖縄県が現在もかかえている大きな課題として、面積の約8％を占めているものは何ですか。","c":["アメリカ軍の基地","国立公園","石油コンビナート","水力発電のダム"],"a":0,"e":"沖縄県には日本のアメリカ軍専用施設の約7割が集中し、騒音や事故などの問題があります。観光業は県の主要産業です。"},{"t":"九州地方","q":"1901年に操業を始め、北九州工業地域の発展のもとになった官営の製鉄所は何ですか。","c":["八幡製鉄所","富岡製糸場","足尾銅山","石見銀山"],"a":0,"e":"八幡製鉄所は近くの筑豊炭田の石炭と中国から輸入した鉄鉱石を利用して建設されました。現在は世界文化遺産に登録されています。"},{"t":"中国四国地方","q":"図のように本州と四国を結ぶ3つのルートに架けられた橋を、まとめて何といいますか。","fig":"<svg viewBox='0 0 300 150'><rect x='10' y='14' width='280' height='30' fill='#e2e8f0' stroke='#94a3b8' stroke-width='1.5'/><text x='128' y='34' font-size='13' fill='#333'>本州</text><rect x='10' y='104' width='280' height='30' fill='#e2e8f0' stroke='#94a3b8' stroke-width='1.5'/><text x='128' y='124' font-size='13' fill='#333'>四国</text><line x1='60' y1='44' x2='60' y2='104' stroke='#4a6cf7' stroke-width='3'/><line x1='150' y1='44' x2='150' y2='104' stroke='#4a6cf7' stroke-width='3'/><line x1='240' y1='44' x2='240' y2='104' stroke='#4a6cf7' stroke-width='3'/><text x='66' y='78' font-size='11' fill='#333'>ルート1</text><text x='156' y='78' font-size='11' fill='#333'>ルート2</text><text x='246' y='78' font-size='11' fill='#333'>ルート3</text></svg>","c":["本州四国連絡橋","青函トンネル","関門橋","東京湾アクアライン"],"a":0,"e":"本州四国連絡橋は児島・坂出ルート（瀬戸大橋）、神戸・鳴門ルート、尾道・今治ルートの3つがあり、移動時間が大きく短縮されました。"},{"t":"中国四国地方","q":"倉敷市水島や周南市などで、石油化学コンビナートが発達している工業地域はどれですか。","c":["瀬戸内工業地域","京葉工業地域","東海工業地域","北陸工業地域"],"a":0,"e":"瀬戸内工業地域は塩田や軍用地の跡地を利用して発展しました。化学工業の割合が高いのが特徴です。"},{"t":"中国四国地方","q":"グラフのA・Bはなすの出荷量の変化を表しています。高知県にあたるものと、その栽培方法の組み合わせとして正しいものはどれですか。","fig":"<svg viewBox='0 0 300 165'><line x1='35' y1='18' x2='35' y2='128' stroke='#333' stroke-width='1.5'/><line x1='35' y1='128' x2='288' y2='128' stroke='#333' stroke-width='1.5'/><polyline points='45,40 66,38 87,45 108,55 129,75 150,100 171,110 192,108 213,100 234,85 255,60 276,45' fill='none' stroke='#ef4444' stroke-width='2'/><polyline points='45,118 66,115 87,105 108,90 129,70 150,50 171,42 192,45 213,55 234,75 255,100 276,114' fill='none' stroke='#93c5fd' stroke-width='2'/><text x='48' y='34' font-size='12' fill='#333'>A</text><text x='166' y='36' font-size='12' fill='#333'>B</text><text x='40' y='145' font-size='10' fill='#333'>1月</text><text x='258' y='145' font-size='10' fill='#333'>12月</text><text x='8' y='16' font-size='10' fill='#333'>出荷量</text></svg>","c":["A・促成栽培","A・抑制栽培","B・促成栽培","B・抑制栽培"],"a":0,"e":"高知平野では温暖な気候とビニールハウスを利用した促成栽培で、他産地の出荷が少ない冬から春に多く出荷しています。夏を中心に出荷するBとは時期がずれています。"},{"t":"近畿地方","q":"近畿地方にある、日本最大の面積をもつ湖はどれですか。","c":["琵琶湖","猪苗代湖","霞ヶ浦","浜名湖"],"a":0,"e":"滋賀県にある琵琶湖は日本最大の湖で、京阪神地方の水がめと呼ばれています。流れ出る唯一の川は瀬田川で、下流では淀川となって大阪湾に注ぎます。"},{"t":"近畿地方","q":"京都市が歴史的な町並みを守るために行っている取り組みとして正しいものはどれですか。","c":["建物の高さやデザインを条例で規制している","古い木造建築をすべて取りこわしている","市内での観光を全面的に禁止している","すべての道路を石畳に作りかえている"],"a":0,"e":"京都市は景観条例で建物の高さや看板の色を制限し、町家の保存を進めています。京都と奈良は古都として世界文化遺産があります。"},{"t":"近畿地方","q":"大阪府と兵庫県を中心に発達し、中小工場が多いことで知られる工業地帯はどれですか。","c":["阪神工業地帯","京浜工業地帯","中京工業地帯","北九州工業地域"],"a":0,"e":"阪神工業地帯は東大阪市などに高い技術をもつ中小工場が多く集まっています。金属工業の割合が比較的高いのも特徴です。"},{"t":"近畿地方","q":"降水量が多く、すぎやひのきの人工林が広がる林業のさかんな山地はどこですか。","c":["紀伊山地","中国山地","奥羽山脈","越後山脈"],"a":0,"e":"紀伊山地では吉野すぎや尾鷲ひのきなどのブランド材が生産されています。ただし林業従事者の高齢化と後継者不足が課題です。"},{"t":"中部地方","q":"中部地方を3つの地域に分けたとき、正しい組み合わせはどれですか。","c":["東海・中央高地・北陸","東海・山陰・北陸","関東・中央高地・北陸","東海・中央高地・山陽"],"a":0,"e":"太平洋側が東海、内陸部が中央高地、日本海側が北陸です。それぞれ気候も産業も大きく異なります。"},{"t":"中部地方","q":"日本最大の自動車工業の中心地となっている、愛知県の都市はどこですか。","c":["豊田市","浜松市","四日市市","富山市"],"a":0,"e":"豊田市には自動車の組み立て工場と多数の関連工場が集まり、企業城下町となっています。中京工業地帯の中心です。"},{"t":"中部地方","q":"福井県鯖江市が国内生産の大半を占める、地場産業の製品は何ですか。","c":["眼鏡のフレーム","南部鉄器","西陣織","輪島塗"],"a":0,"e":"鯖江市は冬の農閑期の副業から発展し、眼鏡フレームの国内生産の9割以上を占めます。北陸は雪の多い冬の副業から地場産業が発達しました。"},{"t":"中部地方","q":"山梨県の甲府盆地の扇状地で、生産量が全国有数となっている果物はどれですか。","c":["ぶどう","みかん","りんご","さくらんぼ"],"a":0,"e":"甲府盆地では水はけのよい扇状地を生かしてぶどうやももが栽培されています。りんごは青森県、さくらんぼは山形県が全国一です。"},{"t":"中部地方","q":"愛知県の渥美半島で、夜間に照明を当てて開花時期を遅らせて出荷する花は何ですか。","c":["電照菊","チューリップ","ラベンダー","バラ"],"a":0,"e":"電照菊は温室で照明を当てて成長を調整する施設園芸農業の代表例です。渥美半島は豊川用水の整備で農業がさかんになりました。"},{"t":"関東地方","q":"政治・経済・文化の機能が東京に集中している状態を何といいますか。","c":["一極集中","過疎化","ドーナツ化現象","モータリゼーション"],"a":0,"e":"東京への一極集中により、住宅価格の高騰や通勤ラッシュ、災害時のリスクなどの問題が生じています。"},{"t":"関東地方","q":"関東平野の台地をおおう、火山灰が積もってできた赤土を何といいますか。","c":["関東ローム","シラス","黒ぼく","客土"],"a":0,"e":"関東ロームは富士山や浅間山などの火山灰が積もったものです。水が得にくいため台地は畑や住宅地に利用されてきました。"},{"t":"関東地方","q":"千葉県の東京湾沿いに広がり、化学工業と金属工業の割合がとくに高い工業地域はどこですか。","c":["京葉工業地域","京浜工業地帯","北関東工業地域","東海工業地域"],"a":0,"e":"京葉工業地域は埋め立て地に石油化学コンビナートや製鉄所が並びます。内陸の北関東工業地域は高速道路沿いに工業団地が発達しました。"},{"t":"東北地方","q":"三陸海岸の入り江でわかめやかきの養殖がさかんな理由として最も適切なものはどれですか。","c":["リアス海岸で波がおだやかだから","水深がとても浅いから","一年中水温が高いから","川がまったく流れこまないから"],"a":0,"e":"三陸海岸はリアス海岸で波がおだやかなため養殖に適しています。沖合は暖流と寒流がぶつかる潮目で好漁場になっています。"},{"t":"東北地方","q":"岩手県盛岡市などで作られている、国の伝統的工芸品に指定された鉄製品は何ですか。","c":["南部鉄器","会津塗","天童将棋駒","樺細工"],"a":0,"e":"南部鉄器は江戸時代から続く岩手県の伝統的工芸品です。東北地方は雪深い冬の副業として工芸品づくりが発達しました。"},{"t":"東北地方","q":"東北三大祭りのうち、青森県で行われる祭りはどれですか。","c":["ねぶた祭","竿燈まつり","七夕まつり","花笠まつり"],"a":0,"e":"青森のねぶた祭、秋田の竿燈まつり、仙台の七夕まつりが東北三大祭りです。もとは豊作を祈る農業の行事と結びついていました。"},{"t":"東北地方","q":"山形県にあり、最上川の下流に広がる稲作のさかんな平野はどこですか。","c":["庄内平野","秋田平野","仙台平野","越後平野"],"a":0,"e":"庄内平野は最上川がもたらした肥よくな土と豊富な雪どけ水を生かした日本有数の米どころです。東北地方は日本の穀倉地帯です。"},{"t":"北海道地方","q":"日本有数の畑作地帯で、小麦・じゃがいも・てんさいなどを輪作している平野はどこですか。","c":["十勝平野","石狩平野","根釧台地","越後平野"],"a":0,"e":"十勝平野では同じ作物を続けて作らない輪作を行い、地力の低下を防いでいます。てんさいは砂糖の原料になります。"},{"t":"北海道地方","q":"北海道東部にあり、乳牛を飼って牛乳や乳製品を生産する酪農がとくにさかんな地域はどこですか。","c":["根釧台地","十勝平野","石狩平野","上川盆地"],"a":0,"e":"根釧台地は夏でも冷涼で濃霧が発生しやすく作物が育ちにくいため、酪農が発達しました。北海道は生乳生産量が全国第1位です。"},{"t":"北海道地方","q":"北海道の先住民で、独自の言語や文化をもつ人々を何といいますか。","c":["アイヌ民族","琉球民族","アボリジニ","イヌイット"],"a":0,"e":"アイヌ民族は独自の言語や信仰をもち、地名にもアイヌ語が多く残っています。2019年にアイヌ施策推進法が制定されました。"},{"t":"等高線","q":"図の等高線について、A側とB側の斜面を比べた説明として正しいものはどれですか。","fig":"<svg viewBox='0 0 260 160'><ellipse cx='90' cy='80' rx='75' ry='60' fill='none' stroke='#94a3b8' stroke-width='1.5'/><ellipse cx='101' cy='80' rx='57' ry='45' fill='none' stroke='#94a3b8' stroke-width='1.5'/><ellipse cx='113' cy='80' rx='38' ry='30' fill='none' stroke='#94a3b8' stroke-width='1.5'/><ellipse cx='124' cy='80' rx='20' ry='15' fill='none' stroke='#94a3b8' stroke-width='1.5'/><text x='20' y='85' font-size='14' fill='#333'>A</text><text x='176' y='85' font-size='14' fill='#333'>B</text><text x='92' y='154' font-size='11' fill='#333'>等高線のようす</text></svg>","c":["B側のほうが等高線の間隔がせまいので傾斜が急である","A側のほうが等高線の間隔がせまいので傾斜が急である","B側のほうが等高線の間隔が広いので傾斜が急である","A側とB側の傾斜は同じである"],"a":0,"e":"等高線の間隔がせまいほど傾斜は急、広いほどゆるやかです。等高線が輪のように閉じているところは山頂を表します。"},{"t":"等高線","q":"図のP地点の標高として最も適切なものはどれですか。","fig":"<svg viewBox='0 0 280 150'><ellipse cx='120' cy='80' rx='95' ry='58' fill='none' stroke='#94a3b8' stroke-width='1.5'/><ellipse cx='120' cy='80' rx='70' ry='43' fill='none' stroke='#94a3b8' stroke-width='1.5'/><ellipse cx='120' cy='80' rx='45' ry='28' fill='none' stroke='#94a3b8' stroke-width='1.5'/><ellipse cx='120' cy='80' rx='20' ry='13' fill='none' stroke='#94a3b8' stroke-width='1.5'/><text x='217' y='84' font-size='11' fill='#333'>50m</text><text x='192' y='84' font-size='11' fill='#333'>60m</text><text x='167' y='84' font-size='11' fill='#333'>70m</text><text x='142' y='84' font-size='11' fill='#333'>80m</text><circle cx='120' cy='100' r='3.5' fill='#ef4444'/><text x='126' y='104' font-size='13' fill='#333'>P</text></svg>","c":["約75m","約55m","約65m","約95m"],"a":0,"e":"P地点は70mの等高線と80mの等高線の間にあるので、標高は70mより高く80mより低くなります。中心に近づくほど標高が高くなります。"},{"t":"縮尺","q":"2万5千分の1の地形図上で4cmの長さは、実際には何mですか。","fig":"<svg viewBox='0 0 290 110'><line x1='40' y1='55' x2='240' y2='55' stroke='#4a6cf7' stroke-width='3'/><line x1='40' y1='44' x2='40' y2='66' stroke='#333' stroke-width='2'/><line x1='240' y1='44' x2='240' y2='66' stroke='#333' stroke-width='2'/><text x='126' y='38' font-size='14' fill='#333'>4cm</text><text x='40' y='90' font-size='11' fill='#333'>2万5千分の1の地形図上の長さ</text></svg>","c":["1000m","250m","500m","2500m"],"a":0,"e":"4cm×25000＝100000cm＝1000m（1km）です。2万5千分の1の地形図では、主曲線は10mごとに引かれます。"},{"t":"地図記号","q":"次の地図記号のうち、神社を表すものはどれですか。","fig":"<svg viewBox='0 0 300 140'><line x1='22' y1='34' x2='68' y2='34' stroke='#333' stroke-width='4'/><line x1='27' y1='46' x2='63' y2='46' stroke='#333' stroke-width='4'/><line x1='33' y1='34' x2='33' y2='80' stroke='#333' stroke-width='4'/><line x1='57' y1='34' x2='57' y2='80' stroke='#333' stroke-width='4'/><circle cx='108' cy='45' r='7' fill='none' stroke='#333' stroke-width='2.5'/><circle cx='132' cy='45' r='7' fill='none' stroke='#333' stroke-width='2.5'/><circle cx='120' cy='68' r='7' fill='none' stroke='#333' stroke-width='2.5'/><circle cx='195' cy='55' r='24' fill='none' stroke='#333' stroke-width='2.5'/><text x='183' y='64' font-size='24' fill='#333'>〒</text><text x='250' y='70' font-size='30' fill='#333'>卍</text><text x='38' y='118' font-size='14' fill='#333'>ア</text><text x='113' y='118' font-size='14' fill='#333'>イ</text><text x='188' y='118' font-size='14' fill='#333'>ウ</text><text x='258' y='118' font-size='14' fill='#333'>エ</text></svg>","c":["ア","イ","ウ","エ"],"a":0,"e":"アは鳥居をかたどった神社の記号です。イは果樹園、ウは郵便局、エは寺院を表します。"}],"4":[{"t":"古代文明","q":"チグリス川・ユーフラテス川の流域におこったメソポタミア文明で使われた文字は何ですか。","c":["くさび形文字","象形文字","甲骨文字","アルファベット"],"a":0,"e":"メソポタミア文明では粘土板にくさび形文字が刻まれ、月の満ち欠けをもとにした太陰暦や60進法が生まれました。"},{"t":"古代文明","q":"ナイル川の流域におこり、ピラミッドや太陽暦で知られる文明は何ですか。","c":["エジプト文明","インダス文明","中国文明","メソポタミア文明"],"a":0,"e":"エジプト文明ではナイル川のはんらんの時期を知るため天文学が発達し、太陽暦が作られました。文字は象形文字が使われました。"},{"t":"古代文明","q":"中国文明の殷（いん）で、占いの結果を亀の甲や牛の骨に刻むのに使われた文字は何ですか。","c":["甲骨文字","くさび形文字","象形文字","かな文字"],"a":0,"e":"甲骨文字は漢字のもとになった文字です。中国文明は黄河や長江の流域におこりました。"},{"t":"縄文時代","q":"縄文時代の人々が食べ物の残りかすなどを捨てた場所で、貝がらが積もってできた遺跡を何といいますか。","c":["貝塚","古墳","環濠集落","高床倉庫"],"a":0,"e":"貝塚からは当時の食生活が分かります。縄文時代の人々は表面に縄目の文様がついた縄文土器を使い、たて穴住居に住みました。"},{"t":"縄文時代","q":"縄文時代に、豊かな実りや安産などを祈るために作られたと考えられている土製の人形を何といいますか。","c":["土偶","埴輪","銅鐸","銅鏡"],"a":0,"e":"土偶は女性をかたどったものが多く、まじないに使われたと考えられています。埴輪は古墳の周りに置かれた素焼きの焼き物です。"},{"t":"弥生時代","q":"図のような、弥生時代に収穫した米をたくわえるために作られた建物を何といいますか。","fig":"<svg viewBox='0 0 260 150'><polygon points='60,55 130,22 200,55' fill='#fde68a' stroke='#333' stroke-width='2'/><rect x='70' y='55' width='120' height='40' fill='#fef3c7' stroke='#333' stroke-width='2'/><ellipse cx='85' cy='95' rx='14' ry='4' fill='#333'/><ellipse cx='130' cy='95' rx='14' ry='4' fill='#333'/><ellipse cx='175' cy='95' rx='14' ry='4' fill='#333'/><line x1='85' y1='97' x2='85' y2='130' stroke='#333' stroke-width='3'/><line x1='130' y1='97' x2='130' y2='130' stroke='#333' stroke-width='3'/><line x1='175' y1='97' x2='175' y2='130' stroke='#333' stroke-width='3'/><line x1='50' y1='130' x2='210' y2='130' stroke='#94a3b8' stroke-width='2'/></svg>","c":["高床倉庫","たて穴住居","寝殿造","書院造"],"a":0,"e":"高床倉庫は湿気やねずみの害を防ぐくふうがされています。弥生時代には稲作が広まり、金属器（青銅器・鉄器）も伝わりました。"},{"t":"弥生時代","q":"福岡県の志賀島で発見された、漢委奴国王と刻まれた金印を授けたのはどの国ですか。","c":["後漢","魏","隋","唐"],"a":0,"e":"57年に倭の奴国の王が後漢の皇帝から金印を授かったと後漢書東夷伝に記されています。当時の日本が中国と交流していた証拠です。"},{"t":"弥生時代","q":"魏志倭人伝に記された、邪馬台国を治め30ほどの国を従えていた女王は誰ですか。","c":["卑弥呼","推古天皇","持統天皇","紫式部"],"a":0,"e":"卑弥呼は239年に魏に使いを送り、親魏倭王の称号と金印、銅鏡を授かりました。まじないによって政治を行ったとされます。"},{"t":"古墳時代","q":"図のような形をした、大王や豪族の墓を何といいますか。","fig":"<svg viewBox='0 0 260 145'><circle cx='178' cy='68' r='45' fill='#dbeafe' stroke='#4a6cf7' stroke-width='2'/><polygon points='55,35 135,55 135,81 55,101' fill='#dbeafe' stroke='#4a6cf7' stroke-width='2'/><text x='62' y='132' font-size='11' fill='#333'>前方部</text><text x='155' y='132' font-size='11' fill='#333'>後円部</text></svg>","c":["前方後円墳","円墳","方墳","貝塚"],"a":0,"e":"前方後円墳は日本独特の形の古墳です。大阪府堺市の大仙古墳（仁徳天皇陵古墳）は日本最大の前方後円墳です。"},{"t":"古墳時代","q":"3世紀後半から奈良盆地を中心に成立し、各地の豪族を従えていった政権を何といいますか。","c":["大和政権","室町幕府","邪馬台国","平氏政権"],"a":0,"e":"大和政権（ヤマト王権）の王は大王と呼ばれ、のちの天皇につながります。5世紀には九州から東北南部まで勢力を広げました。"},{"t":"古墳時代","q":"朝鮮半島や中国から日本へ移り住み、須恵器や機織り、漢字や儒学などを伝えた人々を何といいますか。","c":["渡来人","国司","防人","御家人"],"a":0,"e":"渡来人は土木技術や文字、仏教なども伝え、大和政権の記録や財政の仕事も担いました。日本の文化に大きな影響をあたえました。"},{"t":"飛鳥時代","q":"593年に推古天皇の摂政となり、天皇中心の政治をめざした人物は誰ですか。","c":["聖徳太子","蘇我馬子","中大兄皇子","中臣鎌足"],"a":0,"e":"聖徳太子（厩戸皇子）は蘇我馬子と協力して政治を進めました。冠位十二階や十七条の憲法を定めたことで知られます。"},{"t":"飛鳥時代","q":"603年に定められた、家がらによらず能力や功績のある人を役人に取り立てる制度は何ですか。","c":["冠位十二階","十七条の憲法","班田収授法","御成敗式目"],"a":0,"e":"冠位十二階では冠の色で位を示しました。それまでの氏姓制度による家がら重視の人事を改めるねらいがありました。"},{"t":"飛鳥時代","q":"604年に定められた、役人の心構えを示した和をもって貴しとなすで始まるきまりは何ですか。","c":["十七条の憲法","大宝律令","御成敗式目","武家諸法度"],"a":0,"e":"十七条の憲法は仏教や儒学の考えを取り入れ、天皇の命令に従うことなど役人としての心構えを示しました。"},{"t":"飛鳥時代","q":"607年に遣隋使として中国へ派遣された人物は誰ですか。","c":["小野妹子","菅原道真","阿倍仲麻呂","鑑真"],"a":0,"e":"小野妹子は隋の皇帝煬帝に国書を届けました。対等な立場での外交をめざしたもので、多くの留学生も同行しました。"},{"t":"飛鳥文化","q":"聖徳太子が建てたと伝えられる、現存する世界最古の木造建築として知られる寺院はどれですか。","c":["法隆寺","東大寺","中尊寺金色堂","平等院鳳凰堂"],"a":0,"e":"奈良県の法隆寺は飛鳥文化を代表する建築で、世界文化遺産に登録されています。飛鳥文化は日本で最初の仏教文化です。"},{"t":"大化の改新","q":"年表の___にあてはまる語句は何ですか。","fig":"<svg viewBox='0 0 280 160'><line x1='62' y1='14' x2='62' y2='150' stroke='#94a3b8' stroke-width='2'/><circle cx='62' cy='30' r='4' fill='#4a6cf7'/><text x='8' y='34' font-size='11' fill='#333'>604年</text><text x='76' y='34' font-size='11' fill='#333'>十七条の憲法</text><circle cx='62' cy='68' r='4' fill='#ef4444'/><text x='8' y='72' font-size='11' fill='#333'>645年</text><text x='76' y='72' font-size='11' fill='#333'>___の改新が始まる</text><circle cx='62' cy='106' r='4' fill='#4a6cf7'/><text x='8' y='110' font-size='11' fill='#333'>701年</text><text x='76' y='110' font-size='11' fill='#333'>大宝律令ができる</text><circle cx='62' cy='144' r='4' fill='#4a6cf7'/><text x='8' y='148' font-size='11' fill='#333'>710年</text><text x='76' y='148' font-size='11' fill='#333'>平城京に都を移す</text></svg>","c":["大化","建武","天平","延暦"],"a":0,"e":"645年、中大兄皇子と中臣鎌足が蘇我蝦夷・入鹿を倒して始めた政治改革が大化の改新です。土地と人民を国のものとする公地・公民をめざしました。"},{"t":"飛鳥時代","q":"663年、日本が百済の復興を助けようとして唐と新羅の連合軍に敗れた戦いは何ですか。","c":["白村江の戦い","壬申の乱","元寇","壇ノ浦の戦い"],"a":0,"e":"白村江の戦いに敗れた日本は、唐や新羅の攻撃に備えて九州に水城や山城を築き、防人を置きました。"},{"t":"律令国家","q":"701年に唐の律令にならって定められ、律令国家のしくみを整えた法律は何ですか。","c":["大宝律令","十七条の憲法","御成敗式目","武家諸法度"],"a":0,"e":"大宝律令の律は刑罰、令は政治のきまりです。中央に二官八省、地方に国・郡・里が置かれ、国司には都から貴族が派遣されました。"},{"t":"律令国家","q":"6歳以上の人々に口分田をあたえ、死ぬと国に返させた制度を何といいますか。","c":["班田収授法","墾田永年私財法","楽市・楽座","地租改正"],"a":0,"e":"班田収授法は戸籍にもとづいて口分田を分けあたえる制度です。人口が増えて口分田が不足したことが、のちの開墾の奨励につながりました。"},{"t":"律令国家","q":"表のAにあてはまる、収穫した稲の約3％を納める税は何ですか。","fig":"<svg viewBox='0 0 300 130'><line x1='12' y1='12' x2='292' y2='12' stroke='#94a3b8' stroke-width='1'/><line x1='12' y1='45' x2='292' y2='45' stroke='#94a3b8' stroke-width='1'/><line x1='12' y1='78' x2='292' y2='78' stroke='#94a3b8' stroke-width='1'/><line x1='12' y1='111' x2='292' y2='111' stroke='#94a3b8' stroke-width='1'/><line x1='50' y1='12' x2='50' y2='111' stroke='#94a3b8' stroke-width='1'/><text x='24' y='34' font-size='14' fill='#333'>A</text><text x='60' y='34' font-size='12' fill='#333'>収穫した稲の約3％を納める</text><text x='24' y='67' font-size='14' fill='#333'>調</text><text x='60' y='67' font-size='12' fill='#333'>絹や地方の特産物を納める</text><text x='24' y='100' font-size='14' fill='#333'>庸</text><text x='60' y='100' font-size='12' fill='#333'>労役の代わりに布を納める</text></svg>","c":["租","雑徭","年貢","地租"],"a":0,"e":"租は稲、調は特産物、庸は布を納める税です。調と庸は自分で都まで運ばねばならず、農民の大きな負担になりました。"},{"t":"奈良時代","q":"図のように唐の都長安にならって碁盤の目状に区画され、710年に都が移された都はどこですか。","fig":"<svg viewBox='0 0 260 165'><rect x='30' y='32' width='200' height='110' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='70' y1='32' x2='70' y2='142' stroke='#94a3b8' stroke-width='1'/><line x1='110' y1='32' x2='110' y2='142' stroke='#94a3b8' stroke-width='1'/><line x1='150' y1='32' x2='150' y2='142' stroke='#94a3b8' stroke-width='1'/><line x1='190' y1='32' x2='190' y2='142' stroke='#94a3b8' stroke-width='1'/><line x1='30' y1='62' x2='230' y2='62' stroke='#94a3b8' stroke-width='1'/><line x1='30' y1='92' x2='230' y2='92' stroke='#94a3b8' stroke-width='1'/><line x1='30' y1='122' x2='230' y2='122' stroke='#94a3b8' stroke-width='1'/><rect x='110' y='10' width='40' height='22' fill='#dbeafe' stroke='#4a6cf7' stroke-width='2'/><text x='118' y='26' font-size='12' fill='#333'>宮</text><line x1='130' y1='32' x2='130' y2='142' stroke='#ef4444' stroke-width='2'/><text x='134' y='158' font-size='11' fill='#333'>朱雀大路</text></svg>","c":["平城京","平安京","藤原京","難波宮"],"a":0,"e":"710年に元明天皇が奈良に平城京をつくり、以後約80年間を奈良時代といいます。中央には朱雀大路が通っていました。"},{"t":"奈良時代","q":"743年に出され、新しく開墾した土地の永久私有を認めた法令は何ですか。","c":["墾田永年私財法","班田収授法","三世一身法","大宝律令"],"a":0,"e":"墾田永年私財法によって貴族や寺社が私有地を広げ、のちの荘園のもとになりました。公地・公民の原則がくずれるきっかけです。"},{"t":"奈良時代","q":"仏教の力で国を守ろうと考え、東大寺に大仏をつくらせた天皇は誰ですか。","c":["聖武天皇","桓武天皇","天武天皇","推古天皇"],"a":0,"e":"聖武天皇は国ごとに国分寺・国分尼寺を建て、都には東大寺と大仏をつくらせました。大仏づくりには行基が協力しました。"},{"t":"天平文化","q":"奈良時代につくられ、天皇や貴族から農民・防人まで幅広い人々の歌約4500首を集めた歌集は何ですか。","c":["万葉集","古今和歌集","新古今和歌集","風土記"],"a":0,"e":"万葉集は漢字の音を借りた万葉がなで書かれました。この時代の文化を、聖武天皇のころの年号から天平文化といいます。"},{"t":"平安時代","q":"794年に都を京都に移し、律令政治の立て直しをはかった天皇は誰ですか。","c":["桓武天皇","聖武天皇","天智天皇","後醍醐天皇"],"a":0,"e":"桓武天皇は寺院の政治への影響力を断つため長岡京を経て平安京に都を移しました。以後約400年を平安時代といいます。"},{"t":"平安時代","q":"唐から帰国し、比叡山に延暦寺を建てて天台宗を広めた僧は誰ですか。","c":["最澄","空海","法然","親鸞"],"a":0,"e":"最澄は天台宗を、空海は高野山金剛峯寺を中心に真言宗を広めました。ともに山奥の寺で厳しい修行を行う仏教です。"},{"t":"摂関政治","q":"図のように藤原氏が娘を天皇のきさきにして力をのばした、11世紀前半に最も栄えた人物は誰ですか。","fig":"<svg viewBox='0 0 290 135'><rect x='15' y='45' width='90' height='42' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='38' y='72' font-size='13' fill='#333'>藤原氏</text><rect x='185' y='45' width='90' height='42' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='214' y='72' font-size='13' fill='#333'>天皇</text><line x1='105' y1='66' x2='185' y2='66' stroke='#94a3b8' stroke-width='2'/><text x='106' y='36' font-size='11' fill='#333'>娘をきさきにする</text><text x='72' y='112' font-size='11' fill='#333'>生まれた子を次の天皇に立てる</text></svg>","c":["藤原道長","藤原純友","平清盛","菅原道真"],"a":0,"e":"藤原道長は4人の娘を天皇のきさきにし、この世をば我が世とぞ思ふとよむほど栄えました。子の頼通とともに摂関政治の全盛期を築きました。"},{"t":"国風文化","q":"平安時代に漢字をくずしたり一部をとったりしてつくられ、日本語の発音を書き表せるようになった文字を何といいますか。","c":["かな文字","甲骨文字","くさび形文字","万葉がな"],"a":0,"e":"かな文字により、紫式部の源氏物語や清少納言の枕草子など女性による文学が生まれました。遣唐使の停止後に発達した文化を国風文化といいます。"},{"t":"院政","q":"1086年、天皇の位をゆずったあとも上皇として政治を行う院政を始めた人物は誰ですか。","c":["白河上皇","後鳥羽上皇","後醍醐天皇","桓武天皇"],"a":0,"e":"白河上皇が始めた院政により、摂関政治はおとろえました。上皇のもとには荘園が集まり、警備のために武士が用いられました。"}],"5":[{"t":"平氏政権","q":"1159年に起こり、平清盛が源義朝を破って勢力を確立した戦いは何ですか。","c":["平治の乱","保元の乱","壇ノ浦の戦い","承久の乱"],"a":0,"e":"1156年の保元の乱に続いて起こった平治の乱で、平清盛は源氏をおさえて政治の実権をにぎりました。"},{"t":"平氏政権","q":"1167年に武士として初めて太政大臣となった人物は誰ですか。","c":["平清盛","源頼朝","北条時政","足利尊氏"],"a":0,"e":"平清盛は娘を天皇のきさきにし、生まれた子を天皇に立てるなど、藤原氏に似たやり方で権力をにぎりました。"},{"t":"平氏政権","q":"平清盛が兵庫の港（大輪田泊）を整備して力を入れた貿易は何ですか。","c":["日宋貿易","勘合貿易","南蛮貿易","朱印船貿易"],"a":0,"e":"日宋貿易で大量の宋銭が輸入され、日本の貨幣経済の発展につながりました。平氏の大きな収入源にもなりました。"},{"t":"鎌倉幕府","q":"1185年、平氏が源義経らに敗れてほろんだ戦いはどれですか。","c":["壇ノ浦の戦い","一ノ谷の戦い","平治の乱","応仁の乱"],"a":0,"e":"山口県の壇ノ浦の戦いで平氏はほろびました。同じ年、源頼朝は国ごとに守護、荘園や公領ごとに地頭を置くことを認められました。"},{"t":"鎌倉幕府","q":"源頼朝が1185年に国ごとに置いた、軍事・警察の仕事を行う役職は何ですか。","c":["守護","地頭","執権","国司"],"a":0,"e":"国ごとに守護、荘園や公領ごとに地頭が置かれました。地頭は年貢の取り立てと土地の管理を行いました。"},{"t":"鎌倉幕府","q":"1192年に征夷大将軍に任じられ、鎌倉に幕府を開いた人物は誰ですか。","c":["源頼朝","源義経","平清盛","北条泰時"],"a":0,"e":"源頼朝が開いた鎌倉幕府は日本初の本格的な武家政権です。鎌倉は三方を山、一方を海に囲まれた守りやすい地形でした。"},{"t":"鎌倉幕府","q":"図のAは、将軍が御家人に領地をあたえたり守ったりすることです。何といいますか。","fig":"<svg viewBox='0 0 290 140'><rect x='18' y='45' width='80' height='46' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='38' y='74' font-size='13' fill='#333'>将軍</text><rect x='192' y='45' width='80' height='46' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='206' y='74' font-size='13' fill='#333'>御家人</text><line x1='98' y1='58' x2='184' y2='58' stroke='#94a3b8' stroke-width='2'/><polygon points='192,58 180,52 180,64' fill='#94a3b8'/><text x='128' y='48' font-size='13' fill='#333'>A</text><line x1='192' y1='80' x2='106' y2='80' stroke='#94a3b8' stroke-width='2'/><polygon points='98,80 110,74 110,86' fill='#94a3b8'/><text x='128' y='104' font-size='13' fill='#333'>B</text></svg>","c":["御恩","奉公","年貢","徳政"],"a":0,"e":"将軍が領地を保障するのが御恩、御家人が命がけで戦うのが奉公（図のB）です。この土地を仲立ちとした主従関係を封建制度といいます。"},{"t":"執権政治","q":"図のAにあてはまる、北条氏が代々ついた将軍を補佐する役職は何ですか。","fig":"<svg viewBox='0 0 290 145'><rect x='110' y='8' width='70' height='26' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='128' y='27' font-size='13' fill='#333'>将軍</text><line x1='145' y1='34' x2='145' y2='50' stroke='#94a3b8' stroke-width='2'/><rect x='110' y='50' width='70' height='26' fill='none' stroke='#ef4444' stroke-width='2'/><text x='139' y='69' font-size='14' fill='#333'>A</text><line x1='145' y1='76' x2='145' y2='90' stroke='#94a3b8' stroke-width='2'/><line x1='45' y1='90' x2='245' y2='90' stroke='#94a3b8' stroke-width='2'/><line x1='45' y1='90' x2='45' y2='104' stroke='#94a3b8' stroke-width='2'/><line x1='145' y1='90' x2='145' y2='104' stroke='#94a3b8' stroke-width='2'/><line x1='245' y1='90' x2='245' y2='104' stroke='#94a3b8' stroke-width='2'/><rect x='12' y='104' width='66' height='26' fill='none' stroke='#94a3b8' stroke-width='1.5'/><text x='26' y='123' font-size='12' fill='#333'>侍所</text><rect x='112' y='104' width='66' height='26' fill='none' stroke='#94a3b8' stroke-width='1.5'/><text x='126' y='123' font-size='12' fill='#333'>政所</text><rect x='212' y='104' width='66' height='26' fill='none' stroke='#94a3b8' stroke-width='1.5'/><text x='222' y='123' font-size='12' fill='#333'>問注所</text></svg>","c":["執権","管領","老中","関白"],"a":0,"e":"源氏の将軍が3代で絶えたあと、北条氏が執権として政治の実権をにぎりました。これを執権政治といいます。管領は室町幕府の役職です。"},{"t":"執権政治","q":"1221年、後鳥羽上皇が幕府をたおそうとして兵をあげ、敗れた出来事は何ですか。","c":["承久の乱","壬申の乱","応仁の乱","保元の乱"],"a":0,"e":"承久の乱の後、幕府は京都に六波羅探題を置いて朝廷を監視しました。これにより幕府の支配は西日本にも広がりました。"},{"t":"執権政治","q":"1232年に北条泰時が定めた、武士の裁判の基準となる最初の武家法は何ですか。","c":["御成敗式目","大宝律令","武家諸法度","分国法"],"a":0,"e":"御成敗式目（貞永式目）は武士の慣習をもとにまとめられ、その後の武家法の手本となりました。全51か条からなります。"},{"t":"元寇","q":"1274年に元軍が九州北部にせめてきた出来事を何といいますか。","c":["文永の役","弘安の役","白村江の戦い","刀伊の入寇"],"a":0,"e":"1274年の文永の役と1281年の弘安の役をあわせて元寇といいます。元軍の集団戦法とてつはうに日本の武士は苦戦しました。"},{"t":"元寇","q":"元寇のときに幕府の執権として元の要求をしりぞけた人物は誰ですか。","c":["北条時宗","北条泰時","北条時政","足利義満"],"a":0,"e":"北条時宗はフビライ・ハンの服属要求を拒否しました。元寇後、幕府は防衛費と恩賞不足で御家人の信頼を失っていきます。"},{"t":"鎌倉幕府","q":"1297年、生活に苦しむ御家人を救うため、手放した土地をただで取りもどさせた幕府の命令は何ですか。","c":["永仁の徳政令","墾田永年私財法","楽市・楽座令","刀狩令"],"a":0,"e":"永仁の徳政令は一時的な効果しかなく、かえって経済を混乱させました。御家人の不満は幕府のおとろえにつながりました。"},{"t":"鎌倉文化","q":"東大寺南大門の金剛力士像をつくった、力強い写実的な作風で知られる仏師は誰ですか。","c":["運慶","雪舟","世阿弥","行基"],"a":0,"e":"金剛力士像は運慶や快慶らによってつくられました。武士の気風を反映した力強い写実的な作風が鎌倉文化の特徴です。"},{"t":"鎌倉文化","q":"源平の戦いをえがき、琵琶法師によって語り広められた軍記物は何ですか。","c":["平家物語","源氏物語","徒然草","方丈記"],"a":0,"e":"平家物語は祇園精舎の鐘の声で始まり、文字を読めない人々にも琵琶法師によって語り伝えられました。"},{"t":"鎌倉新仏教","q":"念仏（南無阿弥陀仏）を唱えれば救われると説き、浄土宗を開いた僧は誰ですか。","c":["法然","親鸞","日蓮","栄西"],"a":0,"e":"法然は浄土宗を開き、ひたすら念仏を唱えることを説きました。弟子の親鸞は浄土真宗を開いています。"},{"t":"鎌倉新仏教","q":"悪人こそ救われるという考えを説き、浄土真宗（一向宗）を開いた僧は誰ですか。","c":["親鸞","法然","一遍","道元"],"a":0,"e":"親鸞は法然の弟子で、浄土真宗を開きました。一遍は踊念仏で教えを広める時宗を開いています。"},{"t":"鎌倉新仏教","q":"題目（南無妙法蓮華経）を唱えれば救われると説いた僧は誰ですか。","c":["日蓮","法然","親鸞","一遍"],"a":0,"e":"日蓮は法華経を重んじる日蓮宗（法華宗）を開き、他宗を激しく批判したため迫害を受けました。"},{"t":"鎌倉新仏教","q":"座禅によってさとりを開こうとする禅宗のうち、曹洞宗を開いた僧は誰ですか。","c":["道元","栄西","法然","空海"],"a":0,"e":"道元は曹洞宗、栄西は臨済宗を開きました。禅宗は自分の力でさとりを求める教えで、武士に広く受け入れられました。"},{"t":"建武の新政","q":"年表を見て、___にあてはまる語句を答えなさい。","fig":"<svg viewBox='0 0 280 160'><line x1='62' y1='14' x2='62' y2='150' stroke='#94a3b8' stroke-width='2'/><circle cx='62' cy='30' r='4' fill='#4a6cf7'/><text x='6' y='34' font-size='11' fill='#333'>1221年</text><text x='78' y='34' font-size='11' fill='#333'>承久の乱</text><circle cx='62' cy='68' r='4' fill='#4a6cf7'/><text x='6' y='72' font-size='11' fill='#333'>1274年</text><text x='78' y='72' font-size='11' fill='#333'>文永の役</text><circle cx='62' cy='106' r='4' fill='#4a6cf7'/><text x='6' y='110' font-size='11' fill='#333'>1333年</text><text x='78' y='110' font-size='11' fill='#333'>鎌倉幕府がほろびる</text><circle cx='62' cy='144' r='4' fill='#ef4444'/><text x='6' y='148' font-size='11' fill='#333'>1334年</text><text x='78' y='148' font-size='11' fill='#333'>___の新政が始まる</text></svg>","c":["建武","大化","天平","延暦"],"a":0,"e":"鎌倉幕府をたおした後醍醐天皇が始めた天皇中心の政治を建武の新政といいます。武士の不満を招き、約2年でくずれました。"},{"t":"室町幕府","q":"1338年に征夷大将軍となり、京都に室町幕府を開いた人物は誰ですか。","c":["足利尊氏","足利義満","足利義政","後醍醐天皇"],"a":0,"e":"足利尊氏は建武の新政にそむいて京都に新しい天皇を立てました。吉野へのがれた後醍醐天皇の南朝と対立し、南北朝時代が始まります。"},{"t":"室町幕府","q":"1392年に南北朝を統一した3代将軍は誰ですか。","c":["足利義満","足利尊氏","足利義政","足利義昭"],"a":0,"e":"足利義満は南北朝を統一し、京都の北山に金閣を建てました。この時期の文化を北山文化といいます。"},{"t":"勘合貿易","q":"図のような合い札を使って正式な貿易船と倭寇を区別した、足利義満が始めた貿易は何ですか。","fig":"<svg viewBox='0 0 280 150'><rect x='26' y='24' width='86' height='58' fill='#fef3c7' stroke='#4a6cf7' stroke-width='2'/><rect x='168' y='24' width='86' height='58' fill='#fef3c7' stroke='#4a6cf7' stroke-width='2'/><text x='42' y='60' font-size='15' fill='#333'>合い札</text><text x='184' y='60' font-size='15' fill='#333'>合い札</text><line x1='112' y1='53' x2='168' y2='53' stroke='#94a3b8' stroke-width='2' stroke-dasharray='5 4'/><text x='122' y='44' font-size='11' fill='#333'>照合</text><text x='24' y='104' font-size='11' fill='#333'>日本の船が持参</text><text x='176' y='104' font-size='11' fill='#333'>明が保管</text><text x='30' y='134' font-size='11' fill='#333'>一致した船だけを正式な貿易船と認めた</text></svg>","c":["勘合貿易（日明貿易）","日宋貿易","南蛮貿易","朱印船貿易"],"a":0,"e":"1404年に始まった勘合貿易では、明から銅銭（永楽通宝）や生糸を輸入し、日本からは刀や銅を輸出しました。"},{"t":"室町文化","q":"明にわたって絵の技法を学び、日本の水墨画を大成した人物は誰ですか。","c":["雪舟","運慶","世阿弥","狩野永徳"],"a":0,"e":"雪舟は水墨画を芸術として大成しました。水墨画は墨の濃淡だけで自然をえがくもので、禅宗とともに中国から伝わりました。"},{"t":"琉球王国","q":"1429年に尚巴志が沖縄島を統一して建て、東アジアの中継貿易で栄えた国は何ですか。","c":["琉球王国","蝦夷地","朝鮮国","渤海"],"a":0,"e":"琉球王国は日本・明・東南アジアを結ぶ中継貿易で栄えました。同じころ蝦夷地ではアイヌの人々が本州の人々と交易していました。"},{"t":"土一揆","q":"室町時代に農民が団結して作った村の自治組織を何といいますか。","c":["惣","座","株仲間","五人組"],"a":0,"e":"惣では寄合を開いて村のおきてを決めました。団結した農民は徳政令を求めて土一揆を起こし、1428年の正長の土一揆が最初とされます。"},{"t":"応仁の乱","q":"年表の___にあてはまる、1467年に始まった戦乱の名を答えなさい。","fig":"<svg viewBox='0 0 280 160'><line x1='62' y1='14' x2='62' y2='150' stroke='#94a3b8' stroke-width='2'/><circle cx='62' cy='30' r='4' fill='#4a6cf7'/><text x='6' y='34' font-size='11' fill='#333'>1338年</text><text x='78' y='34' font-size='11' fill='#333'>室町幕府が開かれる</text><circle cx='62' cy='68' r='4' fill='#4a6cf7'/><text x='6' y='72' font-size='11' fill='#333'>1392年</text><text x='78' y='72' font-size='11' fill='#333'>南北朝の統一</text><circle cx='62' cy='106' r='4' fill='#4a6cf7'/><text x='6' y='110' font-size='11' fill='#333'>1404年</text><text x='78' y='110' font-size='11' fill='#333'>勘合貿易が始まる</text><circle cx='62' cy='144' r='4' fill='#ef4444'/><text x='6' y='148' font-size='11' fill='#333'>1467年</text><text x='78' y='148' font-size='11' fill='#333'>___の乱が始まる</text></svg>","c":["応仁","承久","保元","壬申"],"a":0,"e":"応仁の乱は8代将軍足利義政のあとつぎ争いなどから起こり、11年間続いて京都が焼け野原になりました。下剋上の風潮が広がります。"},{"t":"室町文化","q":"足利義政が京都の東山に建てた銀閣に取り入れられ、現在の和室のもとになった建築様式は何ですか。","fig":"<svg viewBox='0 0 280 150'><rect x='18' y='18' width='244' height='112' fill='none' stroke='#333' stroke-width='2'/><rect x='30' y='30' width='68' height='66' fill='#f1f5f9' stroke='#4a6cf7' stroke-width='2'/><text x='36' y='118' font-size='11' fill='#333'>床の間</text><rect x='120' y='30' width='130' height='58' fill='none' stroke='#94a3b8' stroke-width='1.5'/><line x1='163' y1='30' x2='163' y2='88' stroke='#94a3b8' stroke-width='1.5'/><line x1='206' y1='30' x2='206' y2='88' stroke='#94a3b8' stroke-width='1.5'/><text x='140' y='118' font-size='11' fill='#333'>障子・たたみ</text></svg>","c":["書院造","寝殿造","校倉造","権現造"],"a":0,"e":"書院造はたたみや障子、床の間を備えた様式です。寝殿造は平安時代の貴族の住宅の様式で、区別して覚えましょう。"},{"t":"室町文化","q":"足利義満の保護を受け、父の観阿弥とともに能を大成した人物は誰ですか。","c":["世阿弥","雪舟","運慶","千利休"],"a":0,"e":"観阿弥・世阿弥の父子が能を芸術として大成しました。能の合間には、民衆の生活をこっけいにえがく狂言が演じられました。"},{"t":"戦国大名","q":"戦国大名が領国を支配するために独自に定めた法律を何といいますか。","c":["分国法","御成敗式目","武家諸法度","大宝律令"],"a":0,"e":"分国法には家臣の争いを禁じるけんか両成敗などが定められました。戦国大名は城の周りに家臣や商人を集めた城下町をつくりました。"}],"6":[{"t":"桶狭間の戦い","q":"1560年、織田信長が今川義元を破った戦いを何といいますか。","c":["桶狭間の戦い","長篠の戦い","関ヶ原の戦い","川中島の戦い"],"a":0,"e":"少ない兵で今川義元を破った信長は一躍名を知られました。1573年には室町幕府をほろぼしています。"},{"t":"長篠の戦い","q":"1575年の長篠の戦いで、織田信長・徳川家康の連合軍が武田勝頼の騎馬隊を破るのに大きな役割を果たした武器は何ですか。","c":["鉄砲","大砲","弓矢","長い槍"],"a":0,"e":"信長は足軽鉄砲隊を組織して戦い方を変えました。鉄砲は1543年に種子島に伝わりました。"},{"t":"楽市・楽座","q":"織田信長が城下町の商工業をさかんにするために、市場の税を免除し座の特権を廃止した政策を何といいますか。","c":["楽市・楽座","刀狩","太閤検地","参勤交代"],"a":0,"e":"信長は安土城下などで楽市・楽座を行い、だれでも自由に商売できるようにしました。関所も廃止しています。"},{"t":"本能寺の変","q":"1582年、織田信長が家臣にそむかれて京都で自害した事件を何といいますか。","c":["本能寺の変","桜田門外の変","応仁の乱","承久の乱"],"a":0,"e":"信長にそむいたのは明智光秀です。光秀はまもなく豊臣秀吉に山崎の戦いで敗れました。"},{"t":"太閤検地","q":"豊臣秀吉が全国の田畑の面積や土地のよしあしを調べ、予想される収穫量を石高で表した政策を何といいますか。","c":["太閤検地","刀狩","楽市・楽座","地租改正"],"a":0,"e":"検地帳に耕作者が記され、農民は土地を耕す権利を認められる代わりに年貢を納める義務を負いました。"},{"t":"刀狩","q":"1588年に豊臣秀吉が出した、農民から刀や鉄砲などの武器を取り上げた命令を何といいますか。","c":["刀狩令","徳政令","異国船打払令","武家諸法度"],"a":0,"e":"検地と刀狩によって武士と農民の身分の区別がはっきりする兵農分離が進みました。"},{"t":"朝鮮侵略","q":"豊臣秀吉が明の征服をめざして2度にわたり大軍を送った国はどこですか。","c":["朝鮮","琉球","ベトナム","インド"],"a":0,"e":"1592年の文禄の役と1597年の慶長の役です。李舜臣の水軍などの抵抗にあい、秀吉の死で兵を引きあげました。"},{"t":"桃山文化","q":"安土桃山時代に「唐獅子図屏風」などの豪華な屏風絵をえがいた画家はだれですか。","c":["狩野永徳","雪舟","尾形光琳","葛飾北斎"],"a":0,"e":"大名の権力を示す壮大で豪華な桃山文化を代表する画家です。雪舟は室町時代の水墨画家です。"},{"t":"千利休","q":"質素なわび茶の作法を大成し、豊臣秀吉にも仕えた人物はだれですか。","c":["千利休","世阿弥","出雲の阿国","本阿弥光悦"],"a":0,"e":"千利休は茶の湯を芸術の域に高めました。出雲の阿国はかぶきおどりを始めた人物です。"},{"t":"関ヶ原の戦い","q":"1600年、徳川家康が石田三成らを破り、全国支配の実権をにぎるきっかけとなった戦いは何ですか。","c":["関ヶ原の戦い","桶狭間の戦い","壇ノ浦の戦い","大坂の陣"],"a":0,"e":"天下分け目の戦いとよばれます。大坂の陣は1614年から1615年に豊臣氏をほろぼした戦いです。"},{"t":"江戸幕府","q":"徳川家康が征夷大将軍に任じられ、江戸に幕府を開いたのは西暦何年ですか。","c":["1603年","1590年","1615年","1637年"],"a":0,"e":"家康はわずか2年で将軍職を子の秀忠にゆずり、徳川氏が代々将軍になることを示しました。"},{"t":"江戸幕府","q":"江戸幕府が大名を統制するために定めた法令は何ですか。","c":["武家諸法度","御成敗式目","禁中並公家諸法度","分国法"],"a":0,"e":"武家諸法度は1615年に定められ、参勤交代は3代将軍徳川家光のときに制度化されました。"},{"t":"参勤交代","q":"大名に1年おきに領地と江戸を往復させる参勤交代を制度として定めた3代将軍はだれですか。","c":["徳川家光","徳川家康","徳川吉宗","徳川綱吉"],"a":0,"e":"1635年の武家諸法度で制度化されました。往復の費用や江戸での生活費は大名の大きな負担になりました。"},{"t":"外様大名","q":"関ヶ原の戦いのころから徳川氏に従うようになり、江戸から遠い地域に配置された大名を何といいますか。","c":["外様大名","譜代大名","親藩","守護大名"],"a":0,"e":"徳川氏の一族が親藩、古くからの家臣が譜代大名です。譜代大名が幕府の重要な役職につきました。"},{"t":"幕府のしくみ","q":"下の図は江戸幕府のしくみです。___にあてはまる、政治全体をまとめた常置の最高職は何ですか。","fig":"<svg viewBox='0 0 300 145'><rect x='120' y='6' width='60' height='24' fill='none' stroke='#4a6cf7' stroke-width='1.5'/><text x='134' y='23' font-size='11' fill='#333'>将軍</text><line x1='150' y1='30' x2='150' y2='46' stroke='#94a3b8' stroke-width='1.5'/><rect x='110' y='46' width='80' height='24' fill='none' stroke='#4a6cf7' stroke-width='1.5'/><text x='138' y='64' font-size='13' fill='#333'>___</text><line x1='150' y1='70' x2='150' y2='84' stroke='#94a3b8' stroke-width='1.5'/><line x1='45' y1='84' x2='245' y2='84' stroke='#94a3b8' stroke-width='1.5'/><line x1='45' y1='84' x2='45' y2='98' stroke='#94a3b8' stroke-width='1.5'/><line x1='145' y1='84' x2='145' y2='98' stroke='#94a3b8' stroke-width='1.5'/><line x1='245' y1='84' x2='245' y2='98' stroke='#94a3b8' stroke-width='1.5'/><rect x='10' y='98' width='70' height='24' fill='none' stroke='#94a3b8'/><text x='23' y='115' font-size='11' fill='#333'>町奉行</text><rect x='110' y='98' width='70' height='24' fill='none' stroke='#94a3b8'/><text x='118' y='115' font-size='11' fill='#333'>勘定奉行</text><rect x='205' y='98' width='80' height='24' fill='none' stroke='#94a3b8'/><text x='211' y='115' font-size='11' fill='#333'>京都所司代</text></svg>","c":["老中","執権","管領","太政大臣"],"a":0,"e":"老中は複数名が置かれ、月番で政務をとりました。臨時の最高職として大老が置かれることもありました。"},{"t":"五人組","q":"江戸時代、農民に年貢の納入や犯罪の防止について連帯責任を負わせるためにつくらせた組織を何といいますか。","c":["五人組","惣","座","株仲間"],"a":0,"e":"数戸の農家を一組にした制度です。惣は室町時代の村の自治組織、株仲間は江戸時代の商工業者の同業組合です。"},{"t":"島原の一揆","q":"1637年、キリスト教徒への迫害や重い年貢に苦しんだ人々が天草四郎を大将としておこした一揆を何といいますか。","c":["島原・天草一揆","大塩平八郎の乱","加賀の一向一揆","正長の土一揆"],"a":0,"e":"幕府はこの一揆のあと絵踏を強化し、鎖国を完成させていきました。"},{"t":"鎖国","q":"鎖国の下で、長崎の出島において幕府と貿易することを許されたヨーロッパの国はどこですか。","c":["オランダ","ポルトガル","スペイン","イギリス"],"a":0,"e":"1641年にオランダ商館が平戸から出島に移されました。中国（清）も長崎での貿易を許されました。"},{"t":"朝鮮通信使","q":"江戸時代、将軍の代がわりなどのたびに朝鮮から日本に送られた使節を何といいますか。","c":["朝鮮通信使","遣唐使","勘合貿易船","南蛮船"],"a":0,"e":"対馬藩の宗氏が仲立ちをしました。鎖国下でも朝鮮・琉球・蝦夷地・オランダとの交流の窓口はありました。"},{"t":"農業の発達","q":"江戸時代に広まった農具のうち、脱穀の能率を大きく高めたものはどれですか。","c":["千歯こき","備中ぐわ","唐箕","踏車"],"a":0,"e":"備中ぐわは深く耕すため、唐箕はもみと殻をより分けるため、踏車は田に水を引くために使われました。"},{"t":"五街道","q":"下の図のように整備された五街道の起点となった場所はどこですか。","fig":"<svg viewBox='0 0 300 120'><circle cx='235' cy='70' r='6' fill='#4a6cf7'/><text x='222' y='92' font-size='11' fill='#333'>江戸</text><circle cx='60' cy='70' r='6' fill='#4a6cf7'/><text x='47' y='92' font-size='11' fill='#333'>京都</text><line x1='229' y1='74' x2='66' y2='74' stroke='#4a6cf7' stroke-width='2'/><text x='120' y='92' font-size='11' fill='#4a6cf7'>東海道</text><path d='M229 62 Q145 20 66 62' fill='none' stroke='#ef4444' stroke-width='2'/><text x='120' y='34' font-size='11' fill='#ef4444'>中山道</text><line x1='241' y1='64' x2='272' y2='36' stroke='#94a3b8' stroke-width='2'/><text x='246' y='26' font-size='10' fill='#333'>日光へ</text></svg>","c":["江戸の日本橋","京都の三条大橋","大阪の淀屋橋","名古屋の熱田"],"a":0,"e":"五街道は東海道・中山道・甲州道中・日光道中・奥州道中で、いずれも江戸の日本橋が起点でした。"},{"t":"三都","q":"諸藩が蔵屋敷を置き、全国の年貢米や特産物が集まったことから「天下の台所」とよばれた都市はどこですか。","c":["大阪","江戸","京都","長崎"],"a":0,"e":"江戸は「将軍のおひざもと」とよばれる政治の中心、京都は古くからの文化の中心でした。"},{"t":"享保の改革","q":"目安箱の設置や公事方御定書の制定などの享保の改革を行った将軍はだれですか。","c":["徳川吉宗","徳川綱吉","松平定信","水野忠邦"],"a":0,"e":"8代将軍吉宗は上げ米の制や新田開発で幕府の財政を立て直そうとしました。"},{"t":"田沼意次","q":"商人の力を利用して財政を立て直そうとし、株仲間の結成をすすめた老中はだれですか。","c":["田沼意次","松平定信","水野忠邦","新井白石"],"a":0,"e":"長崎貿易の拡大や印旛沼の干拓も進めましたが、わいろが横行し批判を受けて失脚しました。"},{"t":"寛政の改革","q":"ききんに備えて米をたくわえさせ、幕府の学校で朱子学以外の学問を教えることを禁じた寛政の改革を行った老中はだれですか。","c":["松平定信","田沼意次","水野忠邦","徳川吉宗"],"a":0,"e":"定信は徳川吉宗の孫にあたります。厳しすぎる政策は不評で、6年ほどで改革は終わりました。"},{"t":"天保の改革","q":"物価を下げるために株仲間の解散を命じた天保の改革を行った老中はだれですか。","c":["水野忠邦","松平定信","田沼意次","井伊直弼"],"a":0,"e":"1841年からの改革ですが反対が強く2年余りで失敗しました。その少し前の1837年には大塩平八郎の乱がおこっています。"},{"t":"元禄文化","q":"元禄文化のころ、町人の生活をいきいきとえがいた浮世草子で人気を集めた作者はだれですか。","c":["井原西鶴","近松門左衛門","松尾芭蕉","十返舎一九"],"a":0,"e":"近松門左衛門は人形浄瑠璃の脚本、松尾芭蕉は俳諧で活躍しました。元禄文化は上方（京都・大阪）が中心です。"},{"t":"化政文化","q":"化政文化のころ、「富嶽三十六景」をえがいた浮世絵師はだれですか。","c":["葛飾北斎","歌川広重","菱川師宣","狩野永徳"],"a":0,"e":"歌川広重は「東海道五十三次」をえがきました。化政文化は江戸中心の町人文化です。"},{"t":"蘭学","q":"オランダ語の人体解剖書を翻訳し、「解体新書」として出版した人物の一人はだれですか。","c":["杉田玄白","本居宣長","伊能忠敬","近松門左衛門"],"a":0,"e":"1774年に前野良沢らと出版しました。本居宣長は国学を大成して「古事記伝」を著しています。"},{"t":"外国船の接近","q":"1825年に幕府が出した、日本に近づく外国船を追い払うよう命じた法令を何といいますか。","c":["異国船打払令","鎖国令","日米和親条約","薪水給与令"],"a":0,"e":"清がアヘン戦争で敗れたことを知った幕府は、1842年にこれをゆるめて薪水給与令を出しました。"}],"7":[{"t":"ペリー来航","q":"1853年、4隻の軍艦を率いて浦賀に来航し、日本に開国を求めたアメリカの使節はだれですか。","c":["ペリー","ハリス","ラクスマン","レザノフ"],"a":0,"e":"ハリスは日米修好通商条約を結んだ総領事です。ラクスマンやレザノフはロシアの使節です。"},{"t":"日米和親条約","q":"1854年に結ばれた日米和親条約で開かれた2つの港はどこですか。","c":["下田と函館","神奈川と長崎","兵庫と新潟","浦賀と横浜"],"a":0,"e":"この条約で200年以上続いた鎖国が終わりました。アメリカ船に水や食料を供給することも認めました。"},{"t":"修好通商条約","q":"1858年、大老の井伊直弼がアメリカと結んだ条約を何といいますか。","c":["日米修好通商条約","日米和親条約","下関条約","ポーツマス条約"],"a":0,"e":"朝廷の許可を得ないまま結んだため批判が高まり、井伊直弼は1860年に桜田門外の変で暗殺されました。"},{"t":"不平等条約","q":"日米修好通商条約が不平等とされる理由の一つで、日本で罪をおかした外国人をその国の領事が裁く権利を何といいますか。","c":["領事裁判権","関税自主権","居留地の設置","最恵国待遇"],"a":0,"e":"もう一つの不平等な点は、日本に関税自主権がなかったことです。改正には半世紀近くかかりました。"},{"t":"大政奉還","q":"1867年、政権を朝廷に返した江戸幕府の15代将軍はだれですか。","c":["徳川慶喜","徳川家茂","井伊直弼","徳川吉宗"],"a":0,"e":"同じ年の12月には王政復古の大号令が出され、天皇を中心とする新政府が成立しました。"},{"t":"戊辰戦争","q":"1868年から1869年にかけて、新政府軍と旧幕府軍との間で行われた一連の戦いを何といいますか。","c":["戊辰戦争","西南戦争","日清戦争","島原・天草一揆"],"a":0,"e":"鳥羽・伏見の戦いに始まり、函館の五稜郭の戦いで終わりました。"},{"t":"御誓文","q":"1868年、明治天皇が神に誓う形で示した新政府の政治の基本方針を何といいますか。","c":["五箇条の御誓文","五榜の掲示","大日本帝国憲法","王政復古の大号令"],"a":0,"e":"広く会議を開いて世論に従うことなどが示されました。五榜の掲示は民衆に対する禁止事項の高札です。"},{"t":"廃藩置県","q":"1871年、藩を廃止して県を置き、中央から府知事・県令を派遣した政策を何といいますか。","c":["廃藩置県","版籍奉還","四民平等","学制"],"a":0,"e":"1869年の版籍奉還では藩主がそのまま藩を治めていたため、廃藩置県で中央集権が完成しました。"},{"t":"地租改正","q":"1873年に始まった地租改正では、地価の何％を土地の所有者が現金で納めることになりましたか。","c":["3％","2.5％","5％","10％"],"a":0,"e":"収穫に左右されない安定した税収を得るための改革でしたが、反対一揆がおこり1877年に2.5％へ引き下げられました。"},{"t":"徴兵令","q":"1873年に出された徴兵令によって兵役の義務を負ったのはどのような人ですか。","c":["満20歳以上の男子","満25歳以上の男子","満18歳以上の男女","士族の男子のみ"],"a":0,"e":"前年の1872年には学制が出され、6歳以上の男女すべてに小学校教育を受けさせる方針が示されました。"},{"t":"殖産興業","q":"明治政府が殖産興業のため群馬県に建てた官営模範工場は何ですか。","c":["富岡製糸場","八幡製鉄所","大阪紡績会社","足尾銅山"],"a":0,"e":"1872年にフランスの技術を導入して開業しました。八幡製鉄所は日清戦争後の1901年に操業を開始しています。"},{"t":"文明開化","q":"「学問のすゝめ」を著し、人間の平等と学問の大切さを説いた人物はだれですか。","c":["福沢諭吉","中江兆民","森鴎外","新渡戸稲造"],"a":0,"e":"中江兆民はルソーの思想を紹介し、東洋のルソーとよばれました。"},{"t":"岩倉使節団","q":"1871年に欧米へ派遣され、条約改正の予備交渉と欧米視察を行った使節団の代表はだれですか。","c":["岩倉具視","西郷隆盛","大隈重信","井上馨"],"a":0,"e":"条約改正の交渉は失敗しましたが、欧米の制度や産業を学んだことがその後の政策に生かされました。"},{"t":"西南戦争","q":"1877年、政府に不満をもつ鹿児島の士族らにおされて西郷隆盛が中心となっておこした反乱を何といいますか。","c":["西南戦争","戊辰戦争","秩父事件","佐賀の乱"],"a":0,"e":"最大の士族反乱でしたが徴兵制の政府軍にしずめられ、以後の反政府運動は言論が中心になりました。"},{"t":"自由民権運動","q":"1874年、国会を開くことを求めて民撰議院設立の建白書を政府に提出した人物はだれですか。","c":["板垣退助","大隈重信","伊藤博文","西郷隆盛"],"a":0,"e":"これをきっかけに自由民権運動が広まり、1880年には国会期成同盟が結成されました。"},{"t":"政党の結成","q":"自由民権運動の中で、1882年に大隈重信が結成した政党は何ですか。","c":["立憲改進党","自由党","立憲政友会","憲政会"],"a":0,"e":"1881年には板垣退助が自由党を結成しています。同じ年に政府は10年後の国会開設を約束しました。"},{"t":"内閣制度","q":"1885年に内閣制度がつくられたとき、初代内閣総理大臣になった人物はだれですか。","c":["伊藤博文","山県有朋","黒田清隆","大隈重信"],"a":0,"e":"伊藤博文はヨーロッパで憲法を調査し、憲法づくりの中心となりました。"},{"t":"帝国憲法","q":"1889年に発布された大日本帝国憲法は、主にどこの国の憲法を手本としてつくられましたか。","c":["ドイツ（プロイセン）","イギリス","フランス","アメリカ"],"a":0,"e":"君主の権限が強いドイツの憲法が手本とされました。天皇が国民にあたえる形の欽定憲法です。"},{"t":"帝国憲法","q":"下の図は大日本帝国憲法下の政治のしくみです。___にあてはまる、主権をもつとされた存在はだれですか。","fig":"<svg viewBox='0 0 300 145'><rect x='115' y='6' width='70' height='26' fill='none' stroke='#4a6cf7' stroke-width='1.5'/><text x='138' y='25' font-size='13' fill='#333'>___</text><line x1='150' y1='32' x2='150' y2='48' stroke='#94a3b8' stroke-width='1.5'/><line x1='48' y1='48' x2='250' y2='48' stroke='#94a3b8' stroke-width='1.5'/><line x1='48' y1='48' x2='48' y2='62' stroke='#94a3b8' stroke-width='1.5'/><line x1='150' y1='48' x2='150' y2='62' stroke='#94a3b8' stroke-width='1.5'/><line x1='250' y1='48' x2='250' y2='62' stroke='#94a3b8' stroke-width='1.5'/><rect x='10' y='62' width='76' height='24' fill='none' stroke='#94a3b8'/><text x='15' y='79' font-size='11' fill='#333'>帝国議会</text><rect x='120' y='62' width='60' height='24' fill='none' stroke='#94a3b8'/><text x='136' y='79' font-size='11' fill='#333'>内閣</text><rect x='215' y='62' width='70' height='24' fill='none' stroke='#94a3b8'/><text x='227' y='79' font-size='11' fill='#333'>裁判所</text><line x1='48' y1='86' x2='48' y2='100' stroke='#94a3b8' stroke-width='1.5'/><line x1='23' y1='100' x2='75' y2='100' stroke='#94a3b8' stroke-width='1.5'/><line x1='23' y1='100' x2='23' y2='112' stroke='#94a3b8' stroke-width='1.5'/><line x1='75' y1='100' x2='75' y2='112' stroke='#94a3b8' stroke-width='1.5'/><rect x='0' y='112' width='46' height='22' fill='none' stroke='#94a3b8'/><text x='3' y='128' font-size='10' fill='#333'>衆議院</text><rect x='52' y='112' width='46' height='22' fill='none' stroke='#94a3b8'/><text x='55' y='128' font-size='10' fill='#333'>貴族院</text></svg>","c":["天皇","国民","内閣総理大臣","貴族院"],"a":0,"e":"大日本帝国憲法では天皇が主権者で、軍隊を統率する権限などをもつと定められていました。"},{"t":"制限選挙","q":"1890年の第1回衆議院議員総選挙で選挙権が認められたのはどのような人ですか。","c":["直接国税15円以上を納める満25歳以上の男子","満25歳以上のすべての男子","満20歳以上のすべての男女","直接国税3円以上を納める満20歳以上の男子"],"a":0,"e":"有権者は総人口の約1.1％にすぎませんでした。帝国議会は衆議院と貴族院の二院制でした。"},{"t":"条約改正","q":"1894年、日英通商航海条約を結んで領事裁判権の撤廃に成功した外務大臣はだれですか。","c":["陸奥宗光","小村寿太郎","井上馨","大隈重信"],"a":0,"e":"1886年のノルマントン号事件で条約改正を求める世論が高まっていました。"},{"t":"条約改正","q":"1911年に関税自主権の完全な回復を実現した外務大臣はだれですか。","c":["小村寿太郎","陸奥宗光","伊藤博文","桂太郎"],"a":0,"e":"日露戦争後に国際的地位が高まったことが背景です。これで幕末以来の不平等条約の改正が達成されました。"},{"t":"日清戦争","q":"日清戦争の講和条約である下関条約で、日本が清から譲り受けた地域はどれですか。","c":["台湾と遼東半島","樺太の南半分","朝鮮半島全域","山東半島"],"a":0,"e":"1895年に結ばれ、多額の賠償金も得ました。清は朝鮮の独立も認めました。"},{"t":"三国干渉","q":"下関条約のあと、遼東半島を清に返すよう日本にせまった3か国の組み合わせはどれですか。","c":["ロシア・ドイツ・フランス","イギリス・アメリカ・フランス","ロシア・イギリス・ドイツ","アメリカ・ドイツ・イタリア"],"a":0,"e":"日本は要求を受け入れて返還し、国民の間にロシアへの対抗心が高まりました。"},{"t":"日露戦争","q":"日露戦争が始まった年はいつですか。","c":["1904年","1894年","1914年","1902年"],"a":0,"e":"1902年の日英同盟を背景に開戦しました。与謝野晶子は出征した弟を思う詩を発表しています。"},{"t":"ポーツマス条約","q":"日露戦争の講和条約であるポーツマス条約について、国民の不満が高まった理由はどれですか。","c":["賠償金が得られなかったこと","領土をすべて失ったこと","朝鮮の独立が認められなかったこと","多額の賠償金を支払うことになったこと"],"a":0,"e":"重い税負担にたえた国民の不満が爆発し、日比谷焼き打ち事件がおこりました。樺太の南半分などは得ています。"},{"t":"韓国併合","q":"日本が韓国を植民地とし、朝鮮総督府を置いて統治を始めたのは何年ですか。","c":["1910年","1895年","1905年","1919年"],"a":0,"e":"1905年に統監府を置いて保護国とし、1910年に併合しました。1919年には三・一独立運動がおこっています。"},{"t":"第一次大戦","q":"第一次世界大戦中の1915年、日本が中国に対して山東省のドイツ権益の継承などを求めた要求を何といいますか。","c":["二十一か条の要求","三国干渉","門戸開放宣言","五・四運動"],"a":0,"e":"日本は日英同盟を理由に参戦しました。この要求は中国の反発をまねき、五・四運動につながりました。"},{"t":"米騒動","q":"1918年の米騒動のあと、初の本格的な政党内閣を組織した首相はだれですか。","c":["原敬","犬養毅","加藤高明","桂太郎"],"a":0,"e":"原敬は華族の身分をもたないことから平民宰相とよばれました。米騒動はシベリア出兵を見こした米の買いしめが原因です。"},{"t":"普通選挙法","q":"下のグラフで1928年に有権者の割合が大きく増えた理由として正しいものはどれですか。","fig":"<svg viewBox='0 0 300 155'><line x1='40' y1='20' x2='40' y2='130' stroke='#333' stroke-width='1.5'/><line x1='40' y1='130' x2='285' y2='130' stroke='#333' stroke-width='1.5'/><text x='2' y='16' font-size='10' fill='#333'>有権者の割合</text><rect x='55' y='125' width='30' height='5' fill='#4a6cf7'/><rect x='110' y='120' width='30' height='10' fill='#4a6cf7'/><rect x='165' y='106' width='30' height='24' fill='#4a6cf7'/><rect x='220' y='38' width='30' height='92' fill='#ef4444'/><text x='56' y='144' font-size='10' fill='#333'>1890</text><text x='111' y='144' font-size='10' fill='#333'>1902</text><text x='166' y='144' font-size='10' fill='#333'>1920</text><text x='221' y='144' font-size='10' fill='#333'>1928</text><text x='52' y='120' font-size='9' fill='#333'>1.1%</text><text x='216' y='33' font-size='9' fill='#333'>20.8%</text></svg>","c":["1925年の普通選挙法で満25歳以上の男子に選挙権が認められたから","1925年の普通選挙法で満20歳以上の男女に選挙権が認められたから","納税額の制限が3円に引き下げられたから","女性にも選挙権が認められたから"],"a":0,"e":"納税額による制限がなくなりました。同じ年に治安維持法が定められ、社会運動が取りしまられました。"}],"8":[{"t":"世界恐慌","q":"1929年、アメリカのニューヨークの株式市場で株価が大暴落したことから始まった世界的な不況を何といいますか。","c":["世界恐慌","石油危機","バブル経済の崩壊","金融恐慌"],"a":0,"e":"銀行や工場がつぶれ、失業者があふれました。影響は世界中に広がり、各国は独自の対策をとりました。"},{"t":"ニューディール","q":"世界恐慌に対してアメリカがとった、公共事業をおこして失業者を助ける政策を何といいますか。","c":["ニューディール政策","ブロック経済","五か年計画","殖産興業"],"a":0,"e":"フランクリン・ローズベルト大統領が進めました。五か年計画はソ連が行った計画経済です。"},{"t":"ブロック経済","q":"世界恐慌に対し、イギリスやフランスが本国と植民地との貿易を優先し、他国の商品を締め出した政策を何といいますか。","c":["ブロック経済","ニューディール政策","五か年計画","門戸開放"],"a":0,"e":"植民地の少ない日本・ドイツ・イタリアはこれに苦しみ、対外進出を強めていきました。"},{"t":"ファシズム","q":"世界恐慌後のドイツで、ナチスを率いて独裁政治を行った人物はだれですか。","c":["ヒトラー","ムッソリーニ","スターリン","ローズベルト"],"a":0,"e":"イタリアではムッソリーニがファシスト党の独裁を行いました。スターリンはソ連の指導者です。"},{"t":"満州事変","q":"1931年、日本の関東軍が南満州鉄道の線路を爆破し、これを中国側のしわざとして軍事行動を始めた事件を何といいますか。","c":["柳条湖事件","盧溝橋事件","二・二六事件","五・一五事件"],"a":0,"e":"これをきっかけに満州事変が始まり、翌年に満州国が建国されました。"},{"t":"国際連盟脱退","q":"リットン調査団の報告にもとづき満州国を認めない決議がなされたことを受け、1933年に日本がとった行動はどれですか。","c":["国際連盟からの脱退を通告した","国際連合から脱退した","ソ連と中立条約を結んだ","満州国を解散させた"],"a":0,"e":"日本は国際的に孤立を深めていきました。国際連合の発足は1945年です。"},{"t":"五・一五事件","q":"1932年、海軍の青年将校らが首相官邸をおそい、犬養毅首相を暗殺した事件を何といいますか。","c":["五・一五事件","二・二六事件","柳条湖事件","盧溝橋事件"],"a":0,"e":"この事件で政党内閣の時代が終わり、軍人が首相になることが多くなりました。"},{"t":"二・二六事件","q":"1936年、陸軍の青年将校らが大臣らを殺傷し東京の中心部を占拠した事件を何といいますか。","c":["二・二六事件","五・一五事件","満州事変","日比谷焼き打ち事件"],"a":0,"e":"反乱はしずめられましたが、これ以後、軍部の政治的な発言力がいっそう強まりました。"},{"t":"日中戦争","q":"1937年、北京郊外で日本軍と中国軍が衝突し、日中戦争のきっかけとなった事件を何といいますか。","c":["盧溝橋事件","柳条湖事件","西安事件","義和団事件"],"a":0,"e":"中国では抗日民族統一戦線がつくられ、戦争は長期化しました。"},{"t":"国家総動員法","q":"1938年に制定された、議会の承認なしに戦争のために人や物資を動員できるようにした法律は何ですか。","c":["国家総動員法","治安維持法","徴兵令","工場法"],"a":0,"e":"1940年には政党が解散して大政翼賛会にまとめられ、国民生活も統制されました。"},{"t":"第二次大戦","q":"第二次世界大戦が始まるきっかけとなった、1939年のできごとはどれですか。","c":["ドイツがポーランドに侵攻したこと","日本が真珠湾を攻撃したこと","ドイツがフランスを降伏させたこと","イタリアがエチオピアに侵攻したこと"],"a":0,"e":"直前に独ソ不可侵条約が結ばれていました。これに対しイギリスとフランスがドイツに宣戦しました。"},{"t":"三国同盟","q":"1940年に日本がドイツ・イタリアと結んだ軍事同盟を何といいますか。","c":["日独伊三国同盟","日英同盟","日ソ中立条約","三国協商"],"a":0,"e":"翌1941年には北方の安全を確保するため日ソ中立条約も結ばれました。"},{"t":"太平洋戦争","q":"太平洋戦争が始まった1941年12月、日本軍が攻撃したアメリカの海軍基地はどこですか。","c":["ハワイの真珠湾","フィリピンのマニラ","グアム島","ミッドウェー島"],"a":0,"e":"同時にマレー半島にも上陸しました。1942年のミッドウェー海戦の敗北から戦局は不利になりました。"},{"t":"原子爆弾","q":"人類史上初めて原子爆弾が投下された1945年8月6日の都市はどこですか。","c":["広島","長崎","東京","沖縄"],"a":0,"e":"8月9日には長崎にも投下されました。その前後にはソ連が日ソ中立条約を破って参戦しています。"},{"t":"ポツダム宣言","q":"日本がポツダム宣言の受諾を国民に伝えた玉音放送が行われたのはいつですか。","c":["1945年8月15日","1945年8月6日","1945年9月2日","1946年8月15日"],"a":0,"e":"8月14日に受諾を決定し、翌15日に昭和天皇のラジオ放送で国民に知らされました。"},{"t":"GHQ","q":"戦後、日本の民主化を進めた連合国軍最高司令官総司令部（GHQ）の最高司令官はだれですか。","c":["マッカーサー","ローズベルト","トルーマン","チャーチル"],"a":0,"e":"GHQの指令のもとで日本政府が政治を行う間接統治の形がとられました。"},{"t":"農地改革","q":"下のグラフのように自作地の割合が大きく増えた戦後の改革を何といいますか。","fig":"<svg viewBox='0 0 300 130'><text x='8' y='45' font-size='11' fill='#333'>1941年</text><rect x='60' y='26' width='121' height='26' fill='#4a6cf7'/><rect x='181' y='26' width='99' height='26' fill='#94a3b8'/><text x='82' y='44' font-size='10' fill='#fff'>自作地55%</text><text x='198' y='44' font-size='10' fill='#fff'>小作地45%</text><text x='8' y='97' font-size='11' fill='#333'>1950年</text><rect x='60' y='78' width='198' height='26' fill='#4a6cf7'/><rect x='258' y='78' width='22' height='26' fill='#94a3b8'/><text x='120' y='96' font-size='10' fill='#fff'>自作地90%</text><line x1='269' y1='104' x2='269' y 6cf7' stroke-width='1.5'/><text x='224' y='28' font-size='12' fill='#333'>内閣</text><rect x='105' y='128' width='90' height='30' fill='none' stroke='#4a6cf7' stroke-width='1.5'/><text x='122' y='148' font-size='12' fill='#333'>裁判所</text><line x1='98' y1='23' x2='194' y2='23' stroke='#94a3b8' stroke-width='1.5'/><polygon points='202,23 191,18 191,28' fill='#94a3b8'/><text x='106' y='16' font-size='9' fill='#333'>内閣不信任の決議</text><line x1='50' y1='38' x2='113' y2='119' stroke='#94a3b8' stroke-width='1.5'/><polygon points='120,128 109,122 117,115' fill='#94a3b8'/><text x='6' y='104' font-size='9' fill='#333'>___の設置</text><line x1='250' y1='38' x2='187' y2='119' stroke='#94a3b8' stroke-width='1.5'/><polygon points='180,128 184,115 191,122' fill='#94a3b8'/><text x='210' y='104' font-size='9' fill='#333'>最高裁長官の指名</text></svg>","c":["弾劾裁判所","家庭裁判所","簡易裁判所","国民審査会"],"a":0,"e":"三権分立では国会・内閣・裁判所がたがいに抑制し合います。国民は選挙・世論・国民審査で三権に関わります。"},{"t":"選挙制度","q":"衆議院議員総選挙で採用されている、小選挙区制と比例代表制を組み合わせた制度を何といいますか。","c":["小選挙区比例代表並立制","中選挙区制","大選挙区制","比例代表制のみ"],"a":0,"e":"小選挙区制は大政党に有利で、比例代表制は民意が反映されやすい特徴があります。一票の格差も課題です。"},{"t":"地方自治","q":"住民が条例の制定や改廃を求めるとき、必要な署名の数はどれですか。","c":["有権者の50分の1以上","有権者の3分の1以上","有権者の過半数","有権者の10分の1以上"],"a":0,"e":"議会の解散や首長・議員の解職の請求には有権者の3分の1以上の署名が必要です。地方自治は民主主義の学校とよばれます。"}],"10":[{"t":"消費者の権利","q":"訪問販売などで商品を買った場合、一定期間内であれば無条件で契約を解除できる制度を何といいますか。","c":["クーリング・オフ制度","製造物責任法","消費者基本法","独占禁止法"],"a":0,"e":"訪問販売では原則8日以内です。ただし自分から店に出向いて買った商品には適用されません。"},{"t":"製造物責任法","q":"製品の欠陥によって消費者が被害を受けたとき、企業に過失がなくても賠償の責任を負わせる法律は何ですか。","c":["製造物責任法（PL法）","消費者契約法","独占禁止法","労働基準法"],"a":0,"e":"1995年に施行されました。消費者契約法は不当な勧誘による契約を取り消せる法律です。"},{"t":"株式会社","q":"株式会社において、経営の基本方針などを決める最高の議決機関は何ですか。","c":["株主総会","取締役会","監査役会","労働組合"],"a":0,"e":"株主は出資額の範囲でのみ責任を負う有限責任で、利潤の一部を配当として受け取ります。"},{"t":"企業の責任","q":"企業が利潤の追求だけでなく、環境保全や文化支援などにも取り組むべきだとする考え方を何といいますか。","c":["企業の社会的責任（CSR）","規制緩和","独占禁止","公共の福祉"],"a":0,"e":"消費者の安全や雇用の確保、情報の公開なども企業の社会的責任にふくまれます。"},{"t":"需要と供給","q":"下のグラフで、価格がPのとき市場ではどのような状態になっていますか。","fig":"<svg viewBox='0 0 240 160'><line x1='40' y1='20' x2='40' y2='130' stroke='#333' stroke-width='1.5'/><line x1='40' y1='130' x2='220' y2='130' stroke='#333' stroke-width='1.5'/><text x='8' y='24' font-size='11' fill='#333'>価格</text><text x='185' y='148' font-size='11' fill='#333'>数量</text><line x1='55' y1='30' x2='200' y2='120' stroke='#4a6cf7' stroke-width='2'/><text x='202' y='124' font-size='11' fill='#4a6cf7'>需要</text><line x1='55' y1='120' x2='200' y2='30' stroke='#ef4444' stroke-width='2'/><text x='202' y='34' font-size='11' fill='#ef4444'>供給</text><line x1='40' y1='50' x2='210' y2='50' stroke='#94a3b8' stroke-width='1' stroke-dasharray='4 3'/><text x='22' y='54' font-size='11' fill='#333'>P</text></svg>","c":["供給量が需要量を上回り、売れ残りが出る","需要量が供給量を上回り、品不足になる","需要量と供給量が一致している","価格が均衡価格より低い"],"a":0,"e":"価格が均衡価格より高いと、供給量が需要量を上回って売れ残りが生じ、やがて価格は下がります。"},{"t":"均衡価格","q":"市場で需要量と供給量が一致したときの価格を何といいますか。","c":["均衡価格","独占価格","公共料金","希望小売価格"],"a":0,"e":"市場経済では価格が上下することで、生産と消費の量が自然に調節されます。"},{"t":"独占禁止法","q":"独占禁止法を運用し、企業の公正で自由な競争を確保するために監視を行う機関はどこですか。","c":["公正取引委員会","消費者庁","日本銀行","会計検査院"],"a":0,"e":"少数の企業が価格を話し合って決めるカルテルなどを取りしまります。"},{"t":"公共料金","q":"電気・ガス・水道の料金や鉄道運賃のように、国や地方公共団体が決定や認可を行う価格を何といいますか。","c":["公共料金","均衡価格","独占価格","市場価格"],"a":0,"e":"生活に欠かせないものは、価格が大きく変動すると国民生活に影響が出るため調整されます。"},{"t":"金融","q":"企業が株式や社債を発行して、出資者から直接に資金を集めるしくみを何といいますか。","c":["直接金融","間接金融","財政投融資","公開市場操作"],"a":0,"e":"銀行が預金を集めて企業に貸し出すのが間接金融です。銀行は預金と貸し出しの利子の差で利益を得ます。"},{"t":"日本銀行","q":"日本銀行の役割にあてはまらないものはどれですか。","c":["個人や一般企業に直接お金を貸し出す","紙幣を発行する","政府の資金を取りあつかう","銀行に対して資金を貸し出す"],"a":0,"e":"日本銀行は発券銀行・政府の銀行・銀行の銀行という三つの役割をもつ中央銀行です。"},{"t":"金融政策","q":"日本銀行が不景気のときに行う金融政策として正しいものはどれですか。","c":["国債などを銀行から買い、世の中に出回るお金を増やす","国債などを銀行に売り、世の中に出回るお金を減らす","増税をして政府の支出を減らす","公共事業を減らして支出をおさえる"],"a":0,"e":"これを公開市場操作といいます。増税や公共事業の増減は政府が行う財政政策です。"},{"t":"為替相場","q":"下の図のように為替相場が変化したとき、その名称と輸出への影響の組み合わせとして正しいものはどれですか。","fig":"<svg viewBox='0 0 300 110'><rect x='12' y='28' width='112' height='36' fill='none' stroke='#94a3b8' str const NUM_Q = 30;
let subject="eigo", level=1, quizSet=[], idx=0, score=0, wrongs=[];

// ================= ユーティリティ =================
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function bestKey(sid,n){ return 'best-'+sid+'-'+n; }
function setHeader(title,sub){
  document.getElementById('head-title').textContent=title;
  document.getElementById('head-sub').textContent=sub;
}

// 旧バージョン（英語のみ）のベストスコアを新しいキーに引き継ぐ
function migrateOldScores(){
  try{
    if(localStorage.getItem('best-migrated')) return;
    for(let n=1;n<=10;n++){
      const old=localStorage.getItem('eng10-best-'+n);
      if(old!==null && localStorage.getItem(bestKey('eigo',n))===null){
        localStorage.setItem(bestKey('eigo',n),old);
      }
    }
    localStorage.setItem('best-migrated','1');
  }catch(e){/* localStorageが使えない環境では何もしない */}
}

// ================= 教科選択画面 =================
function renderSubjects(){
  const box=document.getElementById('screen-subjects');
  box.innerHTML='';
  SUBJECTS.forEach(s=>{
    const ready=!!SUBJECT_DATA[s.id];
    const card=document.createElement('div');
    card.className='subject-card'+(ready?'':' soon');
    card.onclick=()=>selectSubject(s.id);
    card.innerHTML='<div class="subject-icon" style="background:'+s.color+'">'+escapeHtml(s.icon)+'</div>'
      +'<div><h2>'+escapeHtml(s.name)+'</h2><p>'+escapeHtml(s.desc)+'</p></div>'
      +(ready?'<div class="arrow">›</div>':'<div class="soon-tag">準備中</div>');
    box.appendChild(card);
  });
}

function selectSubject(id){
  const s=SUBJECTS.find(x=>x.id===id);
  if(!SUBJECT_DATA[id]){ alert(s.name+'は現在準備中です。\nもうしばらくお待ちください！'); return; }
  subject=id;
  setHeader('📘 中学'+s.name+'マスター','10段階レベル × 30問チャレンジ！');
  renderHome();
  show('screen-home');
}

function goSubjects(){
  setHeader('📚 中学5教科マスター','教科を選んでスタート！');
  renderSubjects();
  show('screen-subjects');
}

// ================= レベル選択画面 =================
function renderHome(){
  const list=document.getElementById('level-list');
  list.innerHTML='';
  let lastGrade='';
  SUBJECT_DATA[subject].levels.forEach(lv=>{
    if(lv.grade!==lastGrade){
      lastGrade=lv.grade;
      const g=document.createElement('div');
      g.className='grade-label';
      g.textContent=GRADE_LABELS[lv.grade]||lv.grade;
      list.appendChild(g);
    }
    const total=(SUBJECT_DATA[subject].questions[lv.n]||[]).length;
    const shown=Math.min(NUM_Q,total);
    const best=localStorage.getItem(bestKey(subject,lv.n));
    const card=document.createElement('div');
    card.className='level-card';
    card.onclick=()=>startQuiz(lv.n);
    card.innerHTML='<div class="level-badge" style="background:'+LEVEL_COLORS[lv.n-1]+'">Lv'+lv.n+'</div>'
      +'<div><h2>'+escapeHtml(lv.title)+'</h2><p>'+escapeHtml(lv.desc)+'</p></div>'
      +'<div class="best">ベスト<b>'+(best?best+'/'+shown:'-')+'</b></div>';
    list.appendChild(card);
  });
}

// ================= クイズ進行 =================
function startQuiz(l){
  level=l; idx=0; score=0; wrongs=[];
  const bank=SUBJECT_DATA[subject].questions[l]||[];
  quizSet = shuffle(bank).slice(0,NUM_Q).map(q=>{
    const order = shuffle(q.c.map((_,i)=>i));
    return {...q, c: order.map(i=>q.c[i]), a: order.indexOf(q.a)};
  });
  show('screen-quiz');
  renderQuestion();
}

function renderQuestion(){
  const q=quizSet[idx];
  document.getElementById('quiz-counter').textContent=(idx+1)+' / '+quizSet.length;
  document.getElementById('quiz-score').textContent='スコア: '+score;
  document.getElementById('quiz-bar').style.width=(idx/quizSet.length*100)+'%';
  document.getElementById('q-type').textContent=q.t;
  document.getElementById('q-text').innerHTML=escapeHtml(q.q).replace(/___/g,'<span class="blank">___</span>');
  const fig=document.getElementById('q-fig');
  if(q.fig){ fig.innerHTML=q.fig; fig.style.display='block'; }
  else{ fig.innerHTML=''; fig.style.display='none'; }
  const box=document.getElementById('choices');
  box.innerHTML='';
  q.c.forEach((c,i)=>{
    const btn=document.createElement('button');
    btn.textContent=c;
    btn.onclick=()=>answer(i,btn);
    box.appendChild(btn);
  });
  document.getElementById('feedback').className='feedback';
  document.getElementById('next-btn').style.display='none';
}

function answer(i,btn){
  const q=quizSet[idx];
  const buttons=document.querySelectorAll('#choices button');
  buttons.forEach(b=>b.disabled=true);
  buttons[q.a].classList.add('correct');
  const fb=document.getElementById('feedback');
  if(i===q.a){
    score++;
    fb.classList.add('ok','show');
    document.getElementById('fb-title').textContent='⭕ 正解！';
  }else{
    btn.classList.add('wrong');
    wrongs.push(q);
    fb.classList.add('ng','show');
    document.getElementById('fb-title').textContent='❌ ざんねん… 正解は「'+q.c[q.a]+'」';
  }
  document.getElementById('fb-body').textContent=q.e;
  document.getElementById('quiz-score').textContent='スコア: '+score;
  const nb=document.getElementById('next-btn');
  nb.textContent = idx===quizSet.length-1 ? '結果を見る 🏁' : '次へ ▶';
  nb.style.display='block';
}

function nextQuestion(){
  idx++;
  if(idx>=quizSet.length){ showResult(); } else { renderQuestion(); }
}

function showResult(){
  show('screen-result');
  const total=quizSet.length;
  document.getElementById('result-score').textContent=score+'/'+total;
  const rate=total? score/total : 0;
  let emoji,msg;
  if(rate===1){emoji='🏆';msg='パーフェクト！すばらしい！次のレベルにも挑戦しよう！';}
  else if(rate>=.8){emoji='🎉';msg='よくできました！あと少しで満点だよ！';}
  else if(rate>=.5){emoji='💪';msg='いい調子！まちがえた問題の解説を読んで復習しよう。';}
  else{emoji='📖';msg='まずは解説をじっくり読もう。くり返せば必ずできるようになるよ！';}
  document.getElementById('result-emoji').textContent=emoji;
  document.getElementById('result-msg').textContent=msg;

  const key=bestKey(subject,level);
  const best=Number(localStorage.getItem(key)||0);
  if(score>best) localStorage.setItem(key,score);

  const list=document.getElementById('review-list');
  list.innerHTML='';
  if(wrongs.length){
    const h=document.createElement('div');
    h.style.cssText='font-weight:bold;font-size:.85rem;margin-bottom:8px;';
    h.textContent='📝 まちがえた問題の復習';
    list.appendChild(h);
    wrongs.forEach(q=>{
      const d=document.createElement('div');
      d.className='review-item';
      d.innerHTML='<div class="ri-q">'+escapeHtml(q.q)+'</div>'
        +(q.fig?'<div class="q-fig">'+q.fig+'</div>':'')
        +'<div>正解: <span class="ri-a">'+escapeHtml(q.c[q.a])+'</span></div>'
        +'<div style="color:var(--sub);margin-top:4px;">'+escapeHtml(q.e)+'</div>';
      list.appendChild(d);
    });
  }
}

function retry(){ startQuiz(level); }
function goHome(){ renderHome(); show('screen-home'); }

migrateOldScores();
goSubjects();
</script>
</body>
</html>
