<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4a6cf7">
<title>中学英語マスター</title>
<style>
  :root{
    --primary:#4a6cf7; --primary-dark:#3451c6;
    --bg:#f4f6fb; --card:#ffffff; --text:#22283a; --sub:#6b7280;
    --correct:#16a34a; --wrong:#dc2626;
    --lv1:#22c55e; --lv2:#0ea5e9; --lv3:#f59e0b; --lv4:#ef4444;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  header{background:linear-gradient(135deg,var(--primary),#7c3aed);color:#fff;padding:18px 20px;border-radius:0 0 20px 20px;}
  header h1{font-size:1.25rem;}
  header p{font-size:.8rem;opacity:.85;margin-top:2px;}
  main{flex:1;padding:16px;}
  .screen{display:none;}
  .screen.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .level-card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;align-items:center;gap:14px;cursor:pointer;border:2px solid transparent;transition:.15s;}
  .level-card:active{transform:scale(.98);}
  .level-badge{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:1.05rem;flex-shrink:0;}
  .level-card h2{font-size:1rem;}
  .level-card p{font-size:.78rem;color:var(--sub);margin-top:3px;line-height:1.4;}
  .best{margin-left:auto;text-align:right;font-size:.7rem;color:var(--sub);flex-shrink:0;}
  .best b{display:block;font-size:1rem;color:var(--primary);}

  .quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:.85rem;color:var(--sub);}
  .quit-btn{background:none;border:none;color:var(--sub);font-size:.85rem;padding:6px;cursor:pointer;}
  .progress{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin-bottom:16px;}
  .progress div{height:100%;background:var(--primary);border-radius:4px;transition:width .3s;}

  .q-card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:16px;}
  .q-type{display:inline-block;font-size:.7rem;background:#eef2ff;color:var(--primary);padding:3px 10px;border-radius:10px;margin-bottom:10px;}
  .q-text{font-size:1.05rem;line-height:1.6;white-space:pre-wrap;}
  .q-text .blank{color:var(--primary);font-weight:bold;}

  .choices button{display:block;width:100%;background:var(--card);border:2px solid #e5e7eb;border-radius:14px;padding:14px 16px;font-size:1rem;text-align:left;margin-bottom:10px;cursor:pointer;transition:.15s;color:var(--text);}
  .choices button:active{transform:scale(.98);}
  .choices button.correct{border-color:var(--correct);background:#f0fdf4;color:var(--correct);font-weight:bold;}
  .choices button.wrong{border-color:var(--wrong);background:#fef2f2;color:var(--wrong);}
  .choices button:disabled{cursor:default;}

  .feedback{border-radius:14px;padding:14px 16px;margin-bottom:14px;font-size:.9rem;line-height:1.6;display:none;}
  .feedback.show{display:block;animation:fade .2s;}
  .feedback.ok{background:#f0fdf4;border:1px solid #bbf7d0;}
  .feedback.ng{background:#fef2f2;border:1px solid #fecaca;}
  .feedback .fb-title{font-weight:bold;margin-bottom:4px;}
  .feedback.ok .fb-title{color:var(--correct);}
  .feedback.ng .fb-title{color:var(--wrong);}

  .btn{display:block;width:100%;background:var(--primary);color:#fff;border:none;border-radius:14px;padding:15px;font-size:1rem;font-weight:bold;cursor:pointer;transition:.15s;}
  .btn:active{transform:scale(.98);background:var(--primary-dark);}
  .btn.ghost{background:#e5e7eb;color:var(--text);margin-top:10px;}

  .result-card{background:var(--card);border-radius:20px;padding:30px 20px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:16px;}
  .result-emoji{font-size:3rem;}
  .result-score{font-size:2.4rem;font-weight:bold;color:var(--primary);margin:10px 0 4px;}
  .result-msg{color:var(--sub);font-size:.9rem;line-height:1.6;}
  .review-list{margin-top:16px;text-align:left;}
  .review-item{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:.82rem;line-height:1.5;box-shadow:0 1px 4px rgba(0,0,0,.05);}
  .review-item .ri-q{color:var(--sub);}
  .review-item .ri-a{color:var(--correct);font-weight:bold;}
  .review-item .ri-x{color:var(--wrong);text-decoration:line-through;margin-right:6px;}

  footer{text-align:center;padding:14px;font-size:.7rem;color:var(--sub);}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>📘 中学英語マスター</h1>
    <p>レベルを選んで30問チャレンジ！</p>
  </header>
  <main>

    <!-- レベル選択 -->
    <section id="screen-home" class="screen active">
      <div class="level-card" onclick="startQuiz(1)">
        <div class="level-badge" style="background:var(--lv1)">Lv1</div>
        <div><h2>きほん（中1）</h2><p>be動詞・一般動詞・単語のきほん</p></div>
        <div class="best">ベスト<b id="best-1">-</b></div>
      </div>
      <div class="level-card" onclick="startQuiz(2)">
        <div class="level-badge" style="background:var(--lv2)">Lv2</div>
        <div><h2>過去形マスター（中1〜2）</h2><p>動詞の過去形変化・不規則動詞</p></div>
        <div class="best">ベスト<b id="best-2">-</b></div>
      </div>
      <div class="level-card" onclick="startQuiz(3)">
        <div class="level-badge" style="background:var(--lv3)">Lv3</div>
        <div><h2>文法チャレンジ（中2〜3）</h2><p>比較・受け身・現在完了・不定詞</p></div>
        <div class="best">ベスト<b id="best-3">-</b></div>
      </div>
      <div class="level-card" onclick="startQuiz(4)">
        <div class="level-badge" style="background:var(--lv4)">Lv4</div>
        <div><h2>高校受験対策</h2><p>関係代名詞・並べかえ・入試頻出問題</p></div>
        <div class="best">ベスト<b id="best-4">-</b></div>
      </div>
    </section>

    <!-- クイズ -->
    <section id="screen-quiz" class="screen">
      <div class="quiz-top">
        <span id="quiz-counter">1 / 30</span>
        <span id="quiz-score">スコア: 0</span>
        <button class="quit-btn" onclick="goHome()">✕ やめる</button>
      </div>
      <div class="progress"><div id="quiz-bar" style="width:0%"></div></div>
      <div class="q-card">
        <span class="q-type" id="q-type"></span>
        <div class="q-text" id="q-text"></div>
      </div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback">
        <div class="fb-title" id="fb-title"></div>
        <div id="fb-body"></div>
      </div>
      <button class="btn" id="next-btn" style="display:none" onclick="nextQuestion()">次へ ▶</button>
    </section>

    <!-- 結果 -->
    <section id="screen-result" class="screen">
      <div class="result-card">
        <div class="result-emoji" id="result-emoji">🎉</div>
        <div class="result-score" id="result-score">10/10</div>
        <div class="result-msg" id="result-msg"></div>
      </div>
      <button class="btn" onclick="retry()">🔁 もう一度</button>
      <button class="btn ghost" onclick="goHome()">🏠 レベル選択へ</button>
      <div class="review-list" id="review-list"></div>
    </section>

  </main>
  <footer>中学英語マスター - がんばって続けよう！</footer>
</div>

<script>
// ================= 問題データ =================
// type: 'choice'（4択） / q に ___ が空所
const QUESTIONS = {
  1: [ // Lv1 きほん
    {t:"be動詞", q:"I ___ a student.", c:["am","is","are","be"], a:0, e:"主語が I のとき be動詞は am を使います。"},
    {t:"be動詞", q:"She ___ my sister.", c:["is","am","are","be"], a:0, e:"主語が she / he / it（3人称単数）のときは is。"},
    {t:"be動詞", q:"They ___ from Canada.", c:["are","is","am","be"], a:0, e:"主語が複数（they, we, you）のときは are。"},
    {t:"一般動詞", q:"He ___ soccer every day.", c:["plays","play","playing","played"], a:0, e:"3人称単数・現在の文では動詞に s をつけます（3単現のs）。"},
    {t:"一般動詞", q:"I ___ like natto.", c:["don't","doesn't","am not","not"], a:0, e:"一般動詞の否定文は don't（主語がIのとき）。"},
    {t:"一般動詞", q:"___ she speak English?", c:["Does","Do","Is","Are"], a:0, e:"3人称単数の一般動詞の疑問文は Does を使います。"},
    {t:"疑問詞", q:"___ is your birthday? — It's May 5th.", c:["When","Where","Who","What"], a:0, e:"「いつ」を聞くときは When。"},
    {t:"疑問詞", q:"___ do you live? — I live in Tokyo.", c:["Where","When","Why","Who"], a:0, e:"「どこ」を聞くときは Where。"},
    {t:"単語", q:"「図書館」を英語で言うと？", c:["library","hospital","station","museum"], a:0, e:"library = 図書館。hospital=病院, station=駅, museum=博物館。"},
    {t:"単語", q:"「水曜日」を英語で言うと？", c:["Wednesday","Tuesday","Thursday","Saturday"], a:0, e:"Wednesday = 水曜日。つづりに注意（d を忘れずに）！"},
    {t:"複数形", q:"box の複数形は？", c:["boxes","boxs","boxies","box"], a:0, e:"s, x, ch, sh で終わる単語は es をつけます。"},
    {t:"命令文", q:"___ quiet, please.", c:["Be","Is","Are","Do"], a:0, e:"命令文は動詞の原形から始めます。be動詞の原形は Be。"},
    {t:"代名詞", q:"This is ___ book.（これは私の本です）", c:["my","I","me","mine"], a:0, e:"「私の＋名詞」は my。mine は「私のもの」。"},
    {t:"現在進行形", q:"She is ___ TV now.", c:["watching","watch","watches","watched"], a:0, e:"現在進行形は「be動詞 + 動詞のing形」。"},
    {t:"can", q:"He ___ swim fast.", c:["can","cans","is can","can be"], a:0, e:"can のあとは動詞の原形。主語が3人称単数でも can に s はつきません。"},
    {t:"be動詞", q:"We ___ good friends.", c:["are","is","am","be"], a:0, e:"主語が we（複数）のときは are。"},
    {t:"be動詞", q:"___ this your pen? — Yes, it is.", c:["Is","Are","Am","Do"], a:0, e:"be動詞の疑問文はbe動詞を文の先頭に。this は is を使います。"},
    {t:"be動詞", q:"That ___ not my bag.", c:["is","are","am","do"], a:0, e:"that（それ・あれ）は3人称単数なので is。否定文は is not (isn't)。"},
    {t:"一般動詞", q:"They ___ tennis on Sundays.", c:["play","plays","playing","is play"], a:0, e:"主語が they（複数）なので動詞は原形のまま。"},
    {t:"一般動詞", q:"My mother ___ dinner every evening.", c:["cooks","cook","cooking","is cook"], a:0, e:"my mother は3人称単数なので cooks（3単現のs）。"},
    {t:"一般動詞", q:"She ___ like math.", c:["doesn't","don't","isn't","not"], a:0, e:"3人称単数の否定文は doesn't ＋ 動詞の原形。"},
    {t:"疑問詞", q:"___ is that boy? — He is my brother.", c:["Who","What","When","Where"], a:0, e:"「だれ」を聞くときは Who。"},
    {t:"疑問詞", q:"___ many books do you have?", c:["How","What","Which","Why"], a:0, e:"How many + 複数名詞 =「いくつの〜」。数をたずねる表現です。"},
    {t:"疑問詞", q:"___ do you like better, cats or dogs?", c:["Which","What","Who","How"], a:0, e:"選択肢の中から「どちら」を聞くときは Which。"},
    {t:"単語", q:"「火曜日」を英語で言うと？", c:["Tuesday","Thursday","Wednesday","Sunday"], a:0, e:"Tuesday = 火曜日。Thursday（木曜日）とまちがえやすいので注意！"},
    {t:"単語", q:"「冬」を英語で言うと？", c:["winter","spring","summer","fall"], a:0, e:"winter = 冬。spring=春, summer=夏, fall/autumn=秋。"},
    {t:"単語", q:"「昼食」を英語で言うと？", c:["lunch","breakfast","dinner","meal"], a:0, e:"lunch = 昼食。breakfast=朝食, dinner=夕食。"},
    {t:"複数形", q:"child の複数形は？", c:["children","childs","childes","child"], a:0, e:"child → children は特別な変化。他に man→men, foot→feet など。"},
    {t:"複数形", q:"city の複数形は？", c:["cities","citys","cityes","city"], a:0, e:"「子音字＋y」で終わる語は y を i に変えて es。"},
    {t:"代名詞", q:"I know ___.（私は彼を知っています）", c:["him","he","his","her"], a:0, e:"動詞の目的語には目的格。he の目的格は him。"},
    {t:"代名詞", q:"This bike is ___.（この自転車は彼女のものです）", c:["hers","her","she","herself"], a:0, e:"「彼女のもの」は hers。her は「彼女の＋名詞」。"},
    {t:"現在進行形", q:"I ___ doing my homework now.", c:["am","is","are","do"], a:0, e:"現在進行形は「be動詞 + ing形」。主語が I なので am。"},
    {t:"現在進行形", q:"___ they playing soccer now? — Yes, they are.", c:["Are","Do","Is","Does"], a:0, e:"進行形の疑問文はbe動詞を先頭に。they なので Are。"},
    {t:"can", q:"___ I use your pen? — Sure.", c:["Can","Am","Do","Are"], a:0, e:"Can I 〜? =「〜してもいいですか」。許可を求める表現です。"},
    {t:"命令文", q:"___ run in the classroom.（教室で走ってはいけません）", c:["Don't","Not","Isn't","No"], a:0, e:"禁止の命令文は Don't ＋ 動詞の原形。"},
  ],
  2: [ // Lv2 過去形
    {t:"規則動詞", q:"play の過去形は？", c:["played","plaied","playd","plays"], a:0, e:"ふつうは ed をつけるだけ。play → played。"},
    {t:"規則動詞", q:"study の過去形は？", c:["studied","studyed","studed","studies"], a:0, e:"「子音字＋y」で終わる動詞は y を i に変えて ed。"},
    {t:"規則動詞", q:"stop の過去形は？", c:["stopped","stoped","stopt","stops"], a:0, e:"「短母音＋子音字」で終わる動詞は子音字を重ねて ed。"},
    {t:"不規則動詞", q:"go の過去形は？", c:["went","goed","gone","goes"], a:0, e:"go → went → gone。不規則動詞は暗記が大事！"},
    {t:"不規則動詞", q:"have の過去形は？", c:["had","haved","has","haves"], a:0, e:"have → had → had。"},
    {t:"不規則動詞", q:"see の過去形は？", c:["saw","seed","seen","sees"], a:0, e:"see → saw → seen。seen は過去分詞。"},
    {t:"不規則動詞", q:"make の過去形は？", c:["made","maked","maden","makes"], a:0, e:"make → made → made。"},
    {t:"不規則動詞", q:"come の過去形は？", c:["came","comed","come","comes"], a:0, e:"come → came → come。過去分詞は原形と同じ形です。"},
    {t:"不規則動詞", q:"write の過去形は？", c:["wrote","writed","written","writes"], a:0, e:"write → wrote → written。"},
    {t:"不規則動詞", q:"take の過去形は？", c:["took","taked","taken","takes"], a:0, e:"take → took → taken。"},
    {t:"過去の文", q:"I ___ to the park yesterday.", c:["went","go","goed","gone"], a:0, e:"yesterday があるので過去形。go の過去形は went。"},
    {t:"過去の否定文", q:"She ___ eat breakfast this morning.", c:["didn't","doesn't","don't","wasn't"], a:0, e:"一般動詞の過去の否定文は didn't ＋ 動詞の原形。"},
    {t:"過去の疑問文", q:"___ you watch the movie last night?", c:["Did","Do","Were","Does"], a:0, e:"一般動詞の過去の疑問文は Did で始めます。"},
    {t:"be動詞の過去", q:"They ___ busy yesterday.", c:["were","was","are","been"], a:0, e:"be動詞の過去形：am/is → was、are → were。"},
    {t:"be動詞の過去", q:"I ___ tired last night.", c:["was","were","am","did"], a:0, e:"主語が I のとき、be動詞の過去形は was。"},
    {t:"過去進行形", q:"He ___ sleeping when I called him.", c:["was","were","is","did"], a:0, e:"過去進行形は「was/were + 動詞のing形」。"},
    {t:"規則動詞", q:"use の過去形は？", c:["used","ussed","uesd","uses"], a:0, e:"e で終わる動詞は d をつけるだけ。use → used。"},
    {t:"規則動詞", q:"cry の過去形は？", c:["cried","cryed","cred","cries"], a:0, e:"「子音字＋y」は y を i に変えて ed。cry → cried。"},
    {t:"規則動詞", q:"visit の過去形は？", c:["visited","visitted","visid","visits"], a:0, e:"visit はそのまま ed をつけて visited。"},
    {t:"不規則動詞", q:"eat の過去形は？", c:["ate","eated","eaten","eats"], a:0, e:"eat → ate → eaten。eaten は過去分詞。"},
    {t:"不規則動詞", q:"get の過去形は？", c:["got","getted","gotten","gets"], a:0, e:"get → got → got(gotten)。"},
    {t:"不規則動詞", q:"buy の過去形は？", c:["bought","buyed","brought","buys"], a:0, e:"buy → bought。bring の過去形 brought とまちがえやすいので注意！"},
    {t:"不規則動詞", q:"read の過去形は？", c:["read（レッドと読む）","readed","red","reads"], a:0, e:"read の過去形はつづりは同じで発音だけ変わります（リード→レッド）。"},
    {t:"不規則動詞", q:"run の過去形は？", c:["ran","runned","run","runs"], a:0, e:"run → ran → run。過去分詞は原形と同じ。"},
    {t:"不規則動詞", q:"speak の過去形は？", c:["spoke","speaked","spoken","speaks"], a:0, e:"speak → spoke → spoken。"},
    {t:"不規則動詞", q:"teach の過去形は？", c:["taught","teached","tought","teaches"], a:0, e:"teach → taught → taught。catch → caught も同じパターン。"},
    {t:"不規則動詞", q:"know の過去形は？", c:["knew","knowed","known","knows"], a:0, e:"know → knew → known。"},
    {t:"不規則動詞", q:"say の過去形は？", c:["said","sayed","sad","says"], a:0, e:"say → said → said。発音は「セッド」。"},
    {t:"過去の文", q:"We ___ a good time at the party last week.", c:["had","have","haved","has"], a:0, e:"last week があるので過去形。have → had。"},
    {t:"過去の文", q:"She ___ me an email two days ago.", c:["sent","send","sended","sends"], a:0, e:"〜ago（〜前）があるので過去形。send → sent。"},
    {t:"過去の否定文", q:"I ___ go to school yesterday because I was sick.", c:["didn't","don't","wasn't","doesn't"], a:0, e:"一般動詞の過去の否定文は didn't ＋ 原形。"},
    {t:"過去の疑問文", q:"What ___ you do last Sunday?", c:["did","do","were","does"], a:0, e:"疑問詞つきでも過去の疑問文は did を使います。"},
    {t:"be動詞の過去", q:"The movie ___ very interesting.", c:["was","were","is","did"], a:0, e:"the movie は3人称単数なので was。"},
    {t:"be動詞の過去", q:"___ you at home yesterday? — Yes, I was.", c:["Were","Was","Did","Are"], a:0, e:"主語が you のとき be動詞の過去形は were。"},
    {t:"過去進行形", q:"They ___ playing tennis at three yesterday.", c:["were","was","are","did"], a:0, e:"「〜していた」は過去進行形。they なので were + ing。"},
    {t:"過去進行形", q:"What ___ you doing at eight last night?", c:["were","did","are","was"], a:0, e:"過去進行形の疑問文。主語 you なので were。"},
  ],
  3: [ // Lv3 文法チャレンジ
    {t:"比較", q:"This bag is ___ than that one.", c:["bigger","big","biggest","more big"], a:0, e:"比較級は「-er + than」。big は g を重ねて bigger。"},

const NUM_Q = 30;
let level=1, quizSet=[], idx=0, score=0, wrongs=[];

// ================= ユーティリティ =================
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function loadBests(){
  for(let l=1;l<=4;l++){
    const b=localStorage.getItem('eng-best-'+l);
    document.getElementById('best-'+l).textContent = b ? b+'/'+NUM_Q : '-';
  }
}

// ================= クイズ進行 =================
function startQuiz(l){
  level=l; idx=0; score=0; wrongs=[];
  // 問題ごとに選択肢もシャッフル（正解インデックスを再計算）
  quizSet = shuffle(QUESTIONS[l]).slice(0,NUM_Q).map(q=>{
    const order = shuffle(q.c.map((_,i)=>i));
    return {...q, c: order.map(i=>q.c[i]), a: order.indexOf(q.a)};
  });
  show('screen-quiz');
  renderQuestion();
}

function renderQuestion(){
  const q=quizSet[idx];
  document.getElementById('quiz-counter').textContent=(idx+1)+' / '+NUM_Q;
  document.getElementById('quiz-score').textContent='スコア: '+score;
  document.getElementById('quiz-bar').style.width=(idx/NUM_Q*100)+'%';
  document.getElementById('q-type').textContent=q.t;
  document.getElementById('q-text').innerHTML=escapeHtml(q.q).replace(/___/g,'<span class="blank">___</span>');
  const box=document.getElementById('choices');
  box.innerHTML='';
  q.c.forEach((c,i)=>{
    const btn=document.createElement('button');
    btn.textContent=c;
    btn.onclick=()=>answer(i,btn);
    box.appendChild(btn);
  });
  document.getElementById('feedback').className='feedback';
  document.getElementById('next-btn').style.display='none';
}

function answer(i,btn){
  const q=quizSet[idx];
  const buttons=document.querySelectorAll('#choices button');
  buttons.forEach(b=>b.disabled=true);
  buttons[q.a].classList.add('correct');
  const fb=document.getElementById('feedback');
  if(i===q.a){
    score++;
    fb.classList.add('ok','show');
    document.getElementById('fb-title').textContent='⭕ 正解！';
  }else{
    btn.classList.add('wrong');
    wrongs.push(q);
    fb.classList.add('ng','show');
    document.getElementById('fb-title').textContent='❌ ざんねん… 正解は「'+q.c[q.a]+'」';
  }
  document.getElementById('fb-body').textContent=q.e;
  document.getElementById('quiz-score').textContent='スコア: '+score;
  const nb=document.getElementById('next-btn');
  nb.textContent = idx===NUM_Q-1 ? '結果を見る 🏁' : '次へ ▶';
  nb.style.display='block';
}

function nextQuestion(){
  idx++;
  if(idx>=NUM_Q){ showResult(); } else { renderQuestion(); }
}

function showResult(){
  show('screen-result');
  document.getElementById('result-score').textContent=score+'/'+NUM_Q;
  let emoji,msg;
  if(score===NUM_Q){emoji='🏆';msg='パーフェクト！すばらしい！次のレベルにも挑戦しよう！';}
  else if(score>=8){emoji='🎉';msg='よくできました！あと少しで満点だよ！';}
  else if(score>=5){emoji='💪';msg='いい調子！まちがえた問題の解説を読んで復習しよう。';}
  else{emoji='📖';msg='まずは解説をじっくり読もう。くり返せば必ずできるようになるよ！';}
  document.getElementById('result-emoji').textContent=emoji;
  document.getElementById('result-msg').textContent=msg;

  const key='eng-best-'+level;
  const best=Number(localStorage.getItem(key)||0);
  if(score>best) localStorage.setItem(key,score);

  const list=document.getElementById('review-list');
  list.innerHTML='';
  if(wrongs.length){
    const h=document.createElement('div');
    h.style.cssText='font-weight:bold;font-size:.85rem;margin-bottom:8px;';
    h.textContent='📝 まちがえた問題の復習';
    list.appendChild(h);
    wrongs.forEach(q=>{
      const d=document.createElement('div');
      d.className='review-item';
      d.innerHTML='<div class="ri-q">'+escapeHtml(q.q)+'</div><div>正解: <span class="ri-a">'+escapeHtml(q.c[q.a])+'</span></div><div style="color:var(--sub);margin-top:4px;">'+escapeHtml(q.e)+'</div>';
      list.appendChild(d);
    });
  }
}

function retry(){ startQuiz(level); }
function goHome(){ loadBests(); show('screen-home'); }
function escapeHtml(s){ return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

loadBests();
</script>
