になりやすいので、亜鉛が電子を放して水溶液中にとけ出し、その電子を銅イオンが受け取って銅になります。"},{"t":"燃料電池","q":"燃料電池で電気エネルギーを取り出すときに使う物質と、できる物質の組み合わせはどれですか。","c":["水素と酸素から水ができる","水から水素と酸素ができる","水素と塩素から塩酸ができる","炭素と酸素から二酸化炭素ができる"],"a":0,"e":"燃料電池は水素と酸素が結びついて水ができる化学変化から電気を取り出します。有害な排出物が出ないのが特長です。"},{"t":"電池の種類","q":"充電してくり返し使うことができる電池を何といいますか。","c":["二次電池","一次電池","燃料電池","太陽電池"],"a":0,"e":"充電できる電池を二次電池といい、鉛蓄電池やリチウムイオン電池などがあります。使い切りの電池は一次電池です。"},{"t":"酸","q":"酸性の水溶液に共通してふくまれるイオンはどれですか。","c":["水素イオン","水酸化物イオン","ナトリウムイオン","塩化物イオン"],"a":0,"e":"酸は水にとけて水素イオンH+を生じる物質で、このH+が酸性の性質のもとになっています。"},{"t":"アルカリ","q":"アルカリ性の水溶液に共通してふくまれるイオンはどれですか。","c":["水酸化物イオン","水素イオン","塩化物イオン","硫酸イオン"],"a":0,"e":"アルカリは水にとけて水酸化物イオンOH-を生じる物質で、このOH-がアルカリ性の性質のもとになっています。"},{"t":"酸の性質","q":"うすい塩酸にマグネシウムリボンを入れたときに発生する気体は何ですか。","c":["水素","酸素","二酸化炭素","塩素"],"a":0,"e":"酸の水溶液に金属を入れると水素が発生します。マッチの火を近づけるとポンと音を立てて燃えます。"},{"t":"指示薬","q":"フェノールフタレイン溶液を赤色に変える水溶液はどれですか。","c":["水酸化ナトリウム水溶液","うすい塩酸","食塩水","砂糖水"],"a":0,"e":"フェノールフタレイン溶液はアルカリ性で赤色になります。酸性や中性では無色のままです。"},{"t":"pH","q":"pHの値と水溶液の性質について、正しい説明はどれですか。","c":["pHが7より小さいほど酸性が強い","pHが7より小さいほどアルカリ性が強い","pHが0のとき中性である","pHは酸性の水溶液にしか使えない"],"a":0,"e":"pHは7が中性で、7より小さいほど酸性が強く、7より大きいほどアルカリ性が強くなります。"},{"t":"中和","q":"中和で必ず起こる反応をイオンの記号を使って表したものはどれですか。","c":["H+ + OH- → H2O","H+ + Cl- → HCl","Na+ + OH- → NaOH","Na+ + Cl- → NaCl"],"a":0,"e":"中和は酸の水素イオンとアルカリの水酸化物イオンが結びついて水ができる反応です。"},{"t":"塩","q":"うすい塩酸に水酸化ナトリウム水溶液を加えてちょうど中和したとき、水以外にできる物質は何ですか。","c":["塩化ナトリウム","塩化水素","水酸化ナトリウム","塩素"],"a":0,"e":"酸の陰イオンCl-とアルカリの陽イオンNa+が結びついて塩化ナトリウムという塩ができます。"},{"t":"中和","q":"うすい硫酸に水酸化バリウム水溶液を加えると白い沈殿ができます。この沈殿は何ですか。","c":["硫酸バリウム","塩化バリウム","水酸化バリウム","炭酸カルシウム"],"a":0,"e":"硫酸イオンSO4 2-とバリウムイオンBa2+が結びついて、水にとけにくい硫酸バリウムができるため白くにごります。"},{"t":"中和と熱","q":"うすい塩酸と水酸化ナトリウム水溶液を混ぜると温度はどうなりますか。","c":["上がる","下がる","変わらない","はじめ下がってから上がる"],"a":0,"e":"中和は熱を発生する発熱反応なので、混ぜ合わせると温度が上がります。"},{"t":"中和の計算","q":"うすい塩酸10cm3をちょうど中和するのに、ある水酸化ナトリウム水溶液が8cm3必要でした。同じ塩酸20cm3を中和するには何cm3必要ですか。","c":["16cm3","12cm3","18cm3","4cm3"],"a":0,"e":"酸の量が2倍になれば必要なアルカリの量も2倍になります。8かける2で16cm3です。"},{"t":"イオンの変化","q":"うすい塩酸に水酸化ナトリウム水溶液を少しずつ加えたときの、あるイオンの数の変化を図に表しました。このイオンはどれですか。","fig":"<svg viewBox='0 0 260 165'><line x1='35' y1='130' x2='240' y2='130' stroke='#333' stroke-width='1.5'/><line x1='35' y1='130' x2='35' y2='20' stroke='#333' stroke-width='1.5'/><text x='6' y='14' font-size='10' fill='#333'>イオンの数</text><text x='176' y='150' font-size='10' fill='#333'>加えた量</text><line x1='140' y1='130' x2='140' y2='40' stroke='#94a3b8' stroke-width='1' stroke-dasharray='4 3'/><text x='118' y='34' font-size='10' fill='#333'>完全に中和</text><polyline points='35,130 140,130 230,45' fill='none' stroke='#4a6cf7' stroke-width='2'/></svg>","c":["水酸化物イオン","水素イオン","ナトリウムイオン","塩化物イオン"],"a":0,"e":"完全に中和するまで加えた水酸化物イオンはすべて水になるので0のままで、中和後にあまり始めて増えていきます。"}],"9":[{"t":"細胞分裂","q":"体細胞分裂で、染色体が細胞の中央に並ぶのは、次のうちどの段階のあとですか。","c":["核の中に染色体が現れたあと","染色体が両端に移動したあと","細胞質が2つに分かれたあと","しきりができたあと"],"a":0,"e":"体細胞分裂は、染色体が現れる、中央に並ぶ、両端に分かれる、細胞質が分かれる、の順に進みます。"},{"t":"染色体","q":"体細胞分裂が始まる前に、染色体にはどのような変化が起こりますか。","c":["同じものがもう1組複製される","数が半分になる","2本が1本に結合する","消えてなくなる"],"a":0,"e":"分裂前に染色体が複製されて2倍になるため、分裂後の2個の細胞は分裂前と同じ数の染色体をもちます。"},{"t":"染色体数","q":"体細胞分裂によってできた2個の細胞の染色体の数は、もとの細胞と比べてどうなりますか。","c":["同じ数になる","半分になる","2倍になる","4分の1になる"],"a":0,"e":"分裂前に染色体が複製されてから2つに分かれるので、できた細胞の染色体数はもとの細胞と同じです。"},{"t":"根の成長","q":"タマネギの根で、細胞分裂がさかんに行われている部分はどこですか。","c":["根の先端に近い部分","根のつけ根の部分","根の中央部分","根全体で均一"],"a":0,"e":"根の先端近くには成長点があり、ここで細胞分裂がさかんに起こって細胞の数がふえます。"},{"t":"観察方法","q":"根の細胞分裂を観察するとき、うすい塩酸につけるのはなぜですか。","c":["細胞どうしを離れやすくして観察しやすくするため","細胞を大きくするため","染色体を赤く染めるため","細胞分裂を速く進めるため"],"a":0,"e":"うすい塩酸は細胞どうしを結びつけている物質をとかし、細胞が重ならずに観察できるようにします。染色には酢酸カーミン液を使います。"},{"t":"無性生殖","q":"ジャガイモのいもやサツマイモのいもからなかまをふやす無性生殖を何といいますか。","c":["栄養生殖","分裂","出芽","受精"],"a":0,"e":"植物のからだの一部から新しい個体ができる無性生殖を栄養生殖といいます。"},{"t":"無性生殖","q":"無性生殖でできた子の形質は、親と比べてどうなりますか。","c":["親とまったく同じになる","親とは必ずちがう","親の中間になる","雄親に似る"],"a":0,"e":"無性生殖では体細胞分裂だけで子ができるため、子は親とまったく同じ遺伝子をもち、形質も同じになります。"},{"t":"減数分裂","q":"生殖細胞をつくるときに行われる減数分裂では、染色体の数はどうなりますか。","c":["もとの細胞の半分になる","もとの細胞と同じになる","もとの細胞の2倍になる","細胞によってちがう"],"a":0,"e":"減数分裂で染色体が半分になるため、受精で2つの生殖細胞が合体したとき、染色体の数がもとにもどります。"},{"t":"受精","q":"被子植物で、精細胞が卵細胞まで移動するために花粉からのびる管を何といいますか。","c":["花粉管","子房","やく","胚珠"],"a":0,"e":"花粉が柱頭につくと花粉管がのび、その中を精細胞が移動して胚珠の中の卵細胞と受精します。"},{"t":"発生","q":"受精卵が細胞分裂をくり返して、自分で食物をとり始めるまでの間の子を何といいますか。","c":["胚","胚珠","子房","胞子"],"a":0,"e":"受精卵が体細胞分裂をくり返して胚になり、さらに成長して個体になります。この過程を発生といいます。"},{"t":"遺伝","q":"エンドウを使って遺伝の規則性を明らかにした人物はだれですか。","c":["メンデル","ダーウィン","リンネ","フック"],"a":0,"e":"メンデルは丸としわなど対立形質のはっきりしたエンドウを使い、遺伝の規則性を発見しました。"},{"t":"顕性の法則","q":"丸い種子の純系（AA）としわの種子の純系（aa）をかけ合わせたとき、子の形質と遺伝子の組み合わせはどうなりますか。","c":["すべて丸い種子で、遺伝子はAa","すべてしわの種子で、遺伝子はAa","丸としわが1対1で現れる","丸としわが3対1で現れる"],"a":0,"e":"子はすべてAaとなり、顕性形質である丸が現れます。潜性形質のしわは子の代では現れません。"},{"t":"分離の法則","q":"減数分裂のとき、対になっている遺伝子が分かれて別々の生殖細胞に入ることを何といいますか。","c":["分離の法則","顕性の法則","独立の法則","質量保存の法則"],"a":0,"e":"対になった遺伝子が分かれて別々の生殖細胞に入る規則性を分離の法則といいます。"},{"t":"遺伝の計算","q":"図はAaどうしをかけ合わせたときの遺伝子の組み合わせです。子に現れる形質の比（顕性対潜性）はどうなりますか。","fig":"<svg viewBox='0 0 240 165'><line x1='60' y1='30' x2='220' y2='30' stroke='#94a3b8' stroke-width='1'/><line x1='60' y1='90' x2='220' y2='90' stroke='#94a3b8' stroke-width='1'/><line x1='60' y1='150' x2='220' y2='150' stroke='#94a3b8' stroke-width='1'/><line x1='60' y1='30' x2='60' y2='150' stroke='#94a3b8' stroke-width='1'/><line x1='140' y1='30' x2='140' y2='150' stroke='#94a3b8' stroke-width='1'/><line x1='220' y1='30' x2='220' y2='150' stroke='#94a3b8' stroke-width='1'/><text x='96' y='22' font-size='12' fill='#333'>A</text><text x='176' y='22' font-size='12' fill='#333'>a</text><text x='44' y='66' font-size='12' fill='#333'>A</text><text x='44' y='126' font-size='12' fill='#333'>a</text><text x='88' y='66' font-size='13' fill='#4a6cf7'>AA</text><text x='168' y='66' font-size='13' fill='#4a6cf7'>Aa</text><text x='88' y='126' font-size='13' fill='#4a6cf7'>Aa</text><text x='168' y='126' font-size='13' fill='#4a6cf7'>aa</text></svg>","c":["3対1","1対1","1対3","4対0"],"a":0,"e":"AA、Aa、Aa、aaの4通りができ、顕性形質が現れるのは3通り、潜性形質が現れるのはaaの1通りなので3対1になります。"},{"t":"検定交雑","q":"遺伝子の組み合わせがAaの個体と、aaの個体をかけ合わせたとき、子に現れる形質の比（顕性対潜性）はどうなりますか。","c":["1対1","3対1","1対3","すべて顕性"],"a":0,"e":"AaからはAとaの生殖細胞が1対1でつくられ、aaからはaだけなので、子はAaとaaが1対1になります。"},{"t":"DNA","q":"遺伝子の本体である物質は何ですか。","c":["DNA（デオキシリボ核酸）","タンパク質","ATP","染色液"],"a":0,"e":"染色体にふくまれるDNA（デオキシリボ核酸）が遺伝子の本体で、形質を決める情報をもっています。"},{"t":"分解者","q":"生態系の中で、生物の死がいやふんなどの有機物を無機物に分解するはたらきをする生物はどれですか。","c":["菌類や細菌類","植物","草食動物","肉食動物"],"a":0,"e":"カビやキノコなどの菌類と、大腸菌などの細菌類は分解者とよばれ、有機物を無機物に分解します。"},{"t":"食物連鎖","q":"図は生態系の生物の数量的な関係を表したものです。最も下の段のアにあてはまる生物はどれですか。","fig":"<svg viewBox='0 0 280 160'><polygon points='40,140 240,140 220,110 60,110' fill='none' stroke='#4a6cf7' stroke-width='1.5'/><polygon points='60,110 220,110 200,80 80,80' fill='none' stroke='#4a6cf7' stroke-width='1.5'/><polygon points='80,80 200,80 180,50 100,50' fill='none' stroke='#4a6cf7' stroke-width='1.5'/><polygon points='100,50 180,50 160,22 120,22' fill='none' stroke='#4a6cf7' stroke-width='1.5'/><text x='134' y='132' font-size='11' fill='#333'>ア</text><text x='134' y='102' font-size='11' fill='#333'>イ</text><text x='134' y='72' font-size='11' fill='#333'>ウ</text><text x='134' y='42' font-size='11' fill='#333'>エ</text></svg>","c":["植物","草食動物","小形の肉食動物","大形の肉食動物"],"a":0,"e":"食物連鎖の出発点は光合成で有機物をつくる植物（生産者）で、個体数が最も多く底辺になります。"},{"t":"生態系","q":"ある生態系で草食動物の数が一時的に急にふえると、その直後に起こることはどれですか。","c":["植物が減り、肉食動物がふえる","植物がふえ、肉食動物が減る","植物も肉食動物も減る","何も変化しない"],"a":0,"e":"草食動物がふえると食べられる植物が減り、えさがふえた肉食動物はふえます。その後もとのつり合いにもどっていきます。"},{"t":"日周運動","q":"太陽や星が1日に1回、東から西へ動いて見えるのはなぜですか。","c":["地球が西から東へ自転しているから","地球が太陽のまわりを公転しているから","太陽や星が地球のまわりを回っているから","地軸が傾いているから"],"a":0,"e":"地球が西から東へ自転しているため、天体は見かけ上、東から西へ動いて見えます。これを日周運動といいます。"},{"t":"日周運動","q":"星は日周運動によって1時間に約何度動いて見えますか。","c":["15度","30度","1度","24度"],"a":0,"e":"1日（24時間）で360度動くので、360わる24で1時間に約15度になります。"},{"t":"透明半球","q":"透明半球に1時間ごとの太陽の位置を記録すると、印と印の間隔はどうなりますか。","fig":"<svg viewBox='0 0 280 165'><line x1='20' y1='130' x2='260' y2='130' stroke='#94a3b8' stroke-width='1.5'/><path d='M 50 130 A 90 90 0 0 1 230 130' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='50' cy='130' r='3' fill='#333'/><circle cx='62' cy='85' r='3' fill='#333'/><circle cx='95' cy='52' r='3' fill='#333'/><circle cx='140' cy='40' r='3' fill='#333'/><circle cx='185' cy='52' r='3' fill='#333'/><circle cx='218' cy='85' r='3' fill='#333'/><circle cx='230' cy='130' r='3' fill='#333'/><text x='108' y='152' font-size='11' fill='#333'>1時間ごとの記録</text></svg>","c":["どこでも等しい間隔になる","南中に近いほど広くなる","南中に近いほどせまくなる","朝と夕方だけ広くなる"],"a":0,"e":"地球は一定の速さで自転しているため、太陽は一定の速さで動いて見え、1時間ごとの印の間隔は等しくなります。"},{"t":"年周運動","q":"同じ時刻に見える星の位置は、1か月におよそ何度、どの向きに動きますか。","c":["西へ約30度","東へ約30度","西へ約15度","東へ約15度"],"a":0,"e":"地球の公転により、同じ時刻の星は1年で360度、1か月では約30度西へ移動して見えます。"},{"t":"季節の変化","q":"図のように地球は公転しています。日本で季節の変化が生じる主な原因はどれですか。","fig":"<svg viewBox='0 0 300 170'><circle cx='150' cy='85' r='16' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='138' y='90' font-size='11' fill='#333'>太陽</text><ellipse cx='150' cy='85' rx='115' ry='58' fill='none' stroke='#94a3b8' stroke-width='1' stroke-dasharray='4 3'/><circle cx='35' cy='85' r='12' fill='none' stroke='#333' stroke-width='1.5'/><line x1='30' y1='68' x2='40' y2='102' stroke='#333' stroke-width='1'/><circle cx='265' cy='85' r='12' fill='none' stroke='#333' stroke-width='1.5'/><line x1='260' y1='68' x2='270' y2='102' stroke='#333' stroke-width='1'/><circle cx='150' cy='27' r='12' fill='none' stroke='#333' stroke-width='1.5'/><line x1='145' y1='10' x2='155' y2='44' stroke='#333' stroke-width='1'/><circle cx='150' cy='143' r='12' fill='none' stroke='#333' stroke-width='1.5'/><line x1='145' y1='126' x2='155' y2='160' stroke='#333' stroke-width='1'/></svg>","c":["地軸を傾けたまま公転しているから","太陽との距離が大きく変化するから","地球の自転の速さが変わるから","太陽の出す熱量が季節で変わるから"],"a":0,"e":"地軸が公転面に立てた垂線に対して約23.4度傾いたまま公転するため、季節によって太陽の南中高度と昼の長さが変わります。"},{"t":"南中高度","q":"北緯35度の地点における、春分の日の太陽の南中高度は何度ですか。","c":["55度","35度","78.4度","31.6度"],"a":0,"e":"春分と秋分の南中高度は90度から緯度を引いて求めます。90引く35で55度です。"},{"t":"月の満ち欠け","q":"下の図で、月が地球から見て満月に見えるのはどの位置ですか。","fig":"<svg viewBox='0 0 240 160'><circle cx='40' cy='80' r='16' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='24' y='112' font-size='11' fill='#333'>太陽</text><circle cx='140' cy='80' r='12' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='128' y='108' font-size='11' fill='#333'>地球</text><circle cx='140' cy='80' r='45' fill='none' stroke='#94a3b8' stroke-width='1' stroke-dasharray='4 3'/><circle cx='185' cy='80' r='7' fill='none' stroke='#333' stroke-width='1.5'/><text x='196' y='84' font-size='11' fill='#333'>ア</text><circle cx='140' cy='35' r='7' fill='none' stroke='#333' stroke-width='1.5'/><text x='146' y='30' font-size='11' fill='#333'>イ</text><circle cx='95' cy='80' r='7' fill='none' stroke='#333' stroke-width='1.5'/><text x='80' y='84' font-size='11' fill='#333'>ウ</text><circle cx='140' cy='125' r='7' fill='none' stroke='#333' stroke-width='1.5'/><text x='146' y='140' font-size='11' fill='#333'>エ</text></svg>","c":["ア","イ","ウ","エ"],"a":0,"e":"満月は、太陽・地球・月がこの順に一直線に並び、月が太陽と反対側にあるときに見えます。"},{"t":"日食","q":"日食が起こるときの、太陽・地球・月の並び方として正しいものはどれですか。","c":["太陽・月・地球の順に一直線に並ぶ","太陽・地球・月の順に一直線に並ぶ","月・太陽・地球の順に一直線に並ぶ","3つが直角に並ぶ"],"a":0,"e":"新月のとき月が太陽と地球の間に入り、太陽をかくすことで日食が起こります。月食は太陽・地球・月の順のときです。"},{"t":"金星","q":"図で、地球から見た金星の見かけの大きさが最も大きくなるのはどの位置ですか。","fig":"<svg viewBox='0 0 280 185'><circle cx='140' cy='88' r='15' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='128' y='93' font-size='11' fill='#333'>太陽</text><circle cx='140' cy='88' r='45' fill='none' stroke='#94a3b8' stroke-width='1' stroke-dasharray='4 3'/><circle cx='140' cy='88' r='75' fill='none' stroke='#94a3b8' stroke-width='1' stroke-dasharray='4 3'/><circle cx='140' cy='163' r='9' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='152' y='172' font-size='11' fill='#333'>地球</text><circle cx='166' cy='125' r='6' fill='none' stroke='#333' stroke-width='1.5'/><text x='176' y='130' font-size='11' fill='#333'>ア</text><circle cx='185' cy='88' r='6' fill='none' stroke='#333' stroke-width='1.5'/><text x='195' y='92' font-size='11' fill='#333'>イ</text><circle cx='140' cy='43' r='6' fill='none' stroke='#333' stroke-width='1.5'/><text x='146' y='36' font-size='11' fill='#333'>ウ</text><circle cx='103' cy='113' r='6' fill='none' stroke='#333' stroke-width='1.5'/><text x='86' y='118' font-size='11' fill='#333'>エ</text></svg>","c":["ア","イ","ウ","エ"],"a":0,"e":"金星は地球に近いほど大きく見えます。アが地球に最も近い位置なので、見かけの大きさが最も大きくなります。"},{"t":"金星","q":"夕方、西の空に見える金星を何とよびますか。","c":["よいの明星","明けの明星","北極星","流星"],"a":0,"e":"金星は地球より内側を公転するため、夕方の西の空か明け方の東の空にしか見えません。夕方に見えるものをよいの明星といいます。"},{"t":"太陽","q":"太陽の表面に見える黒点について、正しい説明はどれですか。","c":["まわりより温度が低いため黒く見える","まわりより温度が高いため黒く見える","月の影が映ったものである","太陽の穴である"],"a":0,"e":"黒点はまわりの約6000℃より温度が低い約4000℃の部分で、暗く見えます。黒点の移動から太陽が自転していることがわかります。"}],"10":[{"t":"オームの法則","q":"図の回路で、抵抗が20Ω、電源が6Vのとき、回路に流れる電流は何Aですか。","fig":"<svg viewBox='0 0 260 145'><line x1='40' y1='30' x2='110' y2='30' stroke='#333' stroke-width='1.5'/><line x1='150' y1='30' x2='220' y2='30' stroke='#333' stroke-width='1.5'/><rect x='110' y='22' width='40' height='16' fill='none' stroke='#4a6cf7' stroke-width='1.5'/><text x='114' y='16' font-size='11' fill='#333'>20Ω</text><line x1='40' y1='30' x2='40' y2='110' stroke='#333' stroke-width='1.5'/><line x1='220' y1='30' x2='220' y2='110' stroke='#333' stroke-width='1.5'/><line x1='40' y1='110' x2='118' y2='110' stroke='#333' stroke-width='1.5'/><line x1='142' y1='110' x2='220' y2='110' stroke='#333' stroke-width='1.5'/><line x1='124' y1='100' x2='124' y2='120' stroke='#333' stroke-width='2'/><line x1='118' y1='110' x2='124' y2='110' stroke='#333' stroke-width='1.5'/><line x1='136' y1='105' x2='136' y2='115' stroke='#333' stroke-width='2'/><line x1='136' y1='110' x2='142' y2='110' stroke='#333' stroke-width='1.5'/><text x='150' y='130' font-size='11' fill='#333'>6V</text></svg>","c":["0.3A","3A","120A","0.03A"],"a":0,"e":"電流は電圧わる抵抗で求めます。6わる20で0.3Aです。"},{"t":"合成抵抗","q":"30Ωの抵抗と60Ωの抵抗を並列につないだときの回路全体の抵抗は何Ωですか。","c":["20Ω","90Ω","45Ω","30Ω"],"a":0,"e":"並列回路では抵抗の逆数の和が全体の抵抗の逆数になります。30分の1たす60分の1は20分の1なので20Ωです。全体の抵抗は最も小さい抵抗より小さくなります。"},{"t":"電力量","q":"600Wの電気ポットを5分間使ったときの電力量は何Jですか。","c":["180000J","3000J","30000J","1800J"],"a":0,"e":"電力量は電力かける時間（秒）で求めます。5分は300秒なので、600かける300で180000Jです。"},{"t":"圧力","q":"質量1.5kgの直方体を、面積0.03m2の面を下にして床に置いたときの床にはたらく圧力は何Paですか。質量100gの物体にはたらく重力を1Nとします。","c":["500Pa","50Pa","0.02Pa","45Pa"],"a":0,"e":"1.5kgは1500gなので重力は15Nです。圧力は力わる面積なので、15わる0.03で500Paとなります。"},{"t":"密度","q":"質量54g、体積20cm3の金属があります。この金属の密度は何g/cm3ですか。","c":["2.7g/cm3","0.37g/cm3","74g/cm3","1080g/cm3"],"a":0,"e":"密度は質量わる体積で求めます。54わる20で2.7g/cm3となり、この金属はアルミニウムと考えられます。"},{"t":"仕事率","q":"質量50kgの人が高さ4mの階段を20秒で上りました。このときの仕事率は何Wですか。質量100gの物体にはたらく重力を1Nとします。","c":["100W","2000W","10W","200W"],"a":0,"e":"重力は500N、仕事は500かける4で2000Jです。仕事率は2000わる20で100Wとなります。"},{"t":"音の速さ","q":"がけに向かって大声を出すと、3秒後に反射した音が聞こえました。がけまでの距離は何mですか。音の速さを340m/sとします。","c":["510m","1020m","113m","340m"],"a":0,"e":"音は往復するので進んだ距離は340かける3で1020mです。片道はその半分の510mになります。"},{"t":"凸レンズ","q":"図のように、焦点距離10cmの凸レンズの焦点距離の2倍の位置（2F）に物体を置きました。スクリーンにできる像の説明として正しいものはどれですか。","fig":"<svg viewBox='0 0 300 150'><line x1='10' y1='90' x2='290' y2='90' stroke='#94a3b8' stroke-width='1'/><ellipse cx='150' cy='90' rx='10' ry='45' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='110' cy='90' r='3' fill='#333'/><text x='106' y='108' font-size='10' fill='#333'>F</text><circle cx='190' cy='90' r='3' fill='#333'/><text x='186' y='108' font-size='10' fill='#333'>F</text><circle cx='70' cy='90' r='3' fill='#333'/><text x='62' y='108' font-size='10' fill='#333'>2F</text><circle cx='230' cy='90' r='3' fill='#333'/><text x='222' y='108' font-size='10' fill='#333'>2F</text><line x1='70' y1='90' x2='70' y2='50' stroke='#333' stroke-width='2'/><polyline points='66,57 70,50 74,57' fill='none' stroke='#333' stroke-width='2'/><text x='46' y='44' font-size='10' fill='#333'>物体</text><text x='120' y='140' font-size='10' fill='#333'>凸レンズ</text></svg>","c":["レンズから20cmの位置に、物体と同じ大きさの倒立の実像ができる","レンズから10cmの位置に、物体より小さい倒立の実像ができる","レンズから20cmの位置に、物体より大きい正立の虚像ができる","像はできない"],"a":0,"e":"焦点距離の2倍の位置に物体を置くと、反対側の焦点距離の2倍の位置に、物体と同じ大きさの倒立の実像ができます。"},{"t":"化学反応式","q":"水素が燃えて水ができる化学変化を表した式として正しいものはどれですか。","c":["2H2 + O2 → 2H2O","H2 + O2 → H2O","H2 + O → H2O","2H + O2 → H2O2"],"a":0,"e":"矢印の左右で原子の種類と数が等しくなければなりません。水素原子4個、酸素原子2個で両辺がそろっています。"},{"t":"質量保存","q":"密閉した容器の中でうすい塩酸と石灰石を反応させると、反応の前後で全体の質量はどうなりますか。","c":["変わらない","気体が発生した分だけ減る","気体が発生した分だけ増える","半分になる"],"a":0,"e":"化学変化の前後で原子の種類と数は変わらないため、気体が逃げない密閉容器では全体の質量は変わりません。これを質量保存の法則といいます。"},{"t":"酸化の計算","q":"図は銅を加熱して完全に酸化させたときの、銅の質量と酸化銅の質量の関係です。銅0.8gを完全に酸化させると酸化銅は何gできますか。","fig":"<svg viewBox='0 0 270 165'><line x1='40' y1='130' x2='250' y2='130' stroke='#333' stroke-width='1.5'/><line x1='40' y1='130' x2='40' y2='20' stroke='#333' stroke-width='1.5'/><line x1='40' y1='130' x2='240' y2='30' stroke='#4a6cf7' stroke-width='2'/><line x1='140' y1='130' x2='140' y2='125' stroke='#333' stroke-width='1'/><line x1='240' y1='130' x2='240' y2='125' stroke='#333' stroke-width='1'/><text x='132' y='145' font-size='10' fill='#333'>1.0</text><text x='232' y='145' font-size='10' fill='#333'>2.0</text><text x='150' y='159' font-size='10' fill='#333'>銅の質量[g]</text><line x1='40' y1='90' x2='45' y2='90' stroke='#333' stroke-width='1'/><line x1='40' y1='50' x2='45' y2='50' stroke='#333' stroke-width='1'/><line x1='40' y1='30' x2='45' y2='30' stroke='#333' stroke-width='1'/><text x='20' y='94' font-size='10' fill='#333'>1.0</text><text x='20' y='54' font-size='10' fill='#333'>2.0</text><text x='20' y='34' font-size='10' fill='#333'>2.5</text><text x='6' y='14' font-size='10' fill='#333'>酸化銅[g]</text></svg>","c":["1.0g","0.8g","1.2g","3.2g"],"a":0,"e":"グラフから銅2.0gで酸化銅2.5gができるので、質量は1.25倍になります。0.8かける1.25で1.0gです。"},{"t":"質量比","q":"マグネシウムと酸素は質量の比3対2で結びつきます。マグネシウム0.9gを完全に燃焼させたときにできる酸化マグネシウムは何gですか。","c":["1.5g","0.6g","1.8g","2.4g"],"a":0,"e":"結びつく酸素は0.9かける3分の2で0.6gです。できる酸化マグネシウムは0.9たす0.6で1.5gになります。"},{"t":"熱分解","q":"炭酸水素ナトリウムを加熱したときにできる物質の組み合わせとして正しいものはどれですか。","c":["炭酸ナトリウムと水と二酸化炭素","塩化ナトリウムと水と酸素","炭酸ナトリウムと水素","水酸化ナトリウムと二酸化炭素"],"a":0,"e":"炭酸水素ナトリウムを加熱すると炭酸ナトリウム、水、二酸化炭素に分解します。残った炭酸ナトリウムの水溶液は強いアルカリ性を示します。"},{"t":"濃度","q":"塩化ナトリウム15gを水85gにとかしました。この水溶液の質量パーセント濃度は何%ですか。","c":["15%","17.6%","85%","1.5%"],"a":0,"e":"水溶液全体の質量は15たす85で100gです。15わる100かける100で15%となります。分母が水ではなく水溶液全体であることに注意します。"},{"t":"溶解度","q":"図は硝酸カリウムの溶解度曲線です。60℃の水100gに硝酸カリウムを110gとかした水溶液を20℃まで冷やすと、出てくる結晶は何gですか。","fig":"<svg viewBox='0 0 270 165'><line x1='40' y1='130' x2='250' y2='130' stroke='#333' stroke-width='1.5'/><line x1='40' y1='130' x2='40' y2='20' stroke='#333' stroke-width='1.5'/><polyline points='40,119 90,102 140,74 190,34' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='90' y1='130' x2='90' y2='102' stroke='#94a3b8' stroke-width='1' stroke-dasharray='3 3'/><line x1='40' y1='102' x2='90' y2='102' stroke='#94a3b8' stroke-width='1' stroke-dasharray='3 3'/><line x1='190' y1='130' x2='190' y2='34' stroke='#94a3b8' stroke-width='1' stroke-dasharray='3 3'/><line x1='40' y1='34' x2='190' y2='34' stroke='#94a3b8' stroke-width='1' stroke-dasharray='3 3'/><text x='84' y='144' font-size='10' fill='#333'>20</text><text x='184' y='144' font-size='10' fill='#333'>60</text><text x='188' y='158' font-size='10' fill='#333'>温度[℃]</text><text x='18' y='106' font-size='10' fill='#333'>32</text><text x='14' y='38' font-size='10' fill='#333'>110</text><text x='6' y='14' font-size='10' fill='#333'>とける質量[g]</text><text x='126' y='28' font-size='10' fill='#333'>硝酸カリウム</text></svg>","c":["78g","32g","110g","142g"],"a":0,"e":"20℃では100gの水に32gまでしかとけないので、110引く32で78gが結晶として出てきます。"},{"t":"中和の計算","q":"あるうすい塩酸20cm3をちょうど中和するのに、うすい水酸化ナトリウム水溶液が16cm3必要でした。同じ塩酸30cm3を中和するには同じ水酸化ナトリウム水溶液が何cm3必要ですか。","c":["24cm3","26cm3","12cm3","32cm3"],"a":0,"e":"必要な量は塩酸の量に比例します。16かける20分の30で24cm3です。"},{"t":"光合成","q":"ふ入りの葉を一晩暗いところに置き、一部をアルミニウムはくでおおって日光に当てました。光合成に光が必要なことを確かめるには、どの2か所を比べればよいですか。","c":["緑色で光を当てた部分と、緑色でおおった部分","緑色で光を当てた部分と、ふの部分で光を当てた部分","ふの部分でおおった部分と、緑色でおおった部分","緑色で光を当てた部分と、ふの部分でおおった部分"],"a":0,"e":"調べたい条件（光の有無）だけがちがい、他の条件（葉緑体があること）が同じ2か所を比べます。これを対照実験といいます。"},{"t":"蒸散","q":"葉の数と大きさが同じ枝を4本用意し、A何も処理しない、B葉の裏にワセリンをぬる、C葉の表にワセリンをぬる、Dすべての葉を取り去る、として水の減少量を調べました。葉の裏側からの蒸散量は何cm3ですか。","fig":"<svg viewBox='0 0 300 105'><line x1='10' y1='20' x2='294' y2='20' stroke='#94a3b8' stroke-width='1'/><line x1='10' y1='50' x2='294' y2='50' stroke='#94a3b8' stroke-width='1'/><line x1='10' y1='80' x2='294' y2='80' stroke='#94a3b8' stroke-width='1'/><line x1='10' y1='20' x2='10' y2='80' stroke='#94a3b8' stroke-width='1'/><line x1='110' y1='20' x2='110' y2='80' stroke='#94a3b8' stroke-width='1'/><line x1='156' y1='20' x2='156' y2='80' stroke='#94a3b8' stroke-width='1'/><line x1='202' y1='20' x2='202' y2='80' stroke='#94a3b8' stroke-width='1'/><line x1='248' y1='20' x2='248' y2='80' stroke='#94a3b8' stroke-width='1'/><line x1='294' y1='20' x2='294' y2='80' stroke='#94a3b8' stroke-width='1'/><text x='42' y='41' font-size='11' fill='#333'>装置</text><text x='16' y='71' font-size='10' fill='#333'>減少量[cm3]</text><text x='128' y='41' font-size='11' fill='#333'>A</text><text x='174' y='41' font-size='11' fill='#333'>B</text><text x='220' y='41' font-size='11' fill='#333'>C</text><text x='266' y='41' font-size='11' fill='#333'>D</text><text x='120' y='71' font-size='11' fill='#333'>8.0</text><text x='166' y='71' font-size='11' fill='#333'>3.0</text><text x='212' y='71' font-size='11' fill='#333'>6.5</text><text x='258' y='71' font-size='11' fill='#333'>1.5</text></svg>","c":["5.0cm3","3.0cm3","6.5cm3","1.5cm3"],"a":0,"e":"Bは裏をふさいでいるので、AとBの差が裏側からの蒸散量です。8.0引く3.0で5.0cm3となります。"},{"t":"だ液の実験","q":"デンプン溶液にだ液を加えて40℃に保ったあと、ベネジクト液を加えて加熱すると赤褐色の沈殿ができました。このことからわかることはどれですか。","c":["だ液のはたらきで麦芽糖などができた","だ液のはたらきでデンプンが増えた","だ液はタンパク質を分解した","だ液は40℃ではたらかない"],"a":0,"e":"ベネジクト液は麦芽糖やブドウ糖があると加熱で赤褐色の沈殿をつくります。だ液中のアミラーゼがデンプンを分解した証拠になります。"},{"t":"遺伝の計算","q":"丸い種子の純系としわの種子の純系をかけ合わせてできた子どうしをかけ合わせたところ、孫が800個できました。しわの種子はおよそ何個できると考えられますか。","c":["200個","400個","600個","800個"],"a":0,"e":"子はすべてAaで、AaどうしのかけあわせではAAとAaとaaが1対2対1になります。しわ（aa）は全体の4分の1で、800かける4分の1で200個です。"},{"t":"血液循環","q":"尿素の割合が最も少ない血液が流れている血管はどれですか。","c":["じん臓から出ていく血管","じん臓に入る血管","小腸から出ていく血管","肺から出ていく血管"],"a":0,"e":"じん臓で尿素がこしとられるため、じん臓を通ったあとの血液は尿素の割合が最も少なくなります。"},{"t":"光合成の実験","q":"青色のBTB溶液に息をふきこんで緑色にし、オオカナダモを入れて光を当てたところ、溶液が青色になりました。その理由はどれですか。","c":["光合成で二酸化炭素が使われたから","呼吸で二酸化炭素が増えたから","光合成で酸素が使われたから","水が蒸発して濃くなったから"],"a":0,"e":"二酸化炭素が減ると溶液の酸性が弱まりアルカリ性側にもどるため、緑色から青色に変わります。呼吸より光合成がさかんに行われた証拠です。"},{"t":"動物の分類","q":"子は水中でえらと皮ふ、親は肺と皮ふで呼吸するセキツイ動物のなかまはどれですか。","c":["両生類","は虫類","魚類","ほ乳類"],"a":0,"e":"カエルやイモリなどの両生類は、子（幼生）と親（成体）で呼吸のしかたと生活場所が変わります。"},{"t":"地震","q":"図はP波とS波の走時グラフです。初期微動継続時間が10秒であった地点の、震源からの距離は何kmですか。","fig":"<svg viewBox='0 0 270 165'><line x1='40' y1='130' x2='250' y2='130' stroke='#333' stroke-width='1.5'/><line x1='40' y1='130' x2='40' y2='20' stroke='#333' stroke-width='1.5'/><line x1='40' y1='130' x2='240' y2='80' stroke='#4a6cf7' stroke-width='2'/><text x='208' y='74' font-size='10' fill='#333'>P波</text><line x1='40' y1='130' x2='240' y2='30' stroke='#4a6cf7' stroke-width='2'/><text x='208' y='26' font-size='10' fill='#333'>S波</text><line x1='140' y1='130' x2='140' y2='125' stroke='#333' stroke-width='1'/><line x1='240' y1='130' x2='240' y2='125' stroke='#333' stroke-width='1'/><text x='132' y='144' font-size='10' fill='#333'>80</text><text x='228' y='144' font-size='10' fill='#333'>160</text><text x='140' y='158' font-size='10' fill='#333'>震源距離[km]</text><line x1='40' y1='105' x2='45' y2='105' stroke='#333' stroke-width='1'/><line x1='40' y1='80' x2='45' y2='80' stroke='#333' stroke-width='1'/><line x1='40' y1='30' x2='45' y2='30' stroke='#333' stroke-width='1'/><text x='22' y='109' font-size='10' fill='#333'>10</text><text x='22' y='84' font-size='10' fill='#333'>20</text><text x='22' y='34' font-size='10' fill='#333'>40</text><text x='6' y='14' font-size='10' fill='#333'>時間[s]</text></svg>","c":["80km","40km","120km","160km"],"a":0,"e":"グラフより震源距離80kmではP波が10秒後、S波が20秒後に到着し、その差である初期微動継続時間が10秒になります。"},{"t":"地層","q":"河口から遠くはなれた深い海底に堆積しやすいものはどれですか。","c":["泥","砂","れき","火山灰"],"a":0,"e":"粒が小さいものほど沈みにくく遠くまで運ばれるため、最も粒の小さい泥が河口から遠い深い海に堆積します。"},{"t":"火成岩","q":"マグマが地表や地表付近で急に冷えて固まった火成岩に見られるつくりはどれですか。","c":["斑状組織","等粒状組織","層状組織","柱状組織"],"a":0,"e":"急に冷えると結晶が大きく成長できず、細かい石基の中に斑晶が散らばる斑状組織になります。ゆっくり冷えた深成岩は等粒状組織です。"},{"t":"湿度","q":"気温25℃の空気を冷やしていくと15℃で水滴ができ始めました。25℃の飽和水蒸気量を23.1g/m3、15℃の飽和水蒸気量を12.8g/m3とすると、この空気の湿度は約何%ですか。","c":["55%","60%","51%","72%"],"a":0,"e":"水滴ができ始めた15℃が露点なので、空気1m3中の水蒸気量は12.8gです。12.8わる23.1かける100で約55%となります。"},{"t":"南中高度","q":"北緯35度の地点における夏至の日の太陽の南中高度は何度ですか。地軸の傾きを23.4度とします。","c":["78.4度","55度","31.6度","66.6度"],"a":0,"e":"夏至の南中高度は90度から緯度を引き、さらに地軸の傾きを足します。90引く35たす23.4で78.4度です。"},{"t":"太陽系","q":"太陽系の惑星のうち、小型で密度が大きい地球型惑星にふくまれるものはどれですか。","c":["火星","木星","土星","天王星"],"a":0,"e":"水星、金星、地球、火星が地球型惑星で、小型で密度が大きい岩石でできています。木星以遠は大型で密度の小さい木星型惑星です。"},{"t":"示準化石","q":"アンモナイトの化石が見つかった地層は、どの時代に堆積したと考えられますか。","c":["中生代","古生代","新生代","先カンブリア時代"],"a":0,"e":"アンモナイトは中生代の示準化石です。示準化石は広い範囲にすみ、短い期間だけ栄えた生物の化石が適しています。"}]}},"shakai":{"levels":[{"n":1,"grade":"中1","title":"世界の地理","desc":"世界のすがたと各州の特色"},{"n":2,"grade":"中1","title":"日本の地理①","desc":"日本の位置・地形・気候と産業"},{"n":3,"grade":"中1","title":"日本の地理②","desc":"地方の特色と地形図の読み取り"},{"n":4,"grade":"中2","title":"歴史① 古代","desc":"文明のおこりから平安時代まで"},{"n":5,"grade":"中2","title":"歴史② 中世","desc":"鎌倉幕府から戦国時代までの流れ"},{"n":6,"grade":"中2","title":"歴史③ 近世","desc":"安土桃山・江戸時代"},{"n":7,"grade":"中3","title":"歴史④ 近代","desc":"開国から大正時代まで"},{"n":8,"grade":"中3","title":"歴史⑤ 現代","desc":"世界恐慌から現代まで"},{"n":9,"grade":"中3","title":"公民① 憲法と政治","desc":"日本国憲法と三権分立"},{"n":10,"grade":"受験","title":"高校受験 総仕上げ","desc":"経済・国際社会と融合問題"}],"questions":{"1":[{"t":"六大陸","q":"下のグラフは大陸別の面積を表しています。最も面積が大きいAの大陸はどれですか。","fig":"<svg viewBox='0 0 300 160'><line x1='40' y1='18' x2='40' y2='130' stroke='#333' stroke-width='1.5'/><line x1='40' y1='130' x2='290' y2='130' stroke='#333' stroke-width='1.5'/><rect x='55' y='20' width='26' height='110' fill='#93c5fd'/><rect x='95' y='70' width='26' height='60' fill='#93c5fd'/
