<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4a6cf7">
<title>中学5教科マスター</title>
<style>
  :root{
    --primary:#4a6cf7; --primary-dark:#3451c6;
    --bg:#f4f6fb; --card:#ffffff; --text:#22283a; --sub:#6b7280;
    --correct:#16a34a; --wrong:#dc2626;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  header{background:linear-gradient(135deg,var(--primary),#7c3aed);color:#fff;padding:18px 20px;border-radius:0 0 20px 20px;}
  header h1{font-size:1.25rem;}
  header p{font-size:.8rem;opacity:.85;margin-top:2px;}
  main{flex:1;padding:16px;}
  .screen{display:none;}
  .screen.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .subject-card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;align-items:center;gap:14px;cursor:pointer;transition:.15s;}
  .subject-card:active{transform:scale(.98);}
  .subject-card.soon{opacity:.55;}
  .subject-icon{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:1.35rem;flex-shrink:0;}
  .subject-card h2{font-size:1.05rem;}
  .subject-card p{font-size:.75rem;color:var(--sub);margin-top:3px;}
  .subject-card .arrow{margin-left:auto;color:var(--sub);font-size:1.1rem;flex-shrink:0;}
  .soon-tag{margin-left:auto;font-size:.68rem;color:var(--sub);background:#f1f3f7;padding:4px 9px;border-radius:9px;flex-shrink:0;}

  .back-btn{background:none;border:none;color:var(--primary);font-size:.85rem;padding:6px 2px;margin-bottom:6px;cursor:pointer;font-weight:bold;}

  .grade-label{font-size:.78rem;font-weight:bold;color:var(--sub);margin:14px 4px 8px;}
  .grade-label:first-child{margin-top:0;}
  .level-card{background:var(--card);border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s;}
  .level-card:active{transform:scale(.98);}
  .level-badge{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:.9rem;flex-shrink:0;}
  .level-card h2{font-size:.92rem;}
  .level-card p{font-size:.73rem;color:var(--sub);margin-top:2px;line-height:1.4;}
  .best{margin-left:auto;text-align:right;font-size:.65rem;color:var(--sub);flex-shrink:0;}
  .best b{display:block;font-size:.95rem;color:var(--primary);}

  .quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:.85rem;color:var(--sub);}
  .quit-btn{background:none;border:none;color:var(--sub);font-size:.85rem;padding:6px;cursor:pointer;}
  .progress{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin-bottom:16px;}
  .progress div{height:100%;background:var(--primary);border-radius:4px;transition:width .3s;}

  .q-card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:16px;}
  .q-type{display:inline-block;font-size:.7rem;background:#eef2ff;color:var(--primary);padding:3px 10px;border-radius:10px;margin-bottom:10px;}
  .q-text{font-size:1.05rem;line-height:1.6;white-space:pre-wrap;}
  .q-text .blank{color:var(--primary);font-weight:bold;}
  .q-fig{margin:14px 0 2px;text-align:center;}
  .q-fig svg{width:100%;max-width:320px;height:auto;max-height:230px;}

  .choices button{display:block;width:100%;background:var(--card);border:2px solid #e5e7eb;border-radius:14px;padding:14px 16px;font-size:1rem;text-align:left;margin-bottom:10px;cursor:pointer;transition:.15s;color:var(--text);line-height:1.5;}
  .choices button:active{transform:scale(.98);}
  .choices button.correct{border-color:var(--correct);background:#f0fdf4;color:var(--correct);font-weight:bold;}
  .choices button.wrong{border-color:var(--wrong);background:#fef2f2;color:var(--wrong);}
  .choices button:disabled{cursor:default;}

  .feedback{border-radius:14px;padding:14px 16px;margin-bottom:14px;font-size:.9rem;line-height:1.6;display:none;}
  .feedback.show{display:block;animation:fade .2s;}
  .feedback.ok{background:#f0fdf4;border:1px solid #bbf7d0;}
  .feedback.ng{background:#fef2f2;border:1px solid #fecaca;}
  .feedback .fb-title{font-weight:bold;margin-bottom:4px;}
  .feedback.ok .fb-title{color:var(--correct);}
  .feedback.ng .fb-title{color:var(--wrong);}

  .btn{display:block;width:100%;background:var(--primary);color:#fff;border:none;border-radius:14px;padding:15px;font-size:1rem;font-weight:bold;cursor:pointer;transition:.15s;}
  .btn:active{transform:scale(.98);background:var(--primary-dark);}
  .btn.ghost{background:#e5e7eb;color:var(--text);margin-top:10px;}

  .result-card{background:var(--card);border-radius:20px;padding:30px 20px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:16px;}
  .result-emoji{font-size:3rem;}
  .result-score{font-size:2.4rem;font-weight:bold;color:var(--primary);margin:10px 0 4px;}
  .result-msg{color:var(--sub);font-size:.9rem;line-height:1.6;}
  .review-list{margin-top:16px;text-align:left;}
  .review-item{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:.82rem;line-height:1.5;box-shadow:0 1px 4px rgba(0,0,0,.05);}
  .review-item .ri-q{color:var(--sub);white-space:pre-wrap;}
  .review-item .ri-a{color:var(--correct);font-weight:bold;}

  footer{text-align:center;padding:14px;font-size:.7rem;color:var(--sub);}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="head-title">📚 中学5教科マスター</h1>
    <p id="head-sub">教科を選んでスタート！</p>
  </header>
  <main>
    <section id="screen-subjects" class="screen active"></section>

    <section id="screen-home" class="screen">
      <button class="back-btn" onclick="goSubjects()">← 教科をえらぶ</button>
      <div id="level-list"></div>
    </section>

    <section id="screen-quiz" class="screen">
      <div class="quiz-top">
        <span id="quiz-counter">1 / 30</span>
        <span id="quiz-score">スコア: 0</span>
        <button class="quit-btn" onclick="goHome()">✕ やめる</button>
      </div>
      <div class="progress"><div id="quiz-bar" style="width:0%"></div></div>
      <div class="q-card">
        <span class="q-type" id="q-type"></span>
        <div class="q-text" id="q-text"></div>
        <div class="q-fig" id="q-fig" style="display:none"></div>
      </div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback">
        <div class="fb-title" id="fb-title"></div>
        <div id="fb-body"></div>
      </div>
      <button class="btn" id="next-btn" style="display:none" onclick="nextQuestion()">次へ ▶</button>
    </section>

    <section id="screen-result" class="screen">
      <div class="result-card">
        <div class="result-emoji" id="result-emoji">🎉</div>
        <div class="result-score" id="result-score"></div>
        <div class="result-msg" id="result-msg"></div>
      </div>
      <button class="btn" onclick="retry()">🔁 もう一度</button>
      <button class="btn ghost" onclick="goHome()">🏠 レベル選択へ</button>
      <div class="review-list" id="review-list"></div>
    </section>
  </main>
  <footer>中学5教科マスター - がんばって続けよう！</footer>
</div>

<script>
// ================= 教科定義 =================
const SUBJECTS = [
  {id:"kokugo",  name:"国語", icon:"国", color:"#ef4444", desc:"漢字・文法・読解・古典"},
  {id:"suugaku", name:"数学", icon:"数", color:"#3b82f6", desc:"計算・方程式・関数・図形"},
  {id:"eigo",    name:"英語", icon:"英", color:"#8b5cf6", desc:"文法・単語・高校受験対策"},
  {id:"rika",    name:"理科", icon:"理", color:"#10b981", desc:"物理・化学・生物・地学"},
  {id:"shakai",  name:"社会", icon:"社", color:"#f59e0b", desc:"地理・歴史・公民"},
];

// レベル1〜10の色（全教科共通）
const LEVEL_COLORS = ["#22c55e","#10b981","#14b8a6","#0ea5e9","#3b82f6","#6366f1","#8b5cf6","#f59e0b","#f97316","#ef4444"];

const GRADE_LABELS = {"中1":"📗 中1レベル","中2":"📘 中2レベル","中3":"📙 中3レベル","受験":"🔥 高校受験"};

// ================= 問題データ =================
// {t:分類, q:問題文(空所は___), fig:図のSVG(任意), c:[正解,誤答,誤答,誤答], a:0, e:解説}
const SUBJECT_DATA = {"kokugo":{"levels":[{"n":1,"grade":"中1","title":"漢字の読み書き","desc":"中学の漢字の読みと書き取り"},{"n":2,"grade":"中1","title":"語句と熟語","desc":"語句の意味と熟語の組み立て"},{"n":3,"grade":"中1","title":"文法の基礎","desc":"文節・文の成分・指示語"},{"n":4,"grade":"中2","title":"品詞と活用","desc":"品詞の識別と動詞の活用"},{"n":5,"grade":"中2","title":"敬語・慣用句・ことわざ","desc":"敬語と慣用表現の知識"},{"n":6,"grade":"中2","title":"説明文の読解","desc":"論説文の要点と主張をつかむ"},{"n":7,"grade":"中3","title":"小説・随筆の読解","desc":"心情と表現技法を読み取る"},{"n":8,"grade":"中3","title":"古文の基礎","desc":"仮名遣い・古語・有名作品"},{"n":9,"grade":"中3","title":"漢文と詩歌","desc":"返り点・故事成語・俳句短歌"},{"n":10,"grade":"受験","title":"高校受験 総仕上げ","desc":"入試頻出の総合問題"}],"questions":{"1":[{"t":"漢字の読み","q":"「委ねる」の読み方は？","c":["ゆだねる","かさねる","つらねる","たばねる"],"a":0,"e":"「委ねる（ゆだねる）」は、物事を他人にまかせるという意味です。"},{"t":"漢字の読み","q":"「速やか」の読み方は？","c":["すみやか","はなやか","あざやか","ゆるやか"],"a":0,"e":"「速やか（すみやか）」は、物事の運びがすばやい様子を表します。"},{"t":"漢字の読み","q":"「著しい」の読み方は？","c":["いちじるしい","はなはだしい","このましい","めざましい"],"a":0,"e":"「著しい（いちじるしい）」は、はっきり目立つほど程度が大きいという意味です。"},{"t":"漢字の読み","q":"「培う」の読み方は？","c":["つちかう","やしなう","たたかう","になう"],"a":0,"e":"「培う（つちかう）」は、土を耕して育てる、力などを養うという意味です。"},{"t":"漢字の読み","q":"「滞る」の読み方は？","c":["とどこおる","おこたる","へだたる","つのる"],"a":0,"e":"「滞る（とどこおる）」は、物事が順調に進まず止まってしまうことです。"},{"t":"漢字の読み","q":"「潔い」の読み方は？","c":["いさぎよい","すがすがしい","こころよい","いちじるしい"],"a":0,"e":"「潔い（いさぎよい）」は、思い切りがよく未練がない様子を表します。"},{"t":"漢字の読み","q":"「促す」の読み方は？","c":["うながす","もよおす","はげます","ほどこす"],"a":0,"e":"「促す（うながす）」は、そうするように相手にはたらきかけることです。"},{"t":"漢字の読み","q":"「憂える」の読み方は？","c":["うれえる","おびえる","たたえる","かまえる"],"a":0,"e":"「憂える（うれえる）」は、悪い結果を心配して嘆くことです。"},{"t":"漢字の読み","q":"「陥る」の読み方は？","c":["おちいる","はまる","うずまる","くつがえる"],"a":0,"e":"「陥る（おちいる）」は、望ましくない状態に落ち込んでしまうことです。"},{"t":"漢字の読み","q":"「和やか」の読み方は？","c":["なごやか","おだやか","すこやか","にぎやか"],"a":0,"e":"「和やか（なごやか）」は、その場の雰囲気が穏やかで打ち解けている様子です。"},{"t":"漢字の読み","q":"「経緯」の読み方は？","c":["けいい","きょうい","けいえん","きょうえん"],"a":0,"e":"「経緯（けいい）」は、物事がそうなるまでのいきさつを表します。"},{"t":"漢字の読み","q":"「相殺」の読み方は？","c":["そうさい","そうさつ","あいさい","あいさつ"],"a":0,"e":"「相殺（そうさい）」は差し引いて損得をなくすことです。「殺」を「さい」と読む特別な例です。"},{"t":"漢字の読み","q":"「精進」の読み方は？","c":["しょうじん","せいしん","しょうしん","せいじん"],"a":0,"e":"「精進（しょうじん）」は、一つのことに打ち込んで努力することです。「精」を「しょう」と読む特別な読み方です。"},{"t":"漢字の読み","q":"「境内」の読み方は？","c":["けいだい","きょうない","さかいうち","けいない"],"a":0,"e":"「境内（けいだい）」は、神社や寺の敷地の中を指す言葉です。"},{"t":"漢字の読み","q":"「体裁」の読み方は？","c":["ていさい","たいさい","ていし","たいし"],"a":0,"e":"「体裁（ていさい）」は、外から見た形や見かけのことです。"},{"t":"漢字の読み","q":"「疎か」の読み方は？","c":["おろそか","わずか","かすか","ひそか"],"a":0,"e":"「疎か（おろそか）」は、いいかげんに扱ってきちんとしない様子です。"},{"t":"漢字の書き","q":"「本をヘンシュウする」のヘンシュウを漢字で書くと？","c":["編集","偏集","変集","編襲"],"a":0,"e":"「編集」は文章や資料を集めてまとめ、本や記事にすることです。"},{"t":"漢字の書き","q":"「セイミツな機械」のセイミツを漢字で書くと？","c":["精密","製密","精蜜","清密"],"a":0,"e":"「精密」は細かいところまでくわしく正確なことです。「密」はすきまがないという意味です。"},{"t":"漢字の書き","q":"「責任をテンカする」のテンカを漢字で書くと？","c":["転嫁","添加","点火","天下"],"a":0,"e":"責任を他人になすりつけるのは「転嫁」です。「添加」は付け加えること、「点火」は火をつけることです。"},{"t":"漢字の書き","q":"「意見をシュウヤクする」のシュウヤクを漢字で書くと？","c":["集約","収約","集役","週約"],"a":0,"e":"「集約」は多くのものを集めて一つにまとめることです。"},{"t":"漢字の書き","q":"「キケンを冒す」のキケンを漢字で書くと？","c":["危険","危検","棄権","貴賓"],"a":0,"e":"あぶないという意味は「危険」です。「棄権」は権利を捨てることなので別の語です。"},{"t":"漢字の書き","q":"「ケイヤクを結ぶ」のケイヤクを漢字で書くと？","c":["契約","計約","経約","係約"],"a":0,"e":"約束を取り交わすのは「契約」です。「契」にはちぎる、約束するという意味があります。"},{"t":"漢字の書き","q":"「センモン家に相談する」のセンモンを漢字で書くと？","c":["専門","専問","先門","専聞"],"a":0,"e":"一つの分野に打ち込むのは「専門」です。「問」ではなく「門」と書く点に注意します。"},{"t":"漢字の書き","q":"「計画をスイシンする」のスイシンを漢字で書くと？","c":["推進","水深","推伸","垂心"],"a":0,"e":"物事を前へ進めるのは「推進」です。「水深」は水の深さのことで意味が違います。"},{"t":"漢字の書き","q":"「機械のセイノウがよい」のセイノウを漢字で書くと？","c":["性能","精能","製能","生能"],"a":0,"e":"機械の働きの程度は「性能」です。「性」は物のもつ性質を表します。"},{"t":"同音異義語","q":"「絵画をカンショウする」に合う漢字は？","c":["鑑賞","観賞","干渉","感傷"],"a":0,"e":"芸術作品を味わうのは「鑑賞」です。「観賞」は花や景色を見て楽しむときに使います。"},{"t":"同音異義語","q":"「両者のタイショウが際立つ」に合う漢字は？","c":["対照","対象","対称","大将"],"a":0,"e":"二つを比べて違いが目立つ意味は「対照」です。「対象」は働きかける相手、「対称」は左右がつり合うことです。"},{"t":"同音異義語","q":"「社会ホショウの制度」に合う漢字は？","c":["保障","保証","補償","報奨"],"a":0,"e":"社会保障のように、人の生活や地位を守るのは「保障」です。「保証」は確かだと請け合うこと、「補償」は損害をつぐなうことです。"},{"t":"同音異義語","q":"「イガイな結果に驚く」に合う漢字は？ と、いくつになる？","c":["三つ","二つ","四つ","五つ"],"a":0,"e":"「今日は／とても／寒い」で三文節です。文節は「ね」を入れて区切れるところで分けます。"},{"t":"文節","q":"「妹が 大きな 声で 笑った。」の文節の数は？","c":["四つ","三つ","五つ","六つ"],"a":0,"e":"「妹が／大きな／声で／笑った」で四文節になります。"},{"t":"単語","q":"「本を読む。」を単語に分けるといくつになる？","c":["三つ","二つ","四つ","五つ"],"a":0,"e":"「本／を／読む」の三単語です。助詞の「を」も一つの単語として数えます。"},{"t":"単語","q":"「白い花がきれいだ。」の単語の数は？","c":["四つ","三つ","五つ","六つ"],"a":0,"e":"「白い／花／が／きれいだ」で四単語です。「きれいだ」は形容動詞で一語と数えます。"},{"t":"文節","q":"文節の区切り方として正しいものは？","c":["読んで／みる","読ん／でみる","読／んでみる","読んでみ／る"],"a":0,"e":"意味を添えるだけの補助的な動詞は別の文節になるので「読んで／みる」と区切ります。"},{"t":"主語","q":"「昨日、兄が 新しい 自転車を 買った。」の主語は？","c":["兄が","昨日","自転車を","買った"],"a":0,"e":"買ったのはだれかを考えると「兄が」が主語です。「昨日」は時を表す修飾語です。"},{"t":"主語","q":"「この本こそ私が探していた本だ。」の文全体の主語は？","c":["この本こそ","私が","探していた","本だ"],"a":0,"e":"「こそ」は主語を強める助詞で、文全体の主語は「この本こそ」です。「私が」は修飾部の中の主語です。"},{"t":"述語","q":"「公園の桜がとてもきれいに咲いた。」の述語は？","c":["咲いた","桜が","きれいに","とても"],"a":0,"e":"述語は文の終わりで「どうする・どんなだ」を表す部分なので「咲いた」です。"},{"t":"述語","q":"「彼の夢は医者になることだ。」の述語は？","c":["ことだ","夢は","医者に","なる"],"a":0,"e":"文末の「ことだ」が述語で、「何だ」にあたる部分です。"},{"t":"修飾語","q":"「ゆっくり歩く」の「ゆっくり」は何を修飾している？","c":["歩く","主語","話し手","文全体"],"a":0,"e":"「ゆっくり」は動作の様子を表し、用言である「歩く」を修飾する連用修飾語です。"},{"t":"修飾語","q":"「大きな 荷物を 持つ。」の「大きな」が修飾しているのは？","c":["荷物を","持つ","文全体","主語"],"a":0,"e":"「大きな」は体言である「荷物」を修飾しているので連体修飾語です。"},{"t":"修飾語","q":"連体修飾語の説明として正しいものは？","c":["体言（名詞）を修飾する","用言（動詞など）を修飾する","文全体を修飾する","述語を強調する"],"a":0,"e":"連体修飾語は名詞を、連用修飾語は動詞・形容詞などを修飾します。"},{"t":"文の成分","q":"「はい、私が行きます。」の「はい」は文の成分として何？","c":["独立語","主語","接続語","修飾語"],"a":0,"e":"応答・呼びかけ・感動を表し、他の部分と直接つながらない成分を独立語といいます。"},{"t":"文の成分","q":"「雨が降った。しかし、試合は行われた。」の「しかし」は？","c":["接続語","独立語","修飾語","述語"],"a":0,"e":"前後の文や文節をつなぐ働きをする成分を接続語といいます。"},{"t":"文の成分","q":"「兄と姉が出かけた。」の「兄と」「姉が」の関係を何という？","c":["並立の関係","補助の関係","主述の関係","修飾・被修飾の関係"],"a":0,"e":"対等に並んでいる文節どうしの関係を並立の関係といいます。"},{"t":"文の成分","q":"「置いてある」の「置いて」と「ある」の関係は？","c":["補助の関係","並立の関係","主述の関係","接続の関係"],"a":0,"e":"あとの文節が前の文節に意味を添えるだけの関係を補助の関係といいます。"},{"t":"指示語","q":"「机の上にペンがある。それを取って。」の「それ」が指すものは？","c":["ペン","机","上","取ること"],"a":0,"e":"指示語は直前に出た語句を指すことが多く、ここでは「ペン」を指しています。"},{"t":"指示語","q":"話し手からも聞き手からも遠いものを指す指示語は？","c":["あれ","これ","それ","どれ"],"a":0,"e":"「これ」は話し手に近く、「それ」は聞き手に近く、「あれ」は両方から遠いものを指します。"},{"t":"指示語","q":"「どれ」「どちら」のような指示語をまとめて何という？","c":["不定称","近称","中称","遠称"],"a":0,"e":"どれを指すかはっきり決まっていない指示語を不定称といいます。"},{"t":"接続語","q":"「たくさん練習した。___、優勝できた。」の___に入る言葉は？","c":["だから","しかし","または","ところで"],"a":0,"e":"前が理由、あとが結果になっているので順接の「だから」が入ります。"},{"t":"接続語","q":"「彼は足が速い。___、泳ぎも得意だ。」の___に入る言葉は？","c":["しかも","しかし","つまり","たとえば"],"a":0,"e":"前の内容に情報を付け加えているので、累加を表す「しかも」が入ります。"},{"t":"接続語","q":"「バスで行くか、___、歩いて行くか決めよう。」の___に入る言葉は？","c":["それとも","そのうえ","したがって","ただし"],"a":0,"e":"二つのうちどちらかを選ぶ場面なので、対比・選択を表す「それとも」が入ります。"},{"t":"接続語","q":"「宿題が終わった。___、明日の予定を決めよう。」の___に入る言葉は？","c":["さて","しかし","だから","つまり"],"a":0,"e":"話題を変えるときに使う転換の接続語が入るので「さて」が適切です。"},{"t":"接続語","q":"「今日は休みだ。___、宿題はある。」の___に入る言葉は？","c":["ただし","だから","つまり","さらに"],"a":0,"e":"前の内容に条件や例外を付け加えているので「ただし」が入ります。"},{"t":"接続語","q":"「日本には祭りが多い。___、青森のねぶた祭がある。」の___に入る言葉は？","c":["たとえば","しかし","つまり","だから"],"a":0,"e":"前の内容の具体例を挙げているので、例示を表す「たとえば」が入ります。"},{"t":"言葉の単位","q":"言葉の単位を大きいものから順に並べたものは？","c":["文章・段落・文・文節・単語","文章・文・段落・単語・文節","段落・文章・文・単語・文節","文・文章・段落・文節・単語"],"a":0,"e":"文章はいくつかの段落に、段落は文に、文は文節に、文節は単語に分けられます。"},{"t":"文の種類","q":"「なんて美しい景色だろう。」はどんな文？","c":["感動文","疑問文","命令文","平叙文"],"a":0,"e":"感動や詠嘆の気持ちを表している文なので感動文です。"},{"t":"文の成分","q":"「弟も 図書館へ 行った。」の主語はどれ？","c":["弟も","図書館へ","行った","図書館"],"a":0,"e":"「も」は「が」の代わりに主語を示す働きをするので、主語は「弟も」です。"},{"t":"文節","q":"「静かに 本を 読んで いる。」の文節の数は？","c":["四つ","三つ","五つ","二つ"],"a":0,"e":"「静かに／本を／読んで／いる」で四文節です。補助の「いる」も一つの文節になります。"},{"t":"指示語","q":"「昨日、図書館へ行った。そこで友達に会った。」の「そこ」が指すものは？","c":["図書館","昨日","友達","行ったこと"],"a":0,"e":"「そこ」は場所を指す指示語なので、前に出た場所である「図書館」を指します。"}],"4":[{"t":"品詞の識別","q":"「静かだ」の品詞は？","c":["形容動詞","形容詞","副詞","動詞"],"a":0,"e":"言い切りの形が「だ」で終わり、状態を表す活用する自立語は形容動詞です。"},{"t":"品詞の識別","q":"「美しい」の品詞は？","c":["形容詞","形容動詞","連体詞","副詞"],"a":0,"e":"言い切りの形が「い」で終わり、性質や状態を表す活用する自立語は形容詞です。"},{"t":"品詞の識別","q":"「大きな」の品詞は？","c":["連体詞","形容動詞","形容詞","副詞"],"a":0,"e":"「大きな」は活用せず名詞だけを修飾するので連体詞です。活用する「大きい」は形容詞です。"},{"t":"品詞の識別","q":"「決して」の品詞は？","c":["副詞","連体詞","接続詞","感動詞"],"a":0,"e":"「決して」は活用せず主に用言を修飾する副詞で、下に打ち消しの語を伴います。"},{"t":"品詞の識別","q":"「しかし」の品詞は？","c":["接続詞","副詞","連体詞","助詞"],"a":0,"e":"前後の文や語句をつなぐ、活用しない自立語は接続詞です。"},{"t":"品詞の識別","q":"「もしもし」の品詞は？","c":["感動詞","副詞","接続詞","名詞"],"a":0,"e":"呼びかけ・応答・感動を表し、単独でも文になれる自立語は感動詞です。"},{"t":"品詞の識別","q":"活用のない自立語で、主語になることができるものは？","c":["名詞","副詞","連体詞","接続詞"],"a":0,"e":"名詞（体言）は活用せず、助詞を伴って主語になることができます。"},{"t":"品詞の識別","q":"「彼は走るのが速い。」の「の」の品詞は？","c":["助詞","助動詞","名詞","連体詞"],"a":0,"e":"「の」は活用しない付属語なので助詞です。ここでは体言の代わりをする働きをしています。"},{"t":"動詞の活用","q":"「書く」の活用の種類は？","c":["五段活用","上一段活用","下一段活用","サ行変格活用"],"a":0,"e":"「ない」を付けると「書かない」となり、直前が「か」でア段なので五段活用です。"},{"t":"動詞の活用","q":"「起きる」の活用の種類は？","c":["上一段活用","下一段活用","五段活用","カ行変格活用"],"a":0,"e":"「ない」を付けると「起きない」となり、直前が「き」でイ段なので上一段活用です。"},{"t":"動詞の活用","q":"「食べる」の活用の種類は？","c":["下一段活用","上一段活用","五段活用","サ行変格活用"],"a":0,"e":"「ない」を付けると「食べない」となり、直前が「べ」でエ段なので下一段活用です。"},{"t":"動詞の活用","q":"カ行変格活用をする動詞は？","c":["来る","する","見る","切る"],"a":0,"e":"カ行変格活用の動詞は「来る」一語だけです。「する」はサ行変格活用になります。"},{"t":"動詞の活用","q":"サ行変格活用の動詞にあたるものは？","c":["勉強する","勉強させる","勉強できる","勉強なさる"],"a":0,"e":"サ行変格活用は「する」と、「勉強する」のように「する」が付いた形の動詞です。"},{"t":"動詞の活用","q":"「見る」の活用の種類は？","c":["上一段活用","下一段活用","五段活用","カ行変格活用"],"a":0,"e":"「見ない」となり直前が「み」でイ段なので上一段活用です。語幹と語尾の区別がつきにくい動詞です。"},{"t":"活用形","q":"「早く走れば間に合う。」の「走れ」の活用形は？","c":["仮定形","命令形","未然形","連用形"],"a":0,"e":"「ば」に続いて仮定の意味を表しているので仮定形です。"},{"t":"活用形","q":"「本を読むとき」の「読む」の活用形は？","c":["連体形","終止形","連用形","仮定形"],"a":0,"e":"体言である「とき」に続いているので連体形です。形は終止形と同じですが、下に続く語で見分けます。"},{"t":"活用形","q":"「たくさん食べた。」の「食べ」の活用形は？","c":["連用形","未然形","終止形","連体形"],"a":0,"e":"助動詞「た」に続く形なので連用形です。"},{"t":"活用形","q":"「早く行け。」の「行け」の活用形は？","c":["命令形","仮定形","連用形","未然形"],"a":0,"e":"言い切って命令する形なので命令形です。"},{"t":"活用形","q":"「まだ始まらない。」の「始まら」の活用形は？","c":["未然形","連用形","仮定形","連体形"],"a":0,"e":"打ち消しの助動詞「ない」に続く形なので未然形です。"},{"t":"自動詞他動詞","q":"次のうち他動詞はどれ？","c":["ドアを開ける","ドアが開く","花が咲く","風が吹く"],"a":0,"e":"「〜を」という対象をとり、動作が他に及ぶ動詞を他動詞といいます。"},{"t":"助動詞","q":"「先生が話される。」の「れる」の意味は？","c":["尊敬","受け身","可能","自発"],"a":0,"e":"目上の人の動作に付いて敬意を表しているので尊敬の意味です。"},{"t":"助動詞","q":"「弟にほめられる。」の「られる」の意味は？","c":["受け身","尊敬","可能","自発"],"a":0,"e":"他から動作を受けていることを表しているので受け身の意味です。"},{"t":"助動詞","q":"「昔のことが思い出される。」の「れる」の意味は？","c":["自発","受け身","尊敬","可能"],"a":0,"e":"自分の意志とは関係なく自然にそうなる意味なので自発です。"},{"t":"助動詞","q":"「明日は晴れるようだ。」の「ようだ」の意味は？","c":["推定","たとえ","例示","断定"],"a":0,"e":"何かを根拠にしておしはかっているので推定です。たとえの場合は「まるで」などを伴います。"},{"t":"助動詞","q":"「これは私の本だ。」の「だ」の品詞は？","c":["助動詞","助詞","形容動詞の一部","動詞"],"a":0,"e":"断定を表す「だ」は活用する付属語なので助動詞です。"},{"t":"助動詞","q":"「行きたい」の「たい」が表す意味は？","c":["希望","打ち消し","過去","推量"],"a":0,"e":"「たい」は話し手の願いを表す希望の助動詞です。"},{"t":"助詞","q":"「雨が降ったので中止だ。」の「ので」の種類は？","c":["接続助詞","格助詞","副助詞","終助詞"],"a":0,"e":"活用する語に付いて前後をつなぐ働きをする助詞を接続助詞といいます。"},{"t":"助詞","q":"「弟が公園で遊ぶ。」の「で」の種類は？","c":["格助詞","接続助詞","副助詞","終助詞"],"a":0,"e":"主に体言に付いて、他の語との関係を示す助詞を格助詞といいます。"},{"t":"助詞","q":"「早く帰りなさいよ。」の「よ」の種類は？","c":["終助詞","格助詞","接続助詞","副助詞"],"a":0,"e":"文末に付いて話し手の気持ちや調子を表す助詞を終助詞といいます。"},{"t":"品詞の識別","q":"「ない」が助動詞であるものは？","c":["行かない","少ない","危ない","もったいない"],"a":0,"e":"「行かない」の「ない」は動詞に付く付属語なので助動詞です。他は形容詞、または語の一部です。"}],"5":[{"t":"敬語の種類","q":"「先生がおっしゃる」の敬語の種類は？","c":["尊敬語","謙譲語","丁寧語","美化語"],"a":0,"e":"「おっしゃる」は「言う」の尊敬語で、相手の動作を高めて敬意を表します。"},{"t":"敬語の種類","q":"「私が申し上げる」の敬語の種類は？","c":["謙譲語","尊敬語","丁寧語","美化語"],"a":0,"e":"「申し上げる」は「言う」の謙譲語で、自分の動作をへりくだって相手を高めます。"},{"t":"敬語の種類","q":"「これは本です。」の「です」の敬語の種類は？","c":["丁寧語","尊敬語","謙譲語","美化語"],"a":0,"e":"「です」「ます」は聞き手に対して丁寧に述べる丁寧語です。"},{"t":"敬語の使い分け","q":"先生の動作について「見る」の尊敬語を使うと？","c":["ご覧になる","拝見する","お目にかかる","見ていただく"],"a":0,"e":"「ご覧になる」が「見る」の尊敬語です。「拝見する」は自分がへりくだる謙譲語です。"},{"t":"敬語の使い分け","q":"自分が先生の作品を「見る」ときの正しい言い方は？","c":["拝見します","ご覧になります","お見えになります","見られます"],"a":0,"e":"自分の動作なので謙譲語の「拝見します」を使います。"},{"t":"敬語の使い分け","q":"「行く」の謙譲語として正しいものは？","c":["伺う","いらっしゃる","おいでになる","お越しになる"],"a":0,"e":"「伺う」が謙譲語で、残りの三つはすべて尊敬語です。"},{"t":"敬語の使い分け","q":"お客様に食事をすすめるときの正しい言い方は？","c":["どうぞ召し上がってください","どうぞいただいてください","どうぞ頂戴してください","どうぞ食べさせてくだ :0,"e":"前の内容に同じ種類の事がらを付け加えているので、累加の「さらに」が入ります。"},{"t":"接続語","q":"次の文の___に入る語は？\n電車で行きますか。___、バスで行きますか。","c":["それとも","だから","なぜなら","そして"],"a":0,"e":"二つのうちどちらかを選ばせているので、選択の「それとも」が入ります。"},{"t":"接続語","q":"次の文の___に入る語は？\n彼は私の母の弟だ。___、私にとってはおじにあたる。","c":["つまり","しかし","ところで","たとえば"],"a":0,"e":"前の内容を別の言葉で言いかえているので、説明・換言の「つまり」が入ります。"},{"t":"接続語","q":"次の文の___に入る語は？\n今日はよい天気だ。___、宿題は終わったの。","c":["ところで","だから","しかも","つまり"],"a":0,"e":"話題をまったく別のものに変えているので、転換の「ところで」が入ります。"},{"t":"接続語","q":"次の文の___に入る語は？\n私は果物が好きだ。___、りんごやみかんをよく食べる。","c":["たとえば","しかし","だから","または"],"a":0,"e":"あとに具体例をあげているので、例示の「たとえば」が入ります。"},{"t":"接続語","q":"次の文の___に入る語は？\n今日は外出できない。___、大雨だからだ。","c":["なぜなら","それで","ところが","もしくは"],"a":0,"e":"後ろで理由を述べているので、理由を示す「なぜなら」が入ります。"},{"t":"接続語","q":"次の文の___に入る語は？\n明日は遠足だ。___、雨天の場合は中止する。","c":["ただし","そして","つまり","やはり"],"a":0,"e":"前の内容に条件や例外を補っているので、補足の「ただし」が入ります。"},{"t":"指示語","q":"――線「それ」が指す内容は？\n祖父は庭に小さな畑を作った。それは家族全員の楽しみになった。","c":["祖父が作った小さな畑","祖父","家族全員","庭の広さ"],"a":0,"e":"指示語は原則として直前の内容を指すので、祖父が作った小さな畑を指します。"},{"t":"指示語","q":"――線「このこと」が指す内容は？\n図書館は放課後も開いている。このことを知らない生徒が多い。","c":["図書館が放課後も開いていること","生徒の数が多いこと","図書館が新しく建てられたこと","放課後の過ごし方"],"a":0,"e":"直前の一文の内容が、そのまま「このこと」の指す内容になります。"},{"t":"指示語","q":"指示語の指す内容は、原則としてどこにあるか。","c":["指示語より前の部分","文章のいちばん最後","題名の中","指示語のすぐ後ろだけ"],"a":0,"e":"指示語は前に出た語句や内容を指し示すので、まず直前をさかのぼって探します。"},{"t":"指示語","q":"――線「そこ」が指す場所は？\n駅前に新しい書店ができた。そこでは地元の作家の本も並んでいる。","c":["駅前にできた新しい書店","駅のホーム","作家の家","近所の図書館"],"a":0,"e":"「そこ」は場所を指す指示語で、直前の駅前にできた新しい書店を指します。"},{"t":"要点","q":"次の段落の要点として最も適切なものは？\n道具は人の手の延長である。石をつかむ手が斧になり、走る足が車になった。\n人は道具によって、自分の体の限界をこえてきたのだ。","c":["人は道具によって体の限界をこえてきた","石は斧よりも便利である","人の手はとても器用である","車は足より速く走れる"],"a":0,"e":"最後の一文が段落全体をまとめた要点で、前の二文はその具体例です。"},{"t":"筆者の主張","q":"次の文章で筆者が最も言いたいことは？\n情報は多ければよいというものではない。量が増えるほど、何が大切かは見えにくくなる。\n大切なのは、集めることではなく選ぶ力である。","c":["情報は選ぶ力こそが大切だ","情報はできるだけ多く集めるべきだ","情報は少ないほどよい","情報集めは他人にまかせるべきだ"],"a":0,"e":"最後の一文の、大切なのは選ぶ力であるという部分に筆者の主張が示されています。"},{"t":"事実と意見","q":"次のうち、意見を述べた文はどれか。","c":["この本はもっと多くの人に読まれるべきだ","この本は昨年出版された","この本は三百ページある","この本は英語に翻訳された"],"a":0,"e":"「べきだ」は書き手の判断を表す言い方で、確かめられる事実ではなく意見です。"},{"t":"文章構成","q":"説明的文章で、話題の提示や問いかけが多く置かれるのはどの部分か。","c":["序論（初め）","本論の中ほど","結論のすぐ前","文章のいちばん最後"],"a":0,"e":"序論で話題や問いを示し、本論で説明し、結論でまとめるのが基本の構成です。"},{"t":"文章構成","q":"初めと終わりの両方に筆者の主張が置かれている構成の型を何というか。","c":["双括型","頭括型","尾括型","並列型"],"a":0,"e":"初めだけなら頭括型、終わりだけなら尾括型、その両方にあるものを双括型といいます。"},{"t":"段落の働き","q":"「このように」で始まる段落が果たす働きとして最も適切なものは？","c":["それまでの内容をまとめる","まったく新しい話題を出す","反対の意見を紹介する","具体例を一つ加える"],"a":0,"e":"「このように」はまとめを導く言葉で、前に述べた内容を整理して結論へ進めます。"},{"t":"具体と抽象","q":"次の文章で、具体例にあたる部分はどれか。\n言葉は変化する。たとえば「やばい」は、もともと危ないという意味だった。\n今では、すばらしいという意味でも使われる。","c":["「やばい」の意味の移り変わり","言葉は変化するという内容","今と昔という時間の対比","文章全体の題名"],"a":0,"e":"「たとえば」以降が、言葉は変化するという主張を支える具体例になっています。"},{"t":"接続語","q":"逆接の接続語のあとに置かれやすいのはどれか。","c":["筆者が本当に言いたいこと","一般によく知られた事実","話題を変えるための質問","文章全体の題名"],"a":0,"e":"「しかし」などの逆接のあとには、一般論を打ち消して筆者の主張が示されることが多いです。"},{"t":"要旨","q":"文章の要旨とはどのようなものか。","c":["文章全体で筆者が伝えたい中心の内容","文章に出てくる語句の意味","文章の中で一番長い段落","筆者の経歴や作品名"],"a":0,"e":"要旨は文章全体を通した中心的な内容で、部分的な説明とは区別されます。"},{"t":"対比","q":"次の文章に用いられている表現の工夫は？\n昔の人は空を見て天気を知った。今の人は画面を見て天気を知る。","c":["昔と今を並べて示す対比","同じ語をくり返す反復","人でないものを人に見立てる擬人法","文末を名詞で止める体言止め"],"a":0,"e":"昔と今という二つの事がらを並べて違いを示しており、対比の構成になっています。"},{"t":"問いかけ","q":"説明文の中で筆者が読者に問いかける文を置く目的として最も適切なものは？","c":["読者の関心を引き、話題に注目させるため","字数を増やして文章を長くするため","結論をあいまいにするため","具体例を省略するため"],"a":0,"e":"問いかけは読者の注意を集め、これから述べる話題へ導く働きをします。"},{"t":"キーワード","q":"説明的文章で、くり返し出てくる語に注目するとよいのはなぜか。","c":["文章の中心となる話題を表していることが多いから","筆者が書き間違えていることが多いから","難しい語ほど答えになりやすいから","段落の数を数えやすくなるから"],"a":0,"e":"何度も出てくる語はキーワードであり、文章の話題や主張と深く結びついています。"},{"t":"読解","q":"次の文章の___に入る接続語は？\n植物は動くことができない。___、風や動物の力を借りて種を遠くへ運ぶ。\nじっとしているように見えて、実はしたたかなのだ。","c":["そこで","つまり","たとえば","ところで"],"a":0,"e":"前の事情を受けて、それに対する工夫を述べているので、順接の「そこで」が入ります。"},{"t":"読解","q":"次の文章の要点として最も適切なものは？\n地図は現実をそのまま写したものではない。必要な情報だけを残し、他を思い切って消している。\n消すことによって、かえって道筋がはっきり見えるのだ。","c":["地図は情報を省くことで分かりやすくなっている","地図は現実を正確に写した絵である","地図は情報が多いほど役に立つ","地図は道路だけを示すものである"],"a":0,"e":"消すことでかえって分かりやすくなるという最後の一文が、この文章の要点です。"},{"t":"読解","q":"――線「それ」が指す内容は？\n実験に失敗はつきものだ。うまくいかない原因を一つずつ確かめていく。\nそれが次の成功への近道になる。","c":["うまくいかない原因を一つずつ確かめること","実験に失敗すること","実験の道具をそろえること","成功した実験の結果"],"a":0,"e":"直前の一文を「それ」が受けており、原因を一つずつ確かめる作業を指しています。"},{"t":"読解","q":"次の文章で筆者が最も言いたいことは？\n辞書は言葉を決める本だと思われがちだ。しかし実際は、人々が使っている言葉を集めて記録した本である。\n言葉を作るのは辞書ではなく、使う人なのだ。","c":["言葉を作るのは辞書ではなく使う人である","辞書は言葉の正しさを決める本である","辞書はできるだけ厚いほうがよい","辞書は新しい言葉を載せてはいけない"],"a":0,"e":"逆接の「しかし」のあとに筆者の考えが示され、最後の一文で主張がまとめられています。"},{"t":"段落関係","q":"次の文章で、第二段落が第一段落に対して果たしている働きは？\n第一段落 早起きは体によいと言われる。\n第二段落 しかし、夜型の人が無理に早起きすると、かえって体調をくずすこともある。","c":["前の内容に反する例をあげて問い直している","前の内容を具体例で補強している","前の内容をそのままくり返している","前の内容の言葉を言いかえている"],"a":0,"e":"「しかし」で始まり一般論への反例を示しているので、前の内容を問い直す働きです。"}],"7":[{"t":"表現技法","q":"次の表現に使われている技法は？\n雪のように白い肌。","c":["直喩（明喩）","隠喩（暗喩）","擬人法","体言止め"],"a":0,"e":"「ようだ」「ように」などを使ってたとえていることを示す表現を直喩といいます。"},{"t":"表現技法","q":"次の表現に使われている技法は？\n彼女は我が家の太陽だ。","c":["隠喩（暗喩）","直喩（明喩）","倒置法","反復法"],"a":0,"e":"「ようだ」などを使わずに、直接ほかのものに見立てる表現を隠喩といいます。"},{"t":"表現技法","q":"次の表現に使われている技法は？\n木々が風にささやいている。","c":["擬人法","直喩","体言止め","省略法"],"a":0,"e":"人でないものを人のように表す技法を擬人法といいます。"},{"t":"表現技法","q":"次の表現に使われている技法は？\n見上げれば、どこまでも青い空。","c":["体言止め","倒置法","反復法","対句法"],"a":0,"e":"文末を名詞（体言）で止めて余韻を残す技法を体言止めといいます。"},{"t":"表現技法","q":"次の表現に使われている技法は？\n本当にきれいだね、今日の夕焼けは。","c":["倒置法","体言止め","擬人法","隠喩"],"a":0,"e":"普通の語順を入れかえて印象を強める技法を倒置法といいます。"},{"t":"表現技法","q":"次の表現に使われている技法は？\n走れ、走れ、ただひたすらに走れ。","c":["反復法","対句法","倒置法","擬人法"],"a":0,"e":"同じ語句をくり返して調子を整え、印象を強める技法を反復法といいます。"},{"t":"表現技法","q":"次の表現に使われている技法は？\n山は高く、海は深い。","c":["対句法","反復法","体言止め","直喩"],"a":0,"e":"よく似た組み立ての語句を並べて調子を整える技法を対句法といいます。"},{"t":"表現技法","q":"次の――線の語の種類は？\n雨がざあざあと降ってきた。","c":["擬音語","擬態語","枕詞","縁語"],"a":0,"e":"実際の音をまねて表した語を擬音語（擬声語）といいます。"},{"t":"表現技法","q":"次の――線の語の種類は？\n星がきらきらと光っている。","c":["擬態語","擬音語","掛詞","序詞"],"a":0,"e":"音ではなく、様子や状態を感じのままに表した語を擬態語といいます。"},{"t":"表現技法","q":"直喩（明喩）の目印となる言葉として、適切でないものはどれか。","c":["である","ようだ","ごとし","みたいだ"],"a":0,"e":"「ようだ」「ごとし」「みたいだ」はたとえを示す語ですが、「である」は断定で目印になりません。"},{"t":"表現技法","q":"次の表現に使われている技法は？\n彼の心には、いつしか小さな灯がともっていた。","c":["隠喩","直喩","擬音語","対句法"],"a":0,"e":"希望などの気持ちを灯にたとえ、「ようだ」を使わずに表しているので隠喩です。"},{"t":"表現技法","q":"次の表現に使われている技法は？\n夜がそっと町を包みこむ。","c":["擬人法","直喩","倒置法","体言止め"],"a":0,"e":"人でない夜が、人のように包みこむと表されているので擬人法です。"},{"t":"表現技法","q":"次のうち、倒置法が使われているのはどれか。","c":["行こう、あの丘の上まで。","あの丘の上まで行こう。","丘の上へと続く長い道。","丘は高く、道は長い。"],"a":0,"e":"普通は、あの丘の上まで行こう、となる語順を入れかえているので倒置法です。"},{"t":"表現技法","q":"次のうち、体言止めが使われているのはどれか。","c":["机の上に置かれた、一通の手紙。","机の上に手紙が置かれていた。","手紙を机の上に置いた。","置かれていたのは手紙だ。"],"a":0,"e":"文末が手紙という名詞（体言）で終わっているので体言止めです。"},{"t":"心情読解","q":"――線から読み取れる「私」の心情は？\n合格発表の紙に自分の番号を見つけたとき、私は思わずその場にしゃがみこんだ。\n手のひらには、じっとりと汗がにじんでいた。","c":["緊張がとけた安心と喜び","相手をうらやむ気持ち","将来への強い不安","周囲へのいらだち"],"a":0,"e":"番号を見つけた直後の反応と汗の描写から、張りつめていた緊張がゆるんだ喜びが読み取れます。"},{"t":"情景描写","q":"――線の情景描写が表しているものは？\n親友が転校していった日の夕方、私は誰もいない校庭に立っていた。\n風がブランコをゆっくりと揺らしていた。","c":["主人公のさびしさ","主人公の怒り","主人公の得意な気持ち","主人公のあせり"],"a":0,"e":"誰もいない校庭と無人のブランコという情景が、主人公の心のさびしさを重ねて表しています。"},{"t":"心情読解","q":"――線から読み取れる「僕」の心情は？\n差し出された賞状を受け取りながら、僕は皆の顔を見ることができなかった。\nあの一球を見逃していたことを知っているのは、自分だけだった。","c":["後ろめたさ","純粋な喜び","相手への感謝","強い自信"],"a":0,"e":"自分だけが知る事実に触れて顔を上げられずにいることから、後ろめたい気持ちが分かります。"},{"t":"情景描写","q":"次の文章の情景が表している心情は？\n祖母の家を出るとき、空はどこまでも晴れていた。\nそれなのに、私の足取りは重かった。","c":["晴れた空とは対照的な、沈んだ気持ち","晴れた空と同じ、明るい気持ち","早く帰りたいというあせり","祖母に対する怒り"],"a":0,"e":"晴天と重い足取りを対比させることで、明るい情景に反する沈んだ心情が強調されています。"},{"t":"随筆","q":"随筆の説明として最も適切なものは？","c":["筆者が見聞きしたことや感じたことを自由に書いた文章","作者が想像で作り上げた人物を描く物語","事実だけを客観的に伝える報道の文章","五七五の音数で季節を詠む文章"],"a":0,"e":"随筆は、筆者自身の体験や感想を形式にとらわれずに書いた文章です。"},{"t":"視点","q":"次の文章の語り手（視点）はどれか。\n私は黙って窓の外を見ていた。友人が何か言いたそうにしているのが、横目にも分かった。","c":["作品の中の人物である「私」","作品の外にいる第三者","登場人物全員","作者の伝記を書く人"],"a":0,"e":"「私」が語り手として自分の見聞きしたことを述べているので、一人称の視点です。"},{"t":"心情の変化","q":"次の文章で、「僕」の心情はどのように変化したか。\n初めは面倒だと思っていた。だが、土の中から芽が顔を出したとき、僕は毎朝そこへ通うようになった。","c":["面倒だという気持ちから、大切に思う気持ちへ","楽しい気持ちから、退屈な気持ちへ","不安な気持ちから、こわい気持ちへ","得意な気持ちから、はずかしい気持ちへ"],"a":0,"e":"面倒だという気持ちから、毎朝通うほど気にかけるようになった変化が描かれています。"},{"t":"心情読解","q":"人物の心情が直接書かれていないとき、読み取る手がかりとして適切でないものはどれか。","c":["文章に使われている漢字の画数","人物の行動やしぐさ","人物の会話や口調","周りの情景の描写"],"a":0,"e":"心情は行動・会話・情景描写から読み取ります。漢字の画数は手がかりになりません。"},{"t":"情景描写","q":"小説における情景描写の主な働きとして最も適切なものは？","c":["場面の様子を示し、人物の心情を暗示する","作者の経歴を読者に伝える","文章の段落数を増やす","登場人物の名前を説明する"],"a":0,"e":"情景描写は場面を伝えるだけでなく、人物の心情を重ねて表す働きをもちます。"},{"t":"心情読解","q":"――線から読み取れる母の心情は？\n出発の朝、母は何度も同じことを言った。\n忘れ物はないか、切符は持ったか、と。","c":["旅立つ子を心配する気持ち","子をしかりつける気持ち","子をうらやむ気持ち","子にあきれる気持ち"],"a":0,"e":"同じ確認を何度もくり返す様子から、旅立つ子を案じる気持ちが読み取れます。"},{"t":"心情読解","q":"――線から読み取れる「私」の心情は？\n返そうと思っていた本を、今日もかばんに入れたまま帰ってきた。\n明日こそは、と思いながら、私はその本をそっと机の奥にしまった。","c":["返すことをためらう気持ち","本を読み終えた満足感","持ち主への怒り","本をなくしたあせり"],"a":0,"e":"返せないまま机の奥にしまうという行動から、返すのをためらう気持ちが読み取れます。"},{"t":"情景描写","q":"次の文章から読み取れる場面の時刻はいつか。\n障子が白みはじめ、鳥の声が一つ、二つと増えていく。\n遠くで新聞配達の自転車の音がした。","c":["夜明け","真昼","夕暮れ","真夜中"],"a":0,"e":"障子が白む、鳥が鳴きはじめる、新聞配達の音という描写から夜明けと分かります。"},{"t":"表現技法","q":"次の文で、くり返しが生む効果として最も適切なものは？\n待った。待った。それでも彼は来なかった。","c":["長く待ち続けた気持ちの強さを印象づける","話題が変わったことを示す","時間が短かったことを示す","場所を正確に説明する"],"a":0,"e":"同じ語を重ねる反復によって、待ち続けた時間の長さと心情の強さが強調されます。"},{"t":"心情読解","q":"次の文章の___に入る言葉として最も適切なものは？\n落とした消しゴムを拾ってくれた転校生に、私は___お礼を言った。\n声が小さすぎて、届いたかどうかも分からなかった。","c":["ぼそぼそと","はきはきと","堂々と","声高に"],"a":0,"e":"あとの文に声が小さすぎたとあるので、小声で不明瞭な様子を表す「ぼそぼそと」が合います。"},{"t":"小説の構成","q":"小説で、対立や問題がもっとも高まる場面を何というか。","c":["山場（クライマックス）","発端","結末","前書き"],"a":0,"e":"物語が最も盛り上がり、人物の心情が大きく動く場面を山場（クライマックス）といいます。"},{"t":"主題","q":"小説の主題とはどのようなものか。","c":["作品を通して作者が伝えようとする中心の考え","作品に出てくる登場人物の人数","物語の舞台となった年代や地名","作品の題名に使われた漢字"],"a":0,"e":"主題は作品全体を貫く中心的な考えで、あらすじや設定そのものとは区別されます。"}],"8":[{"t":"仮名遣い","q":"「けふ」を現代仮名遣いで書くと？","c":["きょう","けう","こう","けほ"],"a":0,"e":"「ふ」を「う」に直すと「けう」となり、のばす音になって「きょう」と読みます。"},{"t":"仮名遣い","q":"「てふ」を現代仮名遣いで書くと？","c":["ちょう","てう","でう","とう"],"a":0,"e":"「ふ」を「う」に直すと「てう」となり、さらに「ちょう」と読みます。蝶のことです。"},{"t":"仮名遣い","q":"「ゐる」を現代仮名遣いで書くと？","c":["いる","ゑる","うる","える"],"a":0,"e":"「ゐ」は「い」に、「ゑ」は「え」に直します。"},{"t":"仮名遣い","q":"「をとこ」を現代仮名遣いで書くと？","c":["おとこ","をとこ","うおとこ","ようとこ"],"a":0,"e":"助詞以外の「を」は「お」に直すので、をとこ は おとこ となります。"},{"t":"仮名遣い","q":"「あはれ」を現代仮名遣いで書くと？","c":["あわれ","あはれ","あばれ","あうれ"],"a":0,"e":"語頭以外のハ行の音はワ行に直すので、「は」は「わ」になります。"},{"t":"仮名遣い","q":"「いふ」を現代仮名遣いで書くと？","c":["いう","いふ","ゆう","いぶ"],"a":0,"e":"語頭以外のハ行はワ行に直すので、「ふ」は「う」になります。"},{"t":"仮名遣い","q":"「なほ」を現代仮名遣いで書くと？","c":["なお","なほ","なを","なぼ"],"a":0,"e":"語頭以外の「ほ」は「お」に直します。"},{"t":"仮名遣い","q":"「よろづ」を現代仮名遣いで書くと？","c":["よろず","よろづ","よろつ","よろじ"],"a":0,"e":"「づ」は「ず」に、「ぢ」は「じ」に直します。"},{"t":"仮名遣い","q":"菓子を表す古語「くわし」を現代仮名遣いで書くと？","c":["かし","くわし","かわし","こうし"],"a":0,"e":"「くわ」は「か」に、「ぐわ」は「が」に直します。"},{"t":"仮名遣い","q":"「ゑむ」を現代仮名遣いで書くと？","c":["えむ","ゐむ","をむ","へむ"],"a":0,"e":"「ゑ」は「え」に直すので、ゑむ は えむ となります。"},{"t":"古語の意味","q":"古語「あはれなり」の意味として最も適切なものは？","c":["しみじみと心を打たれる","おもしろくて笑える","気の毒でみじめだ","めんどうくさい"],"a":0,"e":"「あはれなり」は深く感動して、しみじみとした思いになる様子を表します。"},{"t":"古語の意味","q":"古語「をかし」の意味として最も適切なものは？","c":["趣がある・興味深い","おかしくて笑える","みっともない","おそろしい"],"a":0,"e":"「をかし」は明るく知的に美しさや面白さを味わう気持ちで、笑いの意味ではありません。"},{"t":"古語の意味","q":"古語「うつくし」の意味として最も適切なものは？","c":["かわいらしい","堂々として立派だ","清らかで汚れがない","たいへんめずらしい"],"a":0,"e":"古文の「うつくし」は、小さいものへのいとおしさ、かわいらしさを表します。"},{"t":"古語の意味","q":"古語「ありがたし」の意味として最も適切なものは？","c":["めったにない","感謝したい","ありふれている","たいへんつらい"],"a":0,"e":"有り難しと書き、存在することが難しい、つまりめったにないという意味です。"},{"t":"古語の意味","q":"古語「おどろく」の意味として最も適切なものは？","c":["目を覚ます","びっくりして逃げる","大声を出す","急に走り出す"],"a":0,"e":"古文の「おどろく」は、はっと気づく、目を覚ますという意味で使われます。"},{"t":"古語の意味","q":"古語「つとめて」の意味として最も適切なものは？","c":["早朝","努力して","そのうえ","夕方"],"a":0,"e":"「つとめて」は早朝、また翌朝という意味の名詞です。"},{"t":"古語の意味","q":"古語「やがて」の意味として最も適切なものは？","c":["そのまま・すぐに","しばらくして","やっとのことで","いつも決まって"],"a":0,"e":"古文の「やがて」はそのまま、すぐにの意味で、現代語のしばらくしてとは異なります。"},{"t":"古語の意味","q":"古語「ゆかし」の意味として最も適切なものは？","c":["見たい・知りたい","古めかしい","ゆかいだ","ゆったりしている"],"a":0,"e":"「ゆかし」は心がひかれて、見たい、聞きたい、知りたいという意味です。"},{"t":"古語の意味","q":"愛しと書く古語「かなし」の意味として最も適切なものは？","c":["いとしい・かわいい","つらく苦しい","はかなく消えやすい","おそろしい"],"a":0,"e":"愛しと書く「かなし」は、心がひかれていとしい、かわいいという意味です。"},{"t":"古語の意味","q":"古語「いと」の意味として最も適切なものは？","c":["たいそう・とても","ほんの少し","やはり・それでも","まったく〜ない"],"a":0,"e":"「いと」は程度がはなはだしいことを表す副詞で、とてもと 気そうだ"],"a":0,"e":"人から聞いた内容を表すのが伝聞で、終止形に付きます。様態は連用形などに付きます。"},{"t":"文法識別","q":"次の――線「ようだ」のうち、比喩（たとえ）の意味であるものはどれか。","c":["彼の手は氷のようだ","どうやら誰もいないようだ","かぜをひいたようだ","サッカーのような球技が好きだ"],"a":0,"e":"まるで〜のようだ と言いかえられるものが比喩です。他は推定と例示です。"},{"t":"品詞","q":"「静かな」の品詞は何か。","c":["形容動詞","形容詞","連体詞","副詞"],"a":0,"e":"言い切りの形が 静かだ となり、活用があるので形容動詞です。"},{"t":"品詞","q":"「大きな」の品詞は何か。","c":["連体詞","形容動詞","形容詞","副詞"],"a":0,"e":"大きな は活用がなく体言だけを修飾するので連体詞です。大きい は形容詞です。"},{"t":"活用","q":"口語文法で、「書けば」の「書け」は何形か。","c":["仮定形","已然形","命令形","未然形"],"a":0,"e":"「ば」に続いて条件を表す形なので、口語文法では仮定形といいます。"},{"t":"読解","q":"次の文章で筆者が最も言いたいことは？\n便利さは時間を生む。だが、生まれた時間を何に使うかは、便利さが決めてくれるわけではない。\n道具が進むほど、私たちは自分の選び方を問われることになる。","c":["便利になるほど、時間の使い方を選ぶ力が問われる","便利な道具はできるだけ使わないほうがよい","便利さはかえって時間をうばうものである","道具の進歩に人はついていけない"],"a":0,"e":"最後の一文が主張で、便利さそのものより時間の使い方を選ぶことが問われると述べています。"},{"t":"読解","q":"――線「その」が指す内容は？\n植物の種の多くは、親のすぐそばには落ちない。風や動物に運ばれ、遠くで芽を出す。\nその仕組みが、種の広がりを支えている。","c":["風や動物に運ばれて遠くで芽を出す仕組み","親の植物がやがて枯れる仕組み","種が芽を出さずに眠る仕組み","動物が種を食べてしまう仕組み"],"a":0,"e":"直前の一文を その が受けており、運ばれて遠くで発芽することを指しています。"},{"t":"読解","q":"次の文章の___に入る接続語は？\n地図記号は絵ではない。だれが見ても同じ意味に読めるよう、形を単純にしてある。\n___、記号は共通の約束ごとなのである。","c":["つまり","しかし","たとえば","ところで"],"a":0,"e":"前の内容を言いかえてまとめているので、説明・換言の つまり が入ります。"},{"t":"古典総合","q":"「あはれなり」と「をかし」の説明として正しい組み合わせはどれか。","c":["あはれなり＝しみじみとした感動、をかし＝明るく興味深い趣","あはれなり＝おかしくて笑える、をかし＝かわいそうだ","あはれなり＝立派だ、をかし＝おそろしい","あはれなり＝めったにない、をかし＝早朝"],"a":0,"e":"あはれなり は心にしみる感動、をかし は知的で明るい美しさや面白さを表します。"},{"t":"古典総合","q":"次の古文の現代語訳として最も適切なものは？\nつれづれなるままに、日暮らし、硯に向かひて","c":["することもなく手持ちぶさたなまま、一日中、硯に向かって","つらい気持ちのまま、朝早くから硯を洗って","忙しく働きながら、夜通し硯を使って","悲しみのあまり、硯を投げ捨てて"],"a":0,"e":"つれづれなり は手持ちぶさたな様子、日暮らし は一日中の意です。徒然草の冒頭です。"},{"t":"古典総合","q":"「祇園精舎の鐘の声、諸行無常の響きあり」に表れている考え方は？","c":["この世のすべては移り変わるという無常観","武士は必ず戦に勝つという考え","身分の高い者ほど正しいという考え","自然だけは永遠に変わらないという考え"],"a":0,"e":"諸行無常とは、すべてのものは常に移り変わるという仏教の考え方です。"}]}},"suugaku":{"levels":[{"n":1,"grade":"中1","title":"正負の数","desc":"加減乗除・累乗・四則混合"},{"n":2,"grade":"中1","title":"文字式と一次方程式","desc":"文字式の計算と方程式・文章題"},{"n":3,"grade":"中1","title )(x-7) を展開すると？","c":["x²-49","x²+49","x²-14x-49","x²-14x+49"],"a":0,"e":"(x+a)(x-a)=x²-a² より、x²-49です。xの項は消えます。"},{"t":"乗法公式","q":"(x+2)(x-5) を展開すると？","c":["x²-3x-10","x²+3x-10","x²-3x+10","x²-7x-10"],"a":0,"e":"和は2+(-5)=-3、積は2×(-5)=-10。よってx²-3x-10です。"},{"t":"乗法公式","q":"(2x+3)(2x-3) を展開すると？","c":["4x²-9","2x²-9","4x²-6x-9","4x²+9"],"a":0,"e":"和と差の積なので(2x)²-3²=4x²-9です。2xを2乗すると4x²になることに注意します。"},{"t":"乗法公式","q":"(3x+1)² を展開すると？","c":["9x²+6x+1","3x²+6x+1","9x²+3x+1","9x²+1"],"a":0,"e":"(3x)²+2×3x×1+1²=9x²+6x+1です。"},{"t":"式の計算","q":"(x+2)(x+3) - (x+1)(x+4) を計算すると？","c":["2","2x+2","10","-2"],"a":0,"e":"それぞれ展開するとx²+5x+6とx²+5x+4。引くと6-4=2です。"},{"t":"乗法公式の利用","q":"乗法公式を使って 102×98 を計算すると？","c":["9996","10004","9998","9994"],"a":0,"e":"(100+2)(100-2)=100²-2²=10000-4=9996です。"},{"t":"因数分解","q":"x²+7x+12 を因数分解すると？","c":["(x+3)(x+4)","(x+2)(x+6)","(x-3)(x-4)","(x+1)(x+12)"],"a":0,"e":"かけて12、たして7になる2数は3と4なので(x+3)(x+4)です。"},{"t":"因数分解","q":"x²-9x+20 を因数分解すると？","c":["(x-4)(x-5)","(x+4)(x+5)","(x-2)(x-10)","(x-1)(x-20)"],"a":0,"e":"かけて20、たして-9になる2数は-4と-5なので(x-4)(x-5)です。"},{"t":"因数分解","q":"x²-x-12 を因数分解すると？","c":["(x+3)(x-4)","(x-3)(x+4)","(x+2)(x-6)","(x-2)(x+6)"],"a":0,"e":"かけて-12、たして-1になる2数は3と-4なので(x+3)(x-4)です。符号のつけ方に注意します。"},{"t":"因数分解","q":"x²-16 を因数分解すると？","c":["(x+4)(x-4)","(x-4)²","(x+4)²","(x+8)(x-2)"],"a":0,"e":"a²-b²=(a+b)(a-b)の形で、16=4²なので(x+4)(x-4)です。"},{"t":"因数分解","q":"x²+10x+25 を因数分解すると？","c":["(x+5)²","(x-5)²","(x+5)(x-5)","(x+25)(x+1)"],"a":0,"e":"25=5²、10=2×5なので(x+5)²です。"},{"t":"因数分解","q":"x²-12x+36 を因数分解すると？","c":["(x-6)²","(x+6)²","(x-6)(x+6)","(x-4)(x-9)"],"a":0,"e":"36=6²、12=2×6で真ん中の符号がマイナスなので(x-6)²です。"},{"t":"因数分解","q":"3x²-6x を因数分解すると？","c":["3x(x-2)","3(x²-2x)","3x(x-6)","x(3x-6)"],"a":0,"e":"共通因数3xでくくって3x(x-2)です。共通因数は数と文字の両方をとり出します。"},{"t":"因数分解","q":"2x²-8 を因数分解すると？","c":["2(x+2)(x-2)","2(x²-4)","(2x+4)(x-2)","2(x-2)²"],"a":0,"e":"まず共通因数2でくくって2(x²-4)、さらにx²-4=(x+2)(x-2)なので2(x+2)(x-2)です。"},{"t":"因数分解","q":"3x²+12x+12 を因数分解すると？","c":["3(x+2)²","3(x²+4x+4)","3(x+4 =25-12=13。分母は2a=6なので x=(5±√13)/6 です。"},{"t":"解の公式","q":"二次方程式 x²+x-1=0 を解くと？","c":["x=(-1±√5)/2","x=(1±√5)/2","x=(-1±√3)/2","x=(-1±√5)/4"],"a":0,"e":"a=1, b=1, c=-1。b²-4ac=1+4=5なので x=(-1±√5)/2 です。"},{"t":"解の公式","q":"二次方程式 2x²-5x+1=0 を解くと？","c":["x=(5±√17)/4","x=(5±√17)/2","x=(-5±√17)/4","x=(5±√33)/4"],"a":0,"e":"a=2, b=-5, c=1。b²-4ac=25-8=17。分母は2a=4なので x=(5±√17)/4 です。"},{"t":"解の公式","q":"二次方程式 x²-6x+2=0 の解を、できるだけ簡単にすると？","c":["x=3±√7","x=3±√28","x=6±√7","x=3±2√7"],"a":0,"e":"b²-4ac=36-8=28。x=(6±√28)/2=(6±2√7)/2=3±√7です。約分を忘れないようにします。"},{"t":"重解","q":"二次方程式 x²-4x+4=0 の解は？","c":["x=2 のみ","x=2, -2","x=4","x=-2 のみ"],"a":0,"e":"(x-2)²=0と因数分解できるので、解はx=2の1つだけ（重解）です。"},{"t":"係数を求める","q":"二次方程式 x²+ax+6=0 の1つの解が2であるとき、aの値は？","c":["-5","5","-4","-2"],"a":0,"e":"x=2を代入して4+2a+6=0。2a=-10よりa=-5です。"},{"t":"もう1つの解","q":"二次方程式 x²-3x+k=0 の1つの解が1であるとき、もう1つの解は？","c":["2","-2","3","1"],"a":0,"e":"x=1を代入して1-3+k=0よりk=2。x²-3x+2=(x-1)(x-2)=0なのでもう1つの解は2です。"},{"t":"文章題","q":"連続する2つの正の整数の積が56である。小さいほうの整数は？","c":["7","8","6","-8"],"a":0,"e":"小さいほうをnとするとn(n+1)=56。n²+n-56=0、(n+8)(n-7)=0でn=7（正の整数）です。"},{"t":"文章題","q":"連続する2つの正の整数があり、それぞれを2乗した数の和が85である。この2つの整数は？","c":["6と7","5と6","7と8","4と5"],"a":0,"e":"n²+(n+1)²=85より2n²+2n-84=0、n²+n-42=0、(n+7)(n-6)=0でn=6。6と7です。"},{"t":"文章題","q":"ある正の数を2乗した数は、もとの数の3倍より10大きい。この数は？","c":["5","-2","10","2"],"a":0,"e":"x²=3x+10よりx²-3x-10=0、(x-5)(x+2)=0。正の数なのでx=5です。"},{"t":"文章題","q":"縦がx cm、横が(x+3) cmの長方形の面積が40cm²である。xの値は？","fig":"<svg viewBox='0 0 200 132'><rect x='45' y='25' width='120' height='80' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='14' y='69' font-size='11' fill='#333'>x cm</text><text x='70' y='122' font-size='11' fill='#333'>(x+3) cm</text><text x='76' y='70' font-size='11' fill='#333'>40cm²</text></svg>","c":["5","8","-8","4"],"a":0,"e":"x(x+3)=40よりx²+3x-40=0、(x+8)(x-5)=0。長さは正なのでx=5です。"},{"t":"文章題","q":"正方形の1辺を3cm長くすると、面積がもとの4倍になった。もとの1辺の長さは？","c":["3cm","6cm","1cm","9cm"],"a":0,"e":"(x+3)²=4x²より、x>0なのでx+3=2x。よってx=3cmです。"},{"t":"文章題","q":"和が9、積が20である2つの数は？","c":["4と5","3と6","2と7","1と8"],"a":0,"e":"2数をx, 9-xとするとx(9-x)=20。x²-9x+20=0、(x-4)(x-5)=0で4と5です。"}],"9":[{"t":"関数y=ax²","q":"y=2x² において、x=3 のときのyの値は？","c":["18","12","36","6"],"a":0,"e":"y=2×3²=2×9=18です。2×3を先に計算しないよう、累乗を先に計算します。"},{"t":"関数y=ax²","q":"y=-x² において、x=4 のときのyの値は？","c":["-16","16","-8","-4"],"a":0,"e":"y=-(4²)=-16です。マイナスは2乗のあとにつけます。"},{"t":"関数y=ax²","q":"y=3x² において、x=-2 のときのyの値は？","c":["12","-12","36","-6"],"a":0,"e":"y=3×(-2)²=3×4=12です。負の数を2乗すると正になります。"},{"t":"比例定数","q":"yはxの2乗に比例し、x=2のときy=12である。比例定数aの値は？","c":["3","6","24","48"],"a":0,"e":"y=ax²に代入して12=a×4。よってa=3です。"},{"t":"関数y=ax²","q":"yはxの2乗に比例し、x=2のときy=8である。x=5のときのyの値は？","c":["50","20","40","25"],"a":0,"e":"8=a×4よりa=2、式はy=2x²。y=2×25=50です。"},{"t":"変化の割合","q":"関数 y=x² について、xが1から3まで増加するときの変化の割合は？","c":["4","2","8","1"],"a":0,"e":"xが1のときy=1、xが3のときy=9。変化の割合は(9-1)÷(3-1)=4です。"},{"t":"変化の割合","q":"関数 y=2x² について、xが1から4まで増加するときの変化の割合は？","c":["10","5","30","2"],"a":0,"e":"y=2と32なので、(32-2)÷(4-1)=30÷3=10です。"},{"t":"変化の割合","q":"関数 y=-x² について、xが2から5まで増加するときの変化の割合は？","c":["-7","7","-21","-3"],"a":0,"e":"y=-4と-25なので、(-25-(-4))÷(5-2)=-21÷3=-7です。"},{"t":"グラフ","q":"関数 y=x² のグラフについて正しいものは？","c":["原点を通り、上に開いた放物線","原点を通る直線","原点を通り、下に開いた放物線","原点を通らない曲線"],"a":0,"e":"y=ax²のグラフは原点を頂点とする放物線で、a>0のときは上に開きます。"},{"t":"グラフ","q":"関数 y=ax² で a<0 のとき、そのグラフはどうなりますか？","c":["下に開いた放物線になる","上に開いた放物線になる","右上がりの直線になる","原点を通らなくなる"],"a":0,"e":"aが負のときはxがどんな値でもyは0以下になるので、下に開いた放物線になります。"},{"t":"変域","q":"関数 y=x² について、xの変域が -2≤x≤3 のときのyの変域は？","c":["0≤y≤9","4≤y≤9","-4≤y≤9","0≤y≤4"],"a":0,"e":"変域に0をふくむのでyの最小値は0。最大はx=3のときの9なので0≤y≤9です。"},{"t":"変域","q":"関数 y=2x² について、xの変域が 1≤x≤3 のときのyの変域は？","c":["2≤y≤18","0≤y≤18","2≤y≤6","1≤y≤9"],"a":0,"e":"変域に0をふくまないので、x=1のときy=2が最小、x=3のときy=18が最大です。"},{"t":"相似条件","q":"△ABCと△DEFで、AB:DE=BC:EF=CA:FDがわかっている。このとき使う相似条件は？","c":["3組の辺の比がすべて等しい","2組の角がそれぞれ等しい","2組の辺の比とその間の角がそれぞれ等しい","3組の辺がそれぞれ等しい"],"a":0,"e":"対応する3組の辺の比がすべて等しいので、この相似条件を使います。"},{"t":"相似条件","q":"△ABCと△DEFで、∠A=∠D, ∠B=∠Eがわかっている。このとき使う相似条件は？","c":["2組の角がそれぞ l='#333'>y=x+2</text><text x='74' y='149' font-size='11' fill='#333'>O</text><text x='204' y='139' font-size='11' fill='#333'>x</text><text x='89' y='44' font-size='11' fill='#333'>y</text></svg>","c":["2 と -1","2 と 1","-2 と 1","4 と 1"],"a":0,"e":"x²=x+2よりx²-x-2=0、(x-2)(x+1)=0。よってx=2, -1です。"},{"t":"融合問題","q":"連立方程式 2x+y=7, x-y=2 の解は？","c":["x=3, y=1","x=1, y=3","x=3, y=-1","x=2, y=3"],"a":0,"e":"2式をたすと3x=9でx=3。x-y=2に代入してy=1です。"},{"t":"融合問題","q":"二次方程式 x²-6x+4=0 の解を、できるだけ簡単にすると？","c":["x=3±√5","x=3±√20","x=6±√5","x=3±2√5"],"a":0,"e":"b²-4ac=36-16=20。x=(6±2√5)/2=3±√5です。"},{"t":"融合問題","q":"1から9までの数字が書かれた9枚のカードから2枚を同時に引くとき、2数の和が偶数になる確率は？","c":["4/9","1/2","5/9","1/3"],"a":0,"e":"引き方は36通り。和が偶数なのは奇数2枚が10通り、偶数2枚が6通りで計16通り。16/36=4/9です。"},{"t":"データの活用","q":"5個のデータ 3, 7, 7, 9, 14 の平均値は？","c":["8","7","9","7.5"],"a":0,"e":"合計は3+7+7+9+14=40。40÷5=8です。中央値と最頻値はどちらも7なので混同しないようにします。"},{"t":"式の値","q":"x=√3+1, y=√3-1 のとき、x²+y² の値は？","c":["8","12","4","2√3"],"a":0,"e":"x+y=2√3、xy=3-1=2。x²+y²=(x+y)²-2xy=12-4=8です。"},{"t":"因数分解の利用","q":"99²-98² を工夫して計算すると？","c":["197","1","9702","198"],"a":0,"e":"a²-b²=(a+b)(a-b)より(99+98)(99-98)=197×1=197です。"},{"t":"平方根の応用","q":"√(60n) が整数となるような、最も小さい自然数nの値は？","c":["15","6","60","5"],"a":0,"e":"60=2²×3×5。√の中を2乗の形にするには3×5=15をかければよいので、n=15です（60×15=900=30²）。"},{"t":"文字式の証明","q":"連続する3つの整数の和は、必ず何の倍数になりますか？","c":["3の倍数","2の倍数","5の倍数","6の倍数"],"a":0,"e":"まん中をnとすると(n-1)+n+(n+1)=3n。よって必ず3の倍数になります。"},{"t":"おうぎ形","q":"半径6cm、中心角120°のおうぎ形の弧の長さは？","fig":"<svg viewBox='0 0 220 158'><path d='M 105 130 L 165.6 95 A 70 70 0 0 0 44.4 95 Z' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='98' y='145' font-size='11' fill='#333'>O</text><text x='142' y='122' font-size='11' fill='#333'>6cm</text><text x='84' y='114' font-size='11' fill='#333'>120°</text><text x='98' y='52' font-size='11' fill='#333'>?</text></svg>","c":["4πcm","12πcm","6πcm","2πcm"],"a":0,"e":"円周は2π×6=12πcm。中心角の割合は120/360=1/3なので、12π×1/3=4πcmです。"}]}},"eigo":{"levels":[{"n":1,"grade":"中1","title":"be動詞と単語の
