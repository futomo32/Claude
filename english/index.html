の先端である柱頭につくことを受粉といい、その後、胚珠が種子へと成長します。"},{"t":"花のつくり","q":"アブラナの花を外側から中心に向かって順に並べたものはどれですか。","c":["がく・花弁・おしべ・めしべ","花弁・がく・めしべ・おしべ","おしべ・めしべ・花弁・がく","めしべ・おしべ・がく・花弁"],"a":0,"e":"花は外側からがく、花弁、おしべ、めしべの順に並んでおり、中心にめしべが1本あります。"},{"t":"種子植物","q":"被子植物の特徴として正しいものはどれですか。","c":["胚珠が子房の中に包まれている","胚珠がむき出しになっている","子房がなく果実ができない","種子をつくらず胞子でふえる"],"a":0,"e":"被子植物は胚珠が子房に包まれているため果実ができます。裸子植物は子房がなく胚珠がむき出しです。"},{"t":"裸子植物","q":"次のうち、裸子植物はどれですか。","c":["マツ","アブラナ","サクラ","タンポポ"],"a":0,"e":"マツ・スギ・イチョウ・ソテツは裸子植物です。アブラナ・サクラ・タンポポは子房をもつ被子植物です。"},{"t":"マツの花","q":"マツの雌花のりん片についているものは何ですか。","c":["胚珠","子房","花粉のう","果実"],"a":0,"e":"マツは裸子植物なので子房がなく、雌花のりん片に胚珠がむき出しでついています。雄花のりん片には花粉のうがあります。"},{"t":"光合成","q":"図は葉で行われる光合成を表しています。葉に取り入れられるAとBの組み合わせとして正しいものはどれですか。","fig":"<svg viewBox='0 0 300 160'><path d='M62,72 C92,32 172,32 202,72 C172,112 92,112 62,72' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='62' y1='72' x2='202' y2='72' stroke='#4a6cf7' stroke-width='2'/><line x1='132' y1='108' x2='132' y2='150' stroke='#4a6cf7' stroke-width='2'/><line x1='30' y1='46' x2='92' y2='66' stroke='#4a6cf7' stroke-width='2'/><polygon points='100,68 88,63 89,72' fill='#4a6cf7'/><text x='14' y='40' font-size='11' fill='#333'>A</text><line x1='140' y1='146' x2='140' y2='106' stroke='#4a6cf7' stroke-width='2'/><polygon points='140,98 135,110 145,110' fill='#4a6cf7'/><text x='148' y='142' font-size='11' fill='#333'>B</text><line x1='176' y1='60' x2='240' y2='36' stroke='#4a6cf7' stroke-width='2'/><polygon points='248,32 236,32 240,42' fill='#4a6cf7'/><text x='254' y='28' font-size='11' fill='#333'>C</text></svg>","c":["A=二酸化炭素 B=水","A=酸素 B=水","A=水 B=二酸化炭素","A=二酸化炭素 B=デンプン"],"a":0,"e":"光合成は、空気中から取り入れた二酸化炭素と根から吸い上げた水を材料にして行われます。Cとして出ていく気体は酸素です。"},{"t":"光合成","q":"光合成が行われるのは、細胞の中のどの部分ですか。","c":["葉緑体","核","液胞","細胞壁"],"a":0,"e":"光合成は緑色の粒である葉緑体で行われます。核は遺伝に関わる部分で、光合成は行いません。"},{"t":"光合成","q":"光合成でデンプンができたことを調べるため、葉にヨウ素液をつけました。デンプンがある部分は何色になりますか。","c":["青紫色","赤色","白色","黄緑色"],"a":0,"e":"ヨウ素液はデンプンがあると青紫色に変わります。この反応をヨウ素デンプン反応といいます。"},{"t":"光合成","q":"光合成のときに植物から放出される気体は何ですか。","c":["酸素","二酸化炭素","窒素","水素"],"a":0,"e":"光合成では二酸化炭素と水を材料に養分がつくられ、同時に酸素が放出されます。"},{"t":"呼吸","q":"植物の呼吸について正しく説明しているものはどれですか。","c":["昼も夜も一日中行っている","夜だけ行っている","まったく行わない","二酸化炭素を取り入れ酸素を出す"],"a":0,"e":"植物も動物と同じく一日中呼吸をして酸素を取り入れ二酸化炭素を出しています。昼は光合成のほうがさかんなので、全体では二酸化炭素を吸収しているように見えます。"},{"t":"気孔","q":"図は葉の断面です。Xで示した、2つの孔辺細胞にはさまれたすきまを何といいますか。","fig":"<svg viewBox='0 0 300 160'><rect x='30' y='28' width='240' height='18' fill='none' stroke='#4a6cf7' stroke-width='2'/><ellipse cx='60' cy='62' rx='13' ry='10' fill='none' stroke='#4a6cf7' stroke-width='2'/><ellipse cx='90' cy='62' rx='13' ry='10' fill='none' stroke='#4a6cf7' stroke-width='2'/><ellipse cx='120' cy='62' rx='13' ry='10' fill='none' stroke='#4a6cf7' stroke-width='2'/><ellipse cx='150' cy='62' rx='13' ry='10' fill='none' stroke='#4a6cf7' stroke-width='2'/><ellipse cx='180' cy='62' rx='13' ry='10' fill='none' stroke='#4a6cf7' stroke-width='2'/><ellipse cx='210' cy='62' rx='13' ry='10' fill='none' stroke='#4a6cf7' stroke-width='2'/><ellipse cx='240' cy='62' rx='13' ry='10' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='70' cy='84' r='9' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='110' cy='84' r='9' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='150' cy='84' r='9' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='190' cy='84' r='9' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='230' cy='84' r='9' fill='none' stroke='#4a6cf7' stroke-width='2'/><rect x='30' y='96' width='123' height='18' fill='none' stroke='#4a6cf7' stroke-width='2'/><rect x='187' y='96' width='83' height='18' fill='none' stroke='#4a6cf7' stroke-width='2'/><ellipse cx='160' cy='105' rx='7' ry='9' fill='none' stroke='#4a6cf7' stroke-width='2'/><ellipse cx='180' cy='105' rx='7' ry='9' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='170' y1='120' x2='214' y2='142' stroke='#94a3b8' stroke-width='1'/><text x='218' y='147' font-size='11' fill='#333'>X</text><text x='36' y='22' font-size='11' fill='#333'>葉の表側</text></svg>","c":["気孔","道管","師管","葉緑体"],"a":0,"e":"孔辺細胞にはさまれたすきまを気孔といい、酸素や二酸化炭素の出入り口、また水蒸気の出口になります。"},{"t":"蒸散","q":"根から吸い上げられた水が、水蒸気となって気孔から出ていくはたらきを何といいますか。","c":["蒸散","光合成","呼吸","蒸留"],"a":0,"e":"蒸散は主に葉の気孔から水蒸気が出ていく現象で、これによって根からの水の吸い上げがさかんになります。"},{"t":"道管","q":"根から吸い上げた水や、水にとけた肥料分が通る管を何といいますか。","c":["道管","師管","気孔","根毛"],"a":0,"e":"道管は根から吸収した水や肥料分の通り道で、茎の維管束では内側（中心側）にあります。"},{"t":"師管","q":"葉でつくられた養分が運ばれていく管を何といいますか。","c":["師管","道管","気孔","葉脈"],"a":0,"e":"光合成でつくられた養分は水にとけやすい物質に変えられ、師管を通ってからだ全体に運ばれます。"},{"t":"茎のつくり","q":"図のAとBは茎の横断面です。維管束が輪のように並んでいるAは、どのような植物の茎ですか。","fig":"<svg viewBox='0 0 300 145'><circle cx='75' cy='65' r='48' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='111' cy='65' r='6' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='100' cy='90' r='6' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='75' cy='101' r='6' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='50' cy='90' r='6' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='39' cy='65' r='6' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='50' cy='40' r='6' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='75' cy='29' r='6' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='100' cy='40' r='6' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='225' cy='65' r='48' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='210' cy='38' r='6' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='243' cy='45' r='6' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='200' cy='60' r='6' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='232' cy='70' r='6' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='213' cy='85' r='6' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='246' cy='80' r='6' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='226' cy='52' r='6' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='218' cy='98' r='6' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='70' y='133' font-size='11' fill='#333'>A</text><text x='220' y='133' font-size='11' fill='#333'>B</text></svg>","c":["ホウセンカなどの双子葉類の茎","トウモロコシなどの単子葉類の茎","スギゴケなどのコケ植物の茎","イヌワラビなどのシダ植物の茎"],"a":0,"e":"双子葉類の茎は維管束が輪のように並び、単子葉類の茎は維管束が全体に散らばっています。"},{"t":"根のつくり","q":"図のBのように、太さがほぼ同じ細い根がたくさん広がっているつくりを何といいますか。","fig":"<svg viewBox='0 0 300 145'><line x1='75' y1='12' x2='75' y2='26' stroke='#4a6cf7' stroke-width='2'/><line x1='75' y1='26' x2='75' y2='112' stroke='#4a6cf7' stroke-width='3'/><line x1='75' y1='45' x2='45' y2='62' stroke='#4a6cf7' stroke-width='2'/><line x1='75' y1='45' x2='105' y2='62' stroke='#4a6cf7' stroke-width='2'/><line x1='75' y1='65' x2='48' y2='84' stroke='#4a6cf7' stroke-width='2'/><line x1='75' y1='65' x2='102' y2='84' stroke='#4a6cf7' stroke-width='2'/><line x1='75' y1='85' x2='55' y2='100' stroke='#4a6cf7' stroke-width='2'/><line x1='75' y1='85' x2='95' y2='100' stroke='#4a6cf7' stroke-width='2'/><line x1='225' y1='12' x2='225' y2='26' stroke='#4a6cf7' stroke-width='2'/><line x1='225' y1='26' x2='185' y2='105' stroke='#4a6cf7' stroke-width='2'/><line x1='225' y1='26' x2='202' y2='110' stroke='#4a6cf7' stroke-width='2'/><line x1='225' y1='26' x2='216' y2='112' stroke='#4a6cf7' stroke-width='2'/><line x1='225' y1='26' x2='234' y2='112' stroke='#4a6cf7' stroke-width='2'/><line x1='225' y1='26' x2='248' y2='110' stroke='#4a6cf7' stroke-width='2'/><line x1='225' y1='26' x2='265' y2='105' stroke='#4a6cf7' stroke-width='2'/><text x='70' y='133' font-size='11' fill='#333'>A</text><text x='220' y='133' font-size='11' fill='#333'>B</text></svg>","c":["ひげ根","主根","側根","根毛"],"a":0,"e":"単子葉類の根はひげ根で、双子葉類の根は太い主根とそこから枝分かれした側根（図のA）からなります。"},{"t":"葉脈","q":"トウモロコシやツユクサの葉に見られる、平行に通っている葉脈を何といいますか。","c":["平行脈","網状脈","維管束","主根"],"a":0,"e":"単子葉類の葉脈は平行に並ぶ平行脈で、双子葉類の葉脈は網目状に広がる網状脈です。"},{"t":"コケ植物","q":"スギゴケなどのコケ植物にあてはまる説明はどれですか。","c":["維管束がなく、からだの表面全体で水を吸収する","維管束があり、道管と師管が通っている","種子をつくってなかまをふやす","根・茎・葉の区別がはっきりしている"],"a":0,"e":"コケ植物には維管束がなく、水はからだの表面全体から吸収します。根のように見える仮根は、からだを地面などに固定するはたらきをします。"},{"t":"胞子","q":"イヌワラビやスギゴケは、何をつくってなかまをふやしますか。","c":["胞子","種子","果実","花粉"],"a":0,"e":"シダ植物とコケ植物は花が咲かず種子をつくらないので、胞子をつくってなかまをふやします。"},{"t":"植物の分類","q":"タンポポやアサガオのように、花弁が互いにくっついている双子葉類のなかまを何といいますか。","c":["合弁花類","離弁花類","単子葉類","裸子植物"],"a":0,"e":"花弁がくっついているなかまを合弁花類、サクラやアブラナのように花弁が1枚ずつ離れているなかまを離弁花類といいます。"},{"t":"動物の分類","q":"背骨をもつセキツイ動物は5つのなかまに分けられます。次のうち、その5つにふくまれないものはどれですか。","c":["昆虫類","魚類","両生類","鳥類"],"a":0,"e":"セキツイ動物は魚類・両生類・ハチュウ類・鳥類・ホニュウ類の5つです。昆虫類は背骨をもたない無セキツイ動物です。"},{"t":"胎生","q":"母親の体内である程度育ってから子が生まれる、ホニュウ類に見られる生まれ方を何といいますか。","c":["胎生","卵生","変態","脱皮"],"a":0,"e":"胎生は子が母親の体内で育ってから生まれる方式で、セキツイ動物ではホニュウ類だけに見られます。ほかのなかまは卵を産む卵生です。"},{"t":"両生類","q":"カエルなどの両生類の呼吸のしかたとして正しいものはどれですか。","c":["子はえらと皮ふ、親は肺と皮ふで呼吸する","一生えらだけで呼吸する","一生肺だけで呼吸する","子は肺、親はえらで呼吸する"],"a":0,"e":"両生類は水中で育つ子（オタマジャクシ）はえらと皮ふで呼吸し、陸に上がった親は肺と皮ふで呼吸します。"},{"t":"恒温動物","q":"まわりの温度が変わっても体温をほぼ一定に保つ恒温動物は、どのなかまですか。","c":["鳥類とホニュウ類","魚類と両生類","両生類とハチュウ類","魚類とハチュウ類"],"a":0,"e":"鳥類とホニュウ類は恒温動物です。魚類・両生類・ハチュウ類は、まわりの温度に応じて体温が変わる変温動物です。"},{"t":"ハチュウ類","q":"トカゲやヘビなどのハチュウ類の体表は、おもに何でおおわれていますか。","c":["かたいうろこ","羽毛","毛","しめった皮ふ"],"a":0,"e":"ハチュウ類の体表はかたいうろこでおおわれ、乾燥に強いつくりになっています。しめった皮ふは両生類の特徴です。"},{"t":"節足動物","q":"バッタやエビのからだをおおっている、かたい殻のようなつくりを何といいますか。","c":["外骨格","内骨格","外とう膜","背骨"],"a":0,"e":"節足動物のからだは外骨格でおおわれ、からだを支え内部を守っています。大きくなるには脱皮が必要です。"},{"t":"軟体動物","q":"アサリやイカのからだで、内臓を包んでいる膜を何といいますか。","c":["外とう膜","外骨格","えら","節"],"a":0,"e":"アサリやイカなどの軟体動物には内臓を包む外とう膜があり、からだやあしに節がないのが特徴です。"}],"2":[{"t":"有機物","q":"砂糖やエタノールのように、炭素をふくみ、燃やすと二酸化炭素が発生する物質を何といいますか。","c":["有機物","無機物","純物質","混合物"],"a":0,"e":"炭素をふくみ、燃やすと二酸化炭素を発生する物質を有機物といいます。多くの有機物は水素もふくむため、燃えると水もできます。"},{"t":"無機物","q":"次のうち、無機物はどれですか。","c":["食塩","砂糖","エタノール","ロウ"],"a":0,"e":"食塩（塩化ナトリウム）は炭素をふくまない無機物です。砂糖・エタノール・ロウはいずれも有機物です。"},{"t":"気体の判別","q":"ある物質を燃やして出た気体を石灰水に通すと、石灰水が白くにごりました。この気体は何ですか。","c":["二酸化炭素","酸素","水素","窒素"],"a":0,"e":"石灰水を白くにごらせる気体は二酸化炭素です。これは燃やした物質に炭素がふくまれていたことを示します。"},{"t":"金属の性質","q":"すべての金属に共通する性質として、あてはまらないものはどれですか。","c":["磁石に引きつけられる","電気をよく通す","みがくと光沢が出る","たたくとうすく広がる"],"a":0,"e":"磁石につくのは鉄やニッケルなど一部の金属だけで、銅やアルミニウムはつきません。電気・熱をよく通すことや金属光沢、展性は金属共通の性質です。"},{"t":"金属の性質","q":"金属をみがいたときに現れる、特有のかがやきを何といいますか。","c":["金属光沢","展性","延性","密度"],"a":0,"e":"金属特有のかがやきを金属光沢といいます。たたくとうすく広がる性質は展性、引っぱると細くのびる性質は延性です。"},{"t":"密度","q":"物質の密度を求める式として正しいものはどれですか。","c":["密度＝質量÷体積","密度＝体積÷質量","密度＝質量×体積","密度＝質量＋体積"],"a":0,"e":"密度は1cm³あたりの質量なので、質量を体積で割って求めます。単位はg/cm³です。"},{"t":"密度","q":"体積20cm³、質量54gの金属があります。この金属の密度は何g/cm³ですか。","c":["2.7 g/cm³","0.37 g/cm³","74 g/cm³","34 g/cm³"],"a":0,"e":"54÷20＝2.7なので、密度は2.7 g/cm³です。この値からこの金属はアルミニウムと考えられます。"},{"t":"密度","q":"水（密度1.0 g/cm³）に入れたとき、水に浮く物質はどれですか。","c":["密度0.9 g/cm³のポリエチレン","密度2.7 g/cm³のアルミニウム","密度7.9 g/cm³の鉄","密度8.9 g/cm³の銅"],"a":0,"e":"液体より密度が小さい物質は浮き、大きい物質は沈みます。水より密度が小さいのは0.9 g/cm³のポリエチレンだけです。"},{"t":"密度","q":"密度が8.9 g/cm³の銅でできた、体積5cm³の物体の質量は何gですか。","c":["44.5 g","1.78 g","13.9 g","3.9 g"],"a":0,"e":"質量＝密度×体積なので、8.9×5＝44.5gとなります。"},{"t":"気体の発生","q":"酸素を発生させるとき、二酸化マンガンに加える液体はどれですか。","c":["うすい過酸化水素水（オキシドール）","うすい塩酸","石灰水","うすい水酸化ナトリウム水溶液"],"a":0,"e":"二酸化マンガンにうすい過酸化水素水を加えると酸素が発生します。二酸化マンガン自身は変化せず、反応を助けるはたらきをします。"},{"t":"気体の発生","q":"二酸化炭素を発生させるには、石灰石に何を加えればよいですか。","c":["うすい塩酸","うすい過酸化水素水","石灰水","食塩水"],"a":0,"e":"石灰石（炭酸カルシウム）にうすい塩酸を加えると二酸化炭素が発生します。"},{"t":"気体の発生","q":"亜鉛や鉄にうすい塩酸を加えると発生する気体は何ですか。","c":["水素","酸素","二酸化炭素","アンモニア"],"a":0,"e":"金属にうすい塩酸を加えると水素が発生します。マッチの火を近づけるとポンと音を立てて燃えます。"},{"t":"気体の発生","q":"アンモニアを発生させる方法として正しいものはどれですか。","c":["塩化アンモニウムと水酸化カルシウムの混合物を加熱する","石灰石にうすい塩酸を加える","亜鉛にうすい塩酸を加える","二酸化マンガンにうすい過酸化水素水を加える"],"a":0,"e":"塩化アンモニウムと水酸化カルシウムを混ぜて加熱するとアンモニアが発生します。ほかの3つは順に二酸化炭素・水素・酸素が発生する方法です。"},{"t":"気体の集め方","q":"図のように、水を満たした試験管に気体を集める方法を何といいますか。","fig":"<svg viewBox='0 0 300 172'><rect x='30' y='78' width='245' height='78' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='30' y1='92' x2='275' y2='92' stroke='#94a3b8' stroke-width='1'/><path d='M168,128 L168,48 L174,40 L192,40 L198,48 L198,128' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='168' y1='102' x2='198' y2='102' stroke='#94a3b8' stroke-width='1'/><line x1='62' y1='28' x2='62' y2='138' stroke='#4a6cf7' stroke-width='2'/><line x1='62' y1='138' x2='183' y2='138' stroke='#4a6cf7' stroke-width='2'/><circle cx='183' cy='126' r='3' fill='none' stroke='#4a6cf7' stroke-width='1'/><circle cx='185' cy='116' r='3' fill='none' stroke='#4a6cf7' stroke-width='1'/><circle cx='182' cy='108' r='3' fill='none' stroke='#4a6cf7' stroke-width='1'/><text x='26' y='22' font-size='11' fill='#333'>気体</text><text x='206' y='58' font-size='11' fill='#333'>試験管</text><text x='240' y='150' font-size='11' fill='#333'>水</text></svg>","c":["水上置換法","上方置換法","下方置換法","再結晶"],"a":0,"e":"水にとけにくい気体は水上置換法で集めます。空気が混ざらず、集まった量が目で見て分かるという利点があります。"},{"t":"気体の集め方","q":"図のAは、水にとけやすく空気より密度が小さい気体を集める方法です。この方法を何といいますか。","fig":"<svg viewBox='0 0 300 175'><path d='M62,145 L62,58 L68,50 L92,50 L98,58 L98,145' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='80' y1='172' x2='80' y2='70' stroke='#4a6cf7' stroke-width='2'/><text x='28' y='30' font-size='11' fill='#333'>A</text><text x='104' y='166' font-size='11' fill='#333'>気体</text><path d='M202,42 L202,120 L208,128 L232,128 L238,120 L238,42' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='220' y1='16' x2='220' y2='116' stroke='#4a6cf7' stroke-width='2'/><text x='170' y='30' font-size='11' fill='#333'>B</text><text x='244' y='22' font-size='11' fill='#333'>気体</text></svg>","c":["上方置換法","下方置換法","水上置換法","ろ過"],"a":0,"e":"空気より軽い気体は容器の上部にたまるので、容器の口を下に向けて集める上方置換法を使います。アンモニアがその代表例です。"},{"t":"気体の集め方","q":"図のBのように、水にとけやすく空気より密度が大きい気体を集める方法を何といいますか。","fig":"<svg viewBox='0 0 300 175'><path d='M62,145 L62,58 L68,50 L92,50 L98,58 L98,145' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='80' y1='172' x2='80' y2='70' stroke='#4a6cf7' stroke-width='2'/><text x='28' y='30' font-size='11' fill='#333'>A</text><text x='104' y='166' font-size='11' fill='#333'>気体</text><path d='M202,42 L202,120 L208,128 L232,128 L238,120 L238,42' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='220' y1='16' x2='220' y2='116' stroke='#4a6cf7' stroke-width='2'/><text x='170' y='30' font-size='11' fill='#333'>B</text><text x='244' y='22' font-size='11' fill='#333'>気体</text></svg>","c":["下方置換法","上方置換法","水上置換法","蒸留"],"a":0,"e":"空気より重い気体は容器の下のほうにたまるので、管を底まで差しこむ下方置換法で集めます。二酸化炭素や塩化水素がその例です。"},{"t":"酸素","q":"酸素の性質として正しいものはどれですか。","c":["火のついた線香を入れると、炎を上げて激しく燃える","それ自身がよく燃えて水ができる","石灰水を白くにごらせる","刺激臭があり、水溶液はアルカリ性を示す"],"a":0,"e":"酸素にはものを燃やすはたらきがあるため、線香が炎を上げて燃えます。酸素自身は燃えません。"},{"t":"水素","q":"水素の性質として正しいものはどれですか。","c":["空気中で燃えると水ができる","石灰水を白くにごらせる","水にとけやすく刺激臭がある","気体の中で最も密度が大きい"],"a":0,"e":"水素はすべての気体の中で最も密度が小さく、空気中で音を立てて燃え、酸素と結びついて水ができます。"},{"t":"アンモニア","q":"アンモニアの性質として正しいものはどれですか。","c":["水に非常によくとけ、水溶液はアルカリ性を示す","水にとけにくく、においがない","空気より密度が大きい","水溶液は酸性を示す"],"a":0,"e":"アンモニアは刺激臭があり水に非常によくとけ、水溶液はアルカリ性です。空気より密度が小さいので上方置換法で集めます。"},{"t":"空気の成分","q":"空気の体積のうち、約78%をしめている気体は何ですか。","c":["窒素","酸素","二酸化炭素","アルゴン"],"a":0,"e":"空気は体積の約78%が窒素、約21%が酸素で、二酸化炭素は約0.04%しかふくまれていません。"},{"t":"水溶液","q":"食塩水で、とけている食塩と、とかしている水をそれぞれ何といいますか。","c":["食塩＝溶質、水＝溶媒","食塩＝溶媒、水＝溶質","食塩＝溶液、水＝溶質","食塩＝溶質、水＝溶液"],"a":0,"e":"とけている物質を溶質、とかしている液体を溶媒、できた液全体を溶液といいます。"},{"t":"濃度","q":"質量パーセント濃度を求める式として正しいものはどれですか。","c":["溶質の質量÷溶液の質量×100","溶質の質量÷溶媒の質量×100","溶媒の質量÷溶液の質量×100","溶液の質量÷溶質の質量×100"],"a":0,"e":"質量パーセント濃度は溶液全体に対する溶質の割合なので、溶質÷（溶質＋溶媒）×100で求めます。"},{"t":"濃度","q":"水80gに食塩20gをとかしました。この食塩水の質量パーセント濃度は何%ですか。","c":["20%","25%","16%","80%"],"a":0,"e":"溶液の質量は80＋20＝100gなので、20÷100×100＝20%です。溶媒の80gで割らないよう注意しましょう。"},{"t":"濃度","q":"質量パーセント濃度15%の食塩水200gには、食塩が何gとけていますか。","c":["30 g","15 g","170 g","3 g"],"a":0,"e":"200×15÷100＝30gの食塩がとけています。残りの170gが水です。"},{"t":"溶解度","q":"一定量の水に物質をとかしていき、それ以上とけきれなくなった水溶液を何といいますか。","c":["飽和水溶液","溶媒","懸濁液","蒸留水"],"a":0,"e":"それ以上物質がとけることのできない水溶液を飽和水溶液といい、水100gにとける物質の最大の質量を溶解度といいます。"},{"t":"再結晶","q":"図は溶解度曲線です。60℃の水100gに硝酸カリウムをとけるだけとかし、20℃まで冷やすと結晶が出てきました。このように温度による溶解度の差を利用して物質をとり出す方法を何といいますか。","fig":"<svg viewBox='0 0 300 185'><line x1='45' y1='150' x2='285' y2='150' stroke='#333' stroke-width='1'/><line x1='45' y1='150' x2='45' y2='25' stroke='#333' stroke-width='1'/><polyline points='45,137 120,118 195,86 270,41' fill='none' stroke='#4a6cf7' stroke-width='2'/><polyline points='45,114 120,114 195,114 270,113' fill='none' stroke='#94a3b8' stroke-width='2'/><text x='6' y='154' font-size='11' fill='#333'>0</text><text x='6' y='94' font-size='11' fill='#333'>60</text><text x='4' y='34' font-size='11' fill='#333'>120</text><text x='42' y='164' font-size='11' fill='#333'>0</text><text x='112' y='164' font-size='11' fill='#333'>20</text><text x='187' y='164' font-size='11' fill='#333'>40</text><text x='262' y='164' font-size='11' fill='#333'>60</text><text x='110' y='180' font-size='11' fill='#333'>温度(℃)</text><text x='34' y='18' font-size='11' fill='#333'>溶解度(g)</text><text x='120' y='55' font-size='11' fill='#333'>硝酸カリウム</text><text x='60' y='106' font-size='11' fill='#333'>塩化ナトリウム</text></svg>","c":["再結晶","蒸留","ろ過","昇華"],"a":0,"e":"温度による溶解度の差を利用して、とかした物質を結晶としてとり出す方法を再結晶といいます。塩化ナトリウムは温度が変わっても溶解度がほとんど変わらないため、この方法では結晶が出にくいです。"},{"t":"ろ過","q":"図はろ過の操作を表しています。ろ過のしかたとして正しいものはどれですか。","fig":"<svg viewBox='0 0 300 178'><path d='M84,42 L134,104 L184,42' fill='none' stroke='#4a6cf7' stroke-width='2'/><path d='M94,50 L134,98 L174,50' fill='none' stroke='#94a3b8' stroke-width='1'/><line x1='134' y1='104' x2='134' y2='150' stroke='#4a6cf7' stroke-width='2'/><path d='M132,138 L132,170 L206,170 L206,138' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='132' y1='158' x2='206' y2='158' stroke='#94a3b8' stroke-width='1'/><line x1='58' y1='16' x2='112' y2='72' stroke='#4a6cf7' stroke-width='2'/><text x='8' y='24' font-size='11' fill='#333'>ガラス棒</text><text x='190' y='56' font-size='11' fill='#333'>ろうと</text><text x='212' y='166' font-size='11' fill='#333'>ビーカー</text></svg>","c":["ろうとの先のとがったほうをビーカーの内壁につける","液はガラス棒を使わず勢いよく注ぐ","ろうとの先はビーカーの壁から必ず離しておく","ろ紙は水でぬらさずにろうとにのせる"],"a":0,"e":"ろ過では液をガラス棒に伝わらせて静かに注ぎ、ろうとの先のとがったほうをビーカーの内壁につけて液がはねるのを防ぎます。"},{"t":"状態変化","q":"物質が固体・液体・気体と状態変化するとき、変化しないものはどれですか。","c":["質量","体積","粒子の間かく","見かけの姿"],"a":0,"e":"状態変化では粒子の並び方や間かくが変わるので体積は変化しますが、粒子の数そのものは変わらないので質量は変化しません。なお水は例外で、液体から固体になると体積が増えます。"},{"t":"沸点","q":"純粋な物質を加熱して沸騰させている間、温度はどうなりますか。","c":["沸点のまま一定に保たれる","一定の割合で上がり続ける","急に下がる","上がったり下がったりする"],"a":0,"e":"沸騰中に加えた熱は状態変化に使われるため、純粋な物質では温度が沸点のまま変わりません。混合物では温度が変化し続けます。"},{"t":"蒸留","q":"水とエタノールの混合物を図の装置で加熱しました。はじめに多く出てくる物質は何ですか。","fig":"<svg viewBox='0 0 300 178'><circle cx='70' cy='115' r='30' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='58' y1='90' x2='58' y2='46' stroke='#4a6cf7' stroke-width='2'/><line x1='82' y1='90' x2='82' y2='46' stroke='#4a6cf7' stroke-width='2'/><line x1='42' y1='122' x2='98' y2='122' stroke='#94a3b8' stroke-width='1'/><circle cx='60' cy='134' r='3' fill='none' stroke='#94a3b8' stroke-width='1'/><circle cx='78' cy='136' r='3' fill='none' stroke='#94a3b8' stroke-width='1'/><line x1='70' y1='18' x2='70' y2='56' stroke='#4a6cf7' stroke-width='2'/><circle cx='70' cy='60' r='4' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='82' y1='58' x2='195' y2='100' stroke='#4a6cf7' stroke-width='2'/><path d='M180,88 L180,142 L186,150 L204,150 L210,142 L210,88' fill='none' stroke='#4a6cf7' stroke-width='2'/><rect x='166' y='118' width='118' height='46' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='166' y1='130' x2='284' y2='130' stroke='#94a3b8' stroke-width='1'/><polygon points='70,150 63,166 77,166' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='6' y='22' font-size='11' fill='#333'>温度計</text><text x='232' y='148' font-size='11' fill='#333'>冷水</text></svg>","c":["エタノール","水","食塩","二酸化炭素"],"a":0,"e":"エタノールの沸点は約78℃で水の100℃より低いため、先にエタノールを多くふくむ気体が出て、冷やされて液体になります。この方法を蒸留といいます。"}],"3":[{"t":"光の反射","q":"光が鏡ではね返るとき、図のaの角（入射角）とbの角（反射角）にはどのような関係がありますか。","fig":"<svg viewBox='0 0 300 152'><line x1='30' y1='120' x2='270' y2='120' stroke='#4a6cf7' stroke-width='3'/><line x1='150' y1='120' x2='150' y2='28' stroke='#94a3b8' stroke-width='1' stroke-dasharray='4 3'/><line x1='62' y1='42' x2='150' y2='120' stroke='#4a6cf7' stroke-width='2'/><polygon points='150,120 138,115 144,109' fill='#4a6cf7'/><line x1='150' y1='120' x2='240' y2='40' stroke='#4a6cf7' stroke-width='2'/><polygon points='240,40 234,51 228,45' fill='#4a6cf7'/><text x='124' y='106' font-size='11' fill='#333'>a</text><text x='160' y='106' font-size='11' fill='#333'>b</text><text x='34' y='138' font-size='11' fill='#333'>鏡</text><text x='156' y='24' font-size='11' fill='#333'>法線</text></svg>","c":["aとbはつねに等しい","つねにaのほうが大きい","つねにbのほうが大きい","反射のたびに変わる"],"a":0,"e":"入射角と反射角はつねに等しくなります。これを光の反射の法則といいます。"},{"t":"光の屈折","q":"光が水中から空気中へ出るとき、図のaの角（入射角）とbの角（屈折角）の大きさの関係はどうなりますか。","fig":"<svg viewBox='0 0 300 165'><line x1='20' y1='80' x2='280' y2='80' stroke='#4a6cf7' stroke-width='2'/><line x1='150' y1='20' x2='150' y2='152' stroke='#94a3b8' stroke-width='1' stroke-dasharray='4 3'/><line x1='105' y1='148' x2='150' y2='80' stroke='#4a6cf7' stroke-width='2'/><polygon points='150,80 148,93 139,87' fill='#4a6cf7'/><line x1='150' y1='80' x2='207' y2='40' stroke='#4a6cf7' stroke-width='2'/><polygon points='207,40 199,50 195,44' fill='#4a6cf7'/><text x='128' y='112' font-size='11' fill='#333'>a</text><text x='158' y='58' font-size='11' fill='#333'>b</text><text x='28' y='60' font-size='11' fill='#333'>空気</text><text x='28' y='104' font-size='11' fill='#333'>水</text></svg>","c":["bのほうが大きい","aのほうが大きい","aとbは等しい","光は屈折せず直進する"],"a":0,"e":"水やガラスから空気中へ光が出るときは、屈折角のほうが入射角より大きくなります。逆に空気中から水中へ入るときは屈折角のほうが小さくなります。"},{"t":"全反射","q":"水中から空気中へ光を出すとき、入射角を大きくしていくと、境界面で光がすべてはね返るようになります。この現象を何といいますか。","c":["全反射","乱反射","分散","屈折"],"a":0,"e":"入射角がある角度をこえると光は空気中へ出られず、すべて反射します。これを全反射といい、光ファイバーに利用されています。"},{"t":"凸レンズ","q":"焦点距離が10cmの凸レンズの前方20cmの位置に物体を置きました。はっきりした像がうつるのは、レンズの反対側の何cmの位置ですか。","fig":"<svg viewBox='0 0 300 155'><line x1='10' y1='80' x2='290' y2='80' stroke='#94a3b8' stroke-width='1'/><ellipse cx='150' cy='80' rx='10' ry='45' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='110' cy='80' r='2' fill='#333'/><circle cx='190' cy='80' r='2' fill='#333'/><circle cx='70' cy='80' r='2' fill='#333'/><circle cx='230' cy='80' r='2' fill='#333'/><text x='106' y='94' font-size='11' fill='#333'>F</text><text x='186' y='94' font-size='11' fill='#333'>F</text><text x='60' y='94' font-size='11' fill='#333'>2F</text><text x='224' y='94' font-size='11' fill='#333'>2F</text><line x1='70' y1='80' x2='70' y2='45' stroke='#4a6cf7' stroke-width='2'/><polygon points='70,38 65,48 75,48' fill='#4a6cf7'/><line x1='230' y1='80' x2='230' y2='115' stroke='#4a6cf7' stroke-width='2'/><polygon points='230,122 225,112 235,112' fill='#4a6cf7'/><line x1='70' y1='45' x2='150' y2='45' stroke='#4a6cf7' stroke-width='1'/><line x1='150' y1='45' x2='230' y2='115' stroke='#4a6cf7' stroke-width='1'/><line x1='70' y1='45' x2='230' y2='115' stroke='#4a6cf7' stroke-width='1'/><text x='34' y='42' font-size='11' fill='#333'>物体</text><text x='240' y='124' font-size='11' fill='#333'>像</text></svg>","c":["20 cm","10 cm","30 cm","40 cm"],"a":0,"e":"焦点距離の2倍の位置に物体を置くと、レンズの反対側の焦点距離の2倍（20cm）の位置に、物体と同じ大きさの倒立の実像ができます。"},{"t":"凸レンズ","q":"凸レンズと焦点の間に物体を置いてレンズをのぞくと、どのような像が見えますか。","c":["物体より大きい正立の虚像","物体より小さい倒立の実像","物体と同じ大きさの倒立の実像","像はまったく見えない"],"a":0,"e":"物体を焦点の内側に置くと、スクリーンにはうつらない虚像が、物体より大きく同じ向きに見えます。虫めがねの使い方がこれにあたります。"},{"t":"実像","q":"凸レンズによってスクリーンにうつる実像の向きは、物体に対してどうなりますか。","c":["上下も左右も逆向き","上下だけが逆向き","左右だけが逆向き","物体と同じ向き"],"a":0,"e":"実像は物体と上下・左右が反対向き（倒立）になります。虚像は物体と同じ向き（正立）です。"},{"t":"音","q":"音を出している物体（音源）に共通していることは何ですか。","c":["振動している","熱くなっている","光っている","電気を帯びている"],"a":0,"e":"音源は必ず振動しており、その振動が空気などを伝わって耳に届くことで音として聞こえます。"},{"t":"音の伝わり方","q":"容器の中の空気をぬいていくと、中で鳴らしている目ざまし時計の音はどうなりますか。","c":["しだいに聞こえなくなる","しだいに大きくなる","しだいに高くなる","まったく変わらない"],"a":0,"e":"音は空気などの物質が振動することで伝わるため、空気のない真空中では伝わりません。"},{"t":"音の高さ","q":"図のAとBは、同じ時間に記録した音の波形です。BはAと比べてどのような音ですか。","fig":"<svg viewBox='0 0 300 170'><line x1='30' y1='45' x2='270' y2='45' stroke='#94a3b8' stroke-width='1'/><path d='M30,45 Q45,15 60,45 Q75,75 90,45 Q105,15 120,45 Q135,75 150,45 Q165,15 180,45 Q195,75 210,45 Q225,15 240,45 Q255,75 270,45' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='30' y1='125' x2='270' y2='125' stroke='#94a3b8' stroke-width='1'/><path d='M30,125 Q37,95 45,125 Q52,155 60,125 Q67,95 75,125 Q82,155 90,125 Q97,95 105,125 Q112,155 120,125 Q127,95 135,125 Q142,155 150,125 Q157,95 165,125 Q172,155 180,125 Q187,95 195,125 Q202,155 210,125 Q217,95 225,125 Q232,155 240,125 Q247,95 255,125 Q262,155 270,125' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='8' y='49' font-size='11' fill='#333'>A</text><text x='8' y='129' font-size='11' fill='#333'>B</text></svg>","c":["Aより高い音","Aより低い音","Aより大きい音","Aより小さい音"],"a":0,"e":"同じ時間の波の数（振動数）が多いほど音は高くなります。BはAの2倍の振動数なので高い音です。振幅は同じなので音の大きさは変わりません。"},{"t":"音の速さ","q":"音の速さを340 m/sとします。花火が光ってから3秒後に音が聞こえたとき、花火までの距離は約何mですか。","c":["1020 m","113 m","343 m","3400 m"],"a":0,"e":"距離＝速さ×時間なので、340×3＝1020mです。光は非常に速いので、光が見えた瞬間に花火が開いたと考えます。"},{"t":"力のはたらき","q":"力のはたらきとして、あてはまらないものはどれですか。","c":["物体の温度を上げる","物体の形を変える","物体の運動のようすを変える","物体を支える"],"a":0,"e":"力には、物体の形を変える、物体の運動のようす（速さや向き）を変える、物体を支えるという3つのはたらきがあります。"},{"t":"フックの法則","q":"0.5Nの力で2cmのびるばねがあります。このばねに2.0Nの力を加えると、ばねののびは何cmになりますか。","fig":"<svg viewBox='0 0 300 172'><line x1='60' y1='20' x2='210' y2='20' stroke='#4a6cf7' stroke-width='3'/><polyline points='130,20 145,26 115,36 145,46 115,56 145,66 115,76 130,84' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='130' y1='84' x2='130' y2='100' stroke='#4a6cf7' stroke-width='2'/><rect x='112' y='100' width='36' height='28' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='190' y1='24' x2='190' y2='84' stroke='#94a3b8' stroke-width='1'/><text x='196' y='58' font-size='11' fill='#333'>のび</text><line x1='130' y1='132' x2='130' y2='152' stroke='#4a6cf7' stroke-width='2'/><polygon points='130,160 124,148 136,148' fill='#4a6cf7'/><text x='142' y='152' font-size='11' fill='#333'>力</text><text x='36' y='118' font-size='11' fill='#333'>ばね</text></svg>","c":["8 cm","4 cm","6 cm","10 cm"],"a":0,"e":"ばねののびは加えた力の大きさに比例します（フックの法則）。力が0.5Nの4倍の2.0Nなので、のびも2cmの4倍の8cmになります。"},{"t":"重さと質量","q":"月面では重力が地球上の約6分の1になります。地球上で質量600gの物体を月へ持っていくと、質量と重さはどうなりますか。","c":["質量は600gのまま、重さは約6分の1になる","質量も重さも約6分の1になる","質量も重さも変わらない","質量は約6分の1になり、重さは変わらない"],"a":0,"e":"質量は物体そのものの量なので場所が変わっても変化しませんが、重さは物体にはたらく重力の大きさなので月では約6分の1になります。"},{"t":"圧力","q":"底面積0.05m²の物体を床に置きました。この物体にはたらく重力が20Nのとき、床が受ける圧力は何Paですか。","fig":"<svg viewBox='0 0 300 150'><line x1='20' y1='120' x2='280' y2='120' stroke='#4a6cf7' stroke-width='3'/><rect x='100' y='70' width='100' height='50' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='150' y1='20' x2='150' y2='58' stroke='#4a6cf7' stroke-width='2'/><polygon points='150,66 144,54 156,54' fill='#4a6cf7'/><text x='160' y='42' font-size='11' fill='#333'>20N</text><text x='94' y='140' font-size='11' fill='#333'>底面積 0.05m²</text></svg>","c":["400 Pa","1 Pa","100 Pa","0.0025 Pa"],"a":0,"e":"圧力＝力の大きさ÷力がはたらく面積なので、20÷0.05＝400Paとなります。"},{"t":"大気圧","q":"地球をとりまく空気の重さによって生じる圧力を何といいますか。","c":["大気圧","水圧","浮力","弾性力"],"a":0,"e":"空気の重さによる圧力を大気圧といい、海面付近では約1013hPaです。大気圧はあらゆる向きにはたらきます。"},{"t":"火山の形","q":"図のAのように盛り上がったドーム状の火山について、マグマのねばりけと溶岩の色の組み合わせとして正しいものはどれですか。","fig":"<svg viewBox='0 0 300 138'><polyline points='24,110 46,52 70,42 94,52 116,110' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='16' y1='110' x2='124' y2='110' stroke='#94a3b8' stroke-width='1'/><polyline points='160,110 200,88 224,80 248,88 288,110' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='152' y1='110' x2='296' y2='110' stroke='#94a3b8' stroke-width='1'/><text x='64' y='128' font-size='11' fill='#333'>A</text><text x='218' y='128' font-size='11' fill='#333'>B</text></svg>","c":["ねばりけが強く、白っぽい","ねばりけが強く、黒っぽい","ねばりけが弱く、白っぽい","ねばりけが弱く、黒っぽい"],"a":0,"e":"ねばりけの強いマグマは流れにくいため盛り上がったドーム状の火山になり、二酸化ケイ素を多くふくむので白っぽくなります。噴火は激しくなります。"},{"t":"火成岩","q":"マグマが地下深くでゆっくり冷えて固まってできた岩石を何といいますか。","c":["深成岩","火山岩","堆積岩","石灰岩"],"a":0,"e":"地下深くでゆっくり冷え固まった岩石を深成岩、地表や地表付近で急に冷え固まった岩石を火山岩といいます。"},{"t":"斑状組織","q":"図のAは火山岩のつくりです。細かい粒（石基）の中に大きな結晶（斑晶）が散らばっているこのつくりを何といいますか。","fig":"<svg viewBox='0 0 300 140'><circle cx='75' cy='65' r='50' fill='none' stroke='#4a6cf7' stroke-width='2'/><polygon points='55,40 70,35 75,50 60,55' fill='none' stroke='#4a6cf7' stroke-width='2'/><polygon points='90,55 105,52 108,68 92,70' fill='none' stroke='#4a6cf7' stroke-width='2'/><polygon points='60,85 78,82 80,96 62,98' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='45' cy='62' r='2' fill='#94a3b8'/><circle cx='52' cy='78' r='2' fill='#94a3b8'/><circle cx='85' cy='40' r='2' fill='#94a3b8'/><circle cx='95' cy='88' r='2' fill='#94a3b8'/><circle cx='70' cy='105' r='2' fill='#94a3b8'/><circle cx='40' cy='84' r='2' fill='#94a3b8'/><circle cx='95' cy='102' r='2' fill='#94a3b8'/><circle cx='102' cy='80' r='2' fill='#94a3b8'/><circle cx='50' cy='48' r='2' fill='#94a3b8'/><circle cx='75' cy='68' r='2' fill='#94a3b8'/><circle cx='225' cy='65' r='50' fill='none' stroke='#4a6cf7' stroke-width='2'/><polygon points='200,35 218,32 222,48 203,51' fill='none' stroke='#4a6cf7' stroke-width='2'/><polygon points='228,30 246,34 244,50 226,47' fill='none' stroke='#4a6cf7' stroke-width='2'/><polygon points='196,58 214,55 217,72 199,74' fill='none' stroke='#4a6cf7' stroke-width='2'/><polygon points='222,55 240,53 243,70 224,72' fill='none' stroke='#4a6cf7' stroke-width='2'/><polygon points='248,58 262,62 258,76 245,73' fill='none' stroke='#4a6cf7' stroke-width='2'/><polygon points='202,80 220,78 223,94 205,96' fill='none' stroke='#4a6cf7' stroke-width='2'/><polygon points='228,78 246,80 243,95 226,93' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='70' y='134' font-size='11' fill='#333'>A</text><text x='220' y='134' font-size='11' fill='#333'>B</text></svg>","c":["斑状組織","等粒状組織","層状組織","柱状組織"],"a":0,"e":"斑状組織は火山岩に見られるつくりで、マグマが急に冷えたため結晶になりきれなかった部分が石基になります。大きさのそろった結晶が並ぶBは等粒状組織で、深成岩のつくりです。"},{"t":"火成岩","q":"次のうち、深成岩はどれですか。","c":["花こう岩","玄武岩","安山岩","流紋岩"],"a":0,"e":"深成岩は花こう岩・せん緑岩・はんれい岩、火山岩は流紋岩・安山岩・玄武岩です。"},{"t":"鉱物","q":"火成岩にふくまれる鉱物のうち、無色鉱物（白っぽい鉱物）はどれですか。","c":["石英","黒雲母","角セン石","輝石"],"a":0,"e":"無色鉱物は石英と長石で、黒雲母・角セン石・輝石・カンラン石などは有色鉱物です。"},{"t":"P波とS波","q":"図は、ある地点の地震計の記録です。はじめに始まる小さなゆれ（初期微動）を伝える波を何といいますか。","fig":"<svg viewBox='0 0 300 142'><line x1='20' y1='70' x2='285' y2='70' stroke='#94a3b8' stroke-width='1'/><polyline points='20,70 80,70' fill='none' stroke='#4a6cf7' stroke-width='2'/><polyline points='80,70 86,62 92,78 98,63 104,77 110,62 116,78 122,63 128,77 134,62 140,78 146,64 152,76 158,70' fill='none' stroke='#4a6cf7' stroke-width='2'/><polyline points='160,70 168,38 176,102 184,42 192,98 200,40 208,100 216,45 224,95 232,48 240,92 248,52 256,88 264,58 270,70' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='80' y1='16' x2='80' y2='60' stroke='#94a3b8' stroke-width='1' stroke-dasharray='4 3'/><line x1='160' y1='16' x2='160' y2='62' stroke='#94a3b8' stroke-width='1' stroke-dasharray='4 3'/><text x='62' y='12' font-size='11' fill='#333'>ア</text><text x='150' y='12' font-size='11' fill='#333'>イ</text><line x1='80' y1='120' x2='160' y2='120' stroke='#94a3b8' stroke-width='1'/><text x='82' y='136' font-size='11' fill='#333'>初期微動継続時間</text></svg>","c":["P波","S波","表面波","主要動"],"a":0,"e":"初期微動を伝えるのは、伝わる速さが速いP波（図のアで到着）です。あとから届いて大きなゆれ（主要動）を起こす波がS波です。"},{"t":"初期微動","q":"初期微動継続時間について正しく述べたものはどれですか。","c":["震源からの距離が大きいほど長くなる","震源からの距離が大きいほど短くなる","どの地点でもほぼ同じである","マグニチュードが大きいほど長くなる"],"a":0,"e":"初期微動継続時間はP波とS波の到着時刻の差なので、震源から遠いほど長くなります。この時間から震源までのおよその距離を求められます。"},{"t":"マグニチュード","q":"地震そのものの規模（エネルギーの大きさ）を表すものはどれですか。","c":["マグニチュード","震度","初期微動継続時間","震央距離"],"a":0,"e":"マグニチュードは地震の規模を表し、1つの地震に1つの値が決まります。震度は各地点でのゆれの大きさで、0から7の10階級に分けられます。"},{"t":"震央","q":"地震が発生した地下の場所の真上にあたる、地表の地点を何といいますか。","c":["震央","震源","震度","断層"],"a":0,"e":"地震が発生した地下の場所を震源、その真上の地表の地点を震央といいます。"},{"t":"地震の計算","q":"ある地震で、震源から120km離れた地点にP波が15秒、S波が30秒で届きました。この地点の初期微動継続時間は何秒ですか。","c":["15秒","45秒","30秒","2秒"],"a":0,"e":"初期微動継続時間はS波とP波の到着時刻の差なので、30−15＝15秒です。"},{"t":"堆積岩","q":"れき・砂・泥などが積み重なり、押し固められてできた岩石を何といいますか。","c":["堆積岩","火成岩","火山岩","深成岩"],"a":0,"e":"水のはたらきで運ばれた土砂が堆積して固まった岩石を堆積岩といい、粒の大きい順にれき岩・砂岩・泥岩と分けられます。"},{"t":"石灰岩","q":"うすい塩酸をかけると二酸化炭素が発生する堆積岩はどれですか。","c":["石灰岩","チャート","砂岩","凝灰岩"],"a":0,"e":"石灰岩は炭酸カルシウムをふくむので、塩酸をかけると二酸化炭素が発生します。同じく生物の遺がいからできるチャートは非常にかたく、塩酸をかけても気体は出ません。"},{"t":"示相化石","q":"地層が堆積した当時の環境を知る手がかりになる化石を何といいますか。","c":["示相化石","示準化石","化石燃料","生痕化石"],"a":0,"e":"サンゴのように、堆積した当時の環境がわかる化石を示相化石といいます。サンゴはあたたかく浅い海であったことを示します。"},{"t":"示準化石","q":"アンモナイトの化石が見つかった地層は、いつの時代に堆積したと考えられますか。","c":["中生代","古生代","新生代","先カンブリア時代"],"a":0,"e":"アンモナイトは中生代の示準化石です。サンヨウチュウは古生代、ビカリアやナウマンゾウは新生代の示準化石です。"},{"t":"しゅう曲","q":"図のように、地層が大きな力で押されて波打つように曲がったものを何といいますか。","fig":"<svg viewBox='0 0 300 160'><path d='M20,34 C70,6 130,62 180,34 C220,12 260,48 285,30' fill='none' stroke='#4a6cf7' stroke-width='2'/><path d='M20,56 C70,28 130,84 180,56 C220,34 260,70 285,52' fill='none' stroke='#4a6cf7' stroke-width='2'/><path d='M20,78 C70,50 130,106 180,78 C220,56 260,92 285,74' fill='none' stroke='#4a6cf7' stroke-width='2'/><path d='M20,100 C70,72 130,128 180,100 C220,78 260,114 285,96' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='20' y1='145' x2='58' y2='145' stroke='#4a6cf7' stroke-width='2'/><polygon points='66,145 54,140 54,150' fill='#4a6cf7'/><line x1='285' y1='145' x2='247' y2='145' stroke='#4a6cf7' stroke-width='2'/><polygon points='239,145 251,140 251,150' fill='#4a6cf7'/><text x='108' y='150' font-size='11' fill='#333'>押す力</text></svg>","c":["しゅう曲","断層","不整合","柱状図"],"a":0,"e":"横から押す大きな力で地層が波打つように曲がったものをしゅう曲、力を受けて地層がずれたものを断層といいます。"}],"4":[{"t":"原子","q":"原子の性質として、あてはまらないものはどれですか。","c":["化学変化によって別の種類の原子に変わる","化学変化ではそれ以上分けられない","化学変化でなくなったり新しくできたりしない","種類によって質量や大きさが決まっている"],"a":0,"e":"原子は化学変化によってそれ以上分けられず、なくなったり新しくできたり、別の種類に変わったりしません。種類ごとに質量と大きさが決まっています。"},{"t":"分子","q":"いくつかの原子が結びついてできた、物質の性質を示す最小の粒子を何といいますか。","c":["分子","元素","単体","化合物"],"a":0,"e":"分子は原子がいくつか結びついた粒子で、その物質の性質を示す最小の単位です。"},{"t":"元素記号","q":"元素記号Naが表す元素はどれですか。","c":["ナトリウム","窒素","ネオン","ニッケル"],"a":0,"e":"Naはナトリウムを表します。窒素はN、ネオンはNe、ニッケルはNiです。"},{"t":"元素記号","q":"鉄を表す元素記号はどれですか。","c":["Fe","Cu","Ag","Mg"],"a":0,"e":"鉄はFeです。Cuは銅、Agは銀、Mgはマグネシウムを表します。"},{"t":"単体","q":"次のうち、単体はどれですか。","c":["酸素 O2","水 H2O","二酸化炭素 CO2","塩化ナトリウム NaCl"],"a":0,"e":"1種類の元素だけでできている物質を単体といいます。2種類以上の元素からできている物質は化合物です。"},{"t":"化合物","q":"次のうち、化合物はどれですか。","c":["アンモニア NH3","水素 H2","銅 Cu","窒素 N2"],"a":0,"e":"2種類以上の元素が結びついてできた物質を化合物といいます。ほかの3つは1種類の元素からなる単体です。"},{"t":"化学式","q":"水の化学式はどれですか。","c":["H2O","H2O2","HO2","H2"],"a":0,"e":"水の分子は水素原子2個と酸素原子1個からできているのでH2Oと表します。H2O2は過酸化水素です。"},{"t":"化学式","q":"二酸化炭素の化学式はどれですか。","c":["CO2","CO","C2O","CaO"],"a":0,"e":"二酸化炭素は炭素原子1個と酸素原子2個からできているのでCO2です。COは一酸化炭素、CaOは酸化カルシウムです。"},{"t":"電気分解","q":"図のように、水酸化ナトリウムを少量とかした水に電流を流しました。陰極（−極）側に発生する気体は何ですか。","fig":"<svg viewBox='0 0 300 178'><line x1='70' y1='26' x2='70' y2='124' stroke='#4a6cf7' stroke-width='2'/><line x1='100' y1='26' x2='100' y2='124' stroke='#4a6cf7' stroke-width='2'/><line x1='200' y1='26' x2='200' y2='124' stroke='#4a6cf7' stroke-width='2'/><line x1='230' y1='26' x2='230' y2='124' stroke='#4a6cf7' stroke-width='2'/><path d='M70,124 L70,144 L230,144 L230,124' fill='none' stroke='#4a6cf7' stroke-width='2'/><path d='M100,124 L100,132 L200,132 L200,124' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='70' y1='74' x2='100' y2='74' stroke='#94a3b8' stroke-width='1'/><line x1='200' y1='50' x2='230' y2='50' stroke='#94a3b8' stroke-width='1'/><line x1='85' y1='142' x2='85' y2='96' stroke='#4a6cf7' stroke-width='2'/><line x1='215' y1='142' x2='215' y2='96' stroke='#4a6cf7' stroke-width='2'/><line x1='85' y1='144' x2='85' y2='164' stroke='#4a6cf7' stroke-width='2'/><line x1='215' y1='144' x2='215' y2='164' stroke='#4a6cf7' stroke-width='2'/><line x1='85' y1='164' x2='215' y2='164' stroke='#4a6cf7' stroke-width='2'/><text x='132' y='176' font-size='11' fill='#333'>電源</text><text x='52' y='20' font-size='11' fill='#333'>陰極(−)</text><text x='184' y='20' font-size='11' fill='#333'>陽極(+)</text></svg>","c":["水素","酸素","二酸化炭素","塩素"],"a":0,"e":"水の電気分解では陰極に水素、陽極に酸素が発生します。水素はマッチの火を近づけると音を立てて燃えます。"},{"t":"電気分解","q":"水の電気分解で発生する、陰極側と陽極側の気体の体積の比はどうなりますか。","c":["陰極:陽極＝2:1","陰極:陽極＝1:2","陰極:陽極＝1:1","陰極:陽極＝4:1"],"a":0,"e":"化学反応式 2H2O → 2H2 + O2 が示すとおり、生じる水素と酸素の分子の数の比は2:1で、体積比も2:1になります。"},{"t":"化学反応式","q":"水の電気分解を表す化学反応式として正しいものはどれですか。","c":["2H2O → 2H2 + O2","H2O → H2 + O2","2H2O → H2 + 2O2","H2O → 2H2 + O2"],"a":0,"e":"化学反応式では矢印の左右で原子の種類と数が等しくなるように係数をつけます。2H2Oは水素原子4個と酸素原子2個なので、2H2 + O2 と一致します。"},{"t":"熱分解","q":"図のように炭酸水素ナトリウムを加熱すると、3つの物質に分かれます。その組み合わせとして正しいものはどれですか。","fig":"<svg viewBox='0 0 300 168'><path d='M144,67 L44,37 L36,63 L136,93' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='52' cy='50' r='3' fill='none' stroke='#94a3b8' stroke-width='1'/><circle cx='60' cy='55' r='3' fill='none' stroke='#94a3b8' stroke-width='1'/><circle cx='68' cy='59' r='3' fill='none' stroke='#94a3b8' stroke-width='1'/><line x1='140' y1='80' x2='185' y2='104' stroke='#4a6cf7' stroke-width='2'/><line x1='185' y1='104' x2='185' y2='140' stroke='#4a6cf7' stroke-width='2'/><path d='M168,108 L168,148 L174,156 L196,156 L202,148 L202,108' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='168' y1='122' x2='202' y2='122' stroke='#94a3b8' stroke-width='1'/><polygon points='56,76 50,92 62,92' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='24' y='112' font-size='11' fill='#333'>加熱</text><text x='210' y='140' font-size='11' fill='#333'>石灰水</text><text x='22' y='22' font-size='11' fill='#333'>炭酸水素ナトリウム</text><line x1='66' y1='26' x2='58' y2='44' stroke='#94a3b8' stroke-width='1'/></svg>","c":["炭酸ナトリウム・水・二酸化炭素","塩化ナトリウム・水・酸素","炭酸ナトリウム・水素・酸素","水酸化ナトリウム・水・二酸化炭素"],"a":0,"e":"炭酸水素ナトリウムを加熱すると 2NaHCO3 → Na2CO3 + H2O + CO2 のように分解し、炭酸ナトリウム・水・二酸化炭素ができます。"},{"t":"熱分解","q":"炭酸水素ナトリウムを加熱したとき、試験管の口付近についた液体に塩化コバルト紙をつけると、どうなりますか。","c":["青色から赤色（桃色）に変わる","赤色から青色に変わる","無色から黄色に変わる","色は変化しない"],"a":0,"e":"塩化コバルト紙は水にふれると青色から赤色（桃色）に変わります。これにより、ついた液体が水であることが確かめられます。"},{"t":"熱分解","q":"酸化銀を加熱したときに起こる変化として正しいものはどれですか。","c":["銀と酸素に分解する","炭素と酸素に分解する","銀と二酸化炭素に分解する","何も変化しない"],"a":0,"e":"酸化銀を加熱すると 2Ag2O → 4Ag + O2 のように分解し、金属光沢をもつ銀と酸素ができます。"},{"t":"分解","q":"1種類の物質が2種類以上の別の物質に分かれる化学変化を何といいますか。","c":["分解","化合","酸化","還元"],"a":0,"e":"1種類の物質が2種類以上の物質に分かれる変化を分解といい、加熱による分解を熱分解、電流による分解を電気分解といいます。"},{"t":"化合","q":"図のように鉄粉と硫黄の混合物を加熱すると、何という物質ができますか。","fig":"<svg viewBox='0 0 300 170'><path d='M120,20 L120,120 L128,132 L152,132 L160,120 L160,20' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='130' cy='80' r='3' fill='none' stroke='#94a3b8' stroke-width='1'/><circle cx='146' cy='84' r='3' fill='none' stroke='#94a3b8' stroke-width='1'/><circle cx='136' cy='94' r='3' fill='none' stroke='#94a3b8' stroke-width='1'/><circle cx='150' cy='98' r='3' fill='none' stroke='#94a3b8' stroke-width='1'/><circle cx='128' cy='106' r='3' fill='none' stroke='#94a3b8' stroke-width='1'/><circle cx='144' cy='112' r='3' fill='none' stroke='#94a3b8' stroke-width='1'/><circle cx='134' cy='122' r='3' fill='none' stroke='#94a3b8' stroke-width='1'/><circle cx='152' cy='122' r='3' fill='none' stroke='#94a3b8' stroke-width='1'/><polygon points='114,82 100,74 100,92' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='62' y1='90' x2='96' y2='84' stroke='#94a3b8' stroke-width='1'/><text x='26' y='94' font-size='11' fill='#333'>加熱</text><text x='176' y='62' font-size='11' fill='#333'>鉄粉と硫黄</text><line x1='174' y1='66' x2='154' y2='84' stroke='#94a3b8' stroke-width='1'/></svg>","c":["硫化鉄","酸化鉄","硫酸鉄","二酸化硫黄"],"a":0,"e":"鉄と硫黄が結びついて硫化鉄ができます。化学反応式は Fe + S → FeS です。"},{"t":"硫化鉄","q":"鉄と硫黄が結びついてできた硫化鉄の性質として正しいものはどれですか。","c":["磁石につかず、うすい塩酸を加えるとくさいにおいの気体が出る","磁石につき、うすい塩酸を加えると水素が発生する","磁石につき、においのある気体は発生しない","もとの鉄とまったく同じ性質を示す"],"a":0,"e":"硫化鉄は鉄とは別の物質なので磁石につかず、うすい塩酸を加えると卵の腐ったようなにおいの硫化水素が発生します。"},{"t":"酸化","q":"物質が酸素と結びつく化学変化を何といいますか。","c":["酸化","還元","分解","蒸留"],"a":0,"e":"物質が酸素と結びつく変化を酸化といい、できた物質を酸化物といいます。"},{"t":"燃焼","q":"物質が熱や光を出しながら激しく酸化されることを何といいますか。","c":["燃焼","還元","融解","蒸発"],"a":0,"e":"熱や光を出しながら激しく進む酸化を燃焼といいます。鉄がさびるのは、おだやかに進む酸化です。"},{"t":"化学反応式","q":"マグネシウムを空気中で燃やしたときの化学反応式として正しいものはどれですか。","c":["2Mg + O2 → 2MgO","Mg + O2 → MgO2","Mg + O → MgO","2Mg + O → 2MgO"],"a":0,"e":"酸素は分子O2として存在し、できる酸化マグネシウムはMgOです。左右で原子の数を合わせると 2Mg + O2 → 2MgO になります。"},{"t":"還元","q":"図のように酸化銅と炭素の粉末を混ぜて加熱すると、酸化銅から酸素がうばわれて銅ができました。このような化学変化を何といいますか。","fig":"<svg viewBox='0 0 300 168'><path d='M152,60 L42,45 L38,75 L148,90' fill='none' stroke='#4a6cf7' stroke-width='2'/><circle cx='54' cy='58' r='3' fill='none' stroke='#94a3b8' stroke-width='1'/><circle cx='64' cy='62' r='3' fill='none' stroke='#94a3b8' stroke-width='1'/><circle cx='74' cy='64' r='3' fill='none' stroke='#94a3b8' stroke-width='1'/><circle cx='58' cy='70' r='3' fill='none' stroke='#94a3b8' stroke-width='1'/><circle cx='70' cy='74' r='3' fill='none' stroke='#94a3b8' stroke-width='1'/><polygon points='60,100 54,116 66,116' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='150' y1='78' x2='195' y2='105' stroke='#4a6cf7' stroke-width='2'/><line x1='195' y1='105' x2='195' y2='140' stroke='#4a6cf7' stroke-width='2'/><path d='M178,110 L178,148 L184,156 L206,156 L212,148 L212,110' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='178' y1='124' x2='212' y2='124' stroke='#94a3b8' stroke-width='1'/><text x='218' y='142' font-size='11' fill='#333'>石灰水</text><text x='26' y='28' font-size='11' fill='#333'>酸化銅と炭素</text><line x1='72' y1='32' x2='62' y2='48' stroke='#94a3b8' stroke-width='1'/><text x='14' y='132' font-size='11' fill='#333'>加熱</text><line x1='48' y1='128' x2='58' y2='116' stroke='#94a3b8' stroke-width='1'/></svg>","c":["還元","酸化","分解","中和"],"a":0,"e":"酸化物から酸素がうばわれる化学変化を還元といいます。このとき炭素は酸素と結びついて二酸化炭素になり、酸化されています。"},{"t":"化学反応式","q":"酸化銅と炭素の粉末を混ぜて加熱したときの化学反応式として正しいものはどれですか。","c":["2CuO + C → 2Cu + CO2","CuO + C → Cu + CO2","2CuO + C → 2Cu + 2CO2","CuO + 2C → Cu + 2CO2"],"a":0,"e":"左右の原子の数をそろえると 2CuO + C → 2Cu + CO2 になります。銅は還元され、炭素は酸化されて二酸化炭素になります。"},{"t":"酸化と還元","q":"酸化銅を炭素で還元する実験について、正しく説明しているものはどれですか。","c":["酸化銅は還元され、同時に炭素は酸化される","酸化銅も炭素もどちらも還元される","酸化銅も炭素もどちらも酸化される","酸化だけが起こり、還元は起こらない"],"a":0,"e":"ある物質が酸素をうばわれて還元されるとき、酸素をうばった相手の物質は必ず酸化されます。還元と酸化はつねに同時に起こります。"},{"t":"質量保存","q":"化学変化の前後で、物質全体の質量は変わりません。この法則を何といいますか。","c":["質量保存の法則","定比例の法則","フックの法則","オームの法則"],"a":0,"e":"化学変化では原子の組み合わせが変わるだけで原子の種類と数は変わらないため、全体の質量は変化しません。これを質量保存の法則といいます。"},{"t":"質量保存","q":"密閉した容器の中で、うすい塩酸と石灰石を反応させました。反応の前後で容器全体の質量はどうなりますか。","c":["変わらない","増える","減る","反応の速さによって変わる"],"a":0,"e":"発生した二酸化炭素も容器の中に残っているため、質量保存の法則により全体の質量は変わりません。"},{"t":"質量保存","q":"うすい塩酸と石灰石を反応させたあと、容器のふたを開けてしばらくおくと、全体の質量はどうなりますか。","c":["減る","増える","変わらない","一度増えてから減る"],"a":0,"e":"発生した二酸化炭素が空気中へ出ていくため、その分だけ全体の質量が減ります。"},{"t":"質量の比","q":"図は銅の質量と、それに結びついた酸素の質量の関係です。銅0.8gを完全に酸化させたとき、できる酸化銅の質量は何gですか。","fig":"<svg viewBox='0 0 300 172'><line x1='50' y1='140' x2='280' y2='140' stroke='#333' stroke-width='1'/><line x1='50' y1='140' x2='50' y2='20' stroke='#333' stroke-width='1'/><line x1='50' y1='140' x2='250' y2='40' stroke='#4a6cf7' stroke-width='2'/><line x1='46' y1='115' x2='50' y2='115' stroke='#333' stroke-width='1'/><line x1='46' y1='90' x2='50' y2='90' stroke='#333' stroke-width='1'/><line x1='46' y1='65' x2='50' y2='65' stroke='#333' stroke-width='1'/><line x1='46' y1='40' x2='50' y2='40' stroke='#333' stroke-width='1'/><line x1='100' y1='140' x2='100' y2='144' stroke='#333' stroke-width='1'/><line x1='150' y1='140' x2='150' y2='144' stroke='#333' stroke-width='1'/><line x1='200' y1='140' x2='200' y2='144' stroke='#333' stroke-width='1'/><line x1='250' y1='140' x2='250' y2='144' stroke='#333' stroke-width='1'/><text x='36' y='144' font-size='11' fill='#333'>0</text><text x='24' y='119' font-size='11' fill='#333'>0.1</text><text x='24' y='94' font-size='11' fill='#333'>0.2</text><text x='24' y='69' font-size='11' fill='#333'>0.3</text><text x='24' y='44' font-size='11' fill='#333'>0.4</text><text x='90' y='156' font-size='11' fill='#333'>0.4</text><text x='140' y='156' font-size='11' fill='#333'>0.8</text><text x='190' y='156' font-size= の抵抗は各抵抗の和なので、20＋30＝50Ωです。"},{"t":"並列の抵抗","q":"図のように20Ωと30Ωの抵抗を並列につなぎました。この回路全体の抵抗は何Ωですか。","fig":"<svg viewBox='0 0 300 155'><line x1='100' y1='35' x2='120' y2='35' stroke='#4a6cf7' stroke-width='2'/><rect x='120' y='25' width='40' height='20' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='160' y1='35' x2='200' y2='35' stroke='#4a6cf7' stroke-width='2'/><line x1='100' y1='80' x2='120' y2='80' stroke='#4a6cf7' stroke-width='2'/><rect x='120' y='70' width='40' height='20' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='160' y1='80' x2='200' y2='80' stroke='#4a6cf7' stroke-width='2'/><line x1='100' y1='35' x2='100' y2='80' stroke='#4a6cf7' stroke-width='2'/><line x1='200' y1='35' x2='200' y2='80' stroke='#4a6cf7' stroke-width='2'/><line x1='40' y1='57' x2='100' y2='57' stroke='#4a6cf7' stroke-width='2'/><line x1='200' y1='57' x2='265' y2='57' stroke='#4a6cf7' stroke-width='2'/><line x1='40' y1='57' x2='40' y2='125' stroke='#4a6cf7' stroke-width='2'/><line x1='265' y1='57' x2='265' y2='125' stroke='#4a6cf7' stroke-width='2'/><line x1='265' y1='125' x2='175' y2='125' stroke='#4a6cf7' stroke-width='2'/><line x1='145' y1='125' x2='40' y2='125' stroke='#4a6cf7' stroke-width='2'/><line x1='167' y1='114' x2='167' y2='136' stroke='#4a6cf7' stroke-width='2'/><line x1='155' y1='118' x2='155' y2='132' stroke='#4a6cf7' stroke-width='4'/><line x1='167' y1='125' x2='175' y2='125' stroke='#4a6cf7' stroke-width='2'/><line x1='145' y1='125' x2='155' y2='125' stroke='#4a6cf7' stroke-width='2'/><text x='126' y='19' font-size='11' fill='#333'>20Ω</text><text x='126' y='106' font-size='11' fill='#333'>30Ω</text><text x='48' y='146' font-size='11' fill='#333'>電源</text></svg>","c":["12 Ω","50 Ω","25 Ω","10 Ω"],"a":0,"e":"並列回路では 1÷全体の抵抗＝1÷20＋1÷30＝1÷12 となるので、全体の抵抗は12Ωです。全体の抵抗はどの抵抗よりも小さくなります。"},{"t":"オームの法則","q":"オームの法則を表す式として正しいものはどれですか。","c":["電圧＝抵抗×電流","電圧＝抵抗÷電流","電流＝電圧×抵抗","抵抗＝電流÷電圧"],"a":0,"e":"オームの法則は 電圧(V)＝抵抗(Ω)×電流(A) です。変形すると 電流＝電圧÷抵抗、抵抗＝電圧÷電流 になります。"},{"t":"オームの法則","q":"6Vの電源に3Ωの抵抗をつないだとき、流れる電流は何Aですか。","c":["2 A","0.5 A","18 A","3 A"],"a":0,"e":"電流＝電圧÷抵抗なので、6÷3＝2Aです。"},{"t":"オームの法則","q":"ある抵抗に12Vの電圧を加えると、0.4Aの電流が流れました。この抵抗は何Ωですか。","c":["30 Ω","4.8 Ω","48 Ω","0.03 Ω"],"a":0,"e":"抵抗＝電圧÷電流なので、12÷0.4＝30Ωです。"},{"t":"オームの法則","q":"20Ωの抵抗に0.3Aの電流を流すには、何Vの電圧を加えればよいですか。","c":["6 V","0.015 V","20.3 V","60 V"],"a":0,"e":"電圧＝抵抗×電流なので、20×0.3＝6Vです。"},{"t":"電流計","q":"電流計の使い方として正しいものはどれですか。","c":["はかりたい部分に直列につなぐ","はかりたい部分に並列につなぐ","電源だけに直接つなぐ","つなぎ方はどちらでもよい"],"a":0,"e":"電流計は回路に直列につなぎます。電流計自体の抵抗は非常に小さいので、電源に直接つなぐと大きな電流が流れて危険です。"},{"t":"電圧計","q":"電圧計の使い方として正しいものはどれですか。","c":["はかりたい部分に並列につなぐ","はかりたい部分に直列につなぐ","回路を切ってその間につなぐ","電流計と直列につなぐ"],"a":0,"e":"電圧計ははかりたい部分に並列につなぎます。電圧計自体の抵抗は非常に大きいので、直列につなぐとほとんど電流が流れなくなります。"},{"t":"導体と不導体","q":"ガラスやゴムのように、電気をほとんど通さない物質を何といいますか。","c":["不導体（絶縁体）","導体","電解質","磁性体"],"a":0,"e":"金属のように電気をよく通す物質を導体、ガラス・ゴム・プラスチックのようにほとんど電気を通さない物質を不導体（絶縁体）といいます。"},{"t":"電力","q":"電力を求める式として正しいものはどれですか。","c":["電力(W)＝電圧(V)×電流(A)","電力(W)＝電圧(V)÷電流(A)","電力(W)＝電流(A)÷電圧(V)","電力(W)＝電圧(V)＋電流(A)"],"a":0,"e":"1秒間に使われる電気エネルギーの量を電力といい、電圧×電流で求めます。単位はワット(W)です。"},{"t":"電力","q":"100Vの電源につないだ電気器具に5Aの電流が流れました。この器具の電力は何Wですか。","c":["500 W","20 W","0.05 W","105 W"],"a":0,"e":"電力＝電圧×電流なので、100×5＝500Wです。"},{"t":"熱量","q":"電熱線から発生する熱量を求める式として正しいものはどれですか。","c":["熱量(J)＝電力(W)×時間(s)","熱量(J)＝電力(W)÷時間(s)","熱量(J)＝電圧(V)×時間(s)","熱量(J)＝電流(A)×時間(s)"],"a":0,"e":"熱量は電力に電流を流した時間（秒）をかけて求めます。単位はジュール(J)です。"},{"t":"熱量","q":"500Wの電熱線に1分間電流を流したとき、発生する熱量は何Jですか。","c":["30000 J","500 J","30 J","8.3 J"],"a":0,"e":"1分は60秒なので、500×60＝30000Jです。時間は必ず秒に直して計算します。"},{"t":"電力量","q":"1000Wの電気器具を2時間使ったときの電力量は何kWhですか。","c":["2 kWh","2000 kWh","0.5 kWh","120 kWh"],"a":0,"e":"1000W＝1kWなので、1×2＝2kWhです。電力量は電力と使用時間の積で表されます。"},{"t":"静電気","q":"異なる2種類の物質をこすり合わせたときに、物体が電気を帯びる現象を何といいますか。","c":["静電気","電磁誘導","放電","電気分解"],"a":0,"e":"こすり合わせによって一方の物質から他方へ電子が移動するため、物体が電気を帯びます。これを静電気といいます。"},{"t":"静電気","q":"同じ種類の電気を帯びた2つの物体を近づけると、どうなりますか。","c":["退け合う力がはたらく","引き合う力がはたらく","力はまったくはたらかない","電気がすぐになくなる"],"a":0,"e":"同じ種類の電気どうしは退け合い、異なる種類の電気どうしは引き合います。この力は離れていてもはたらきます。"},{"t":"放電","q":"たまっていた電気が流れ出す現象を何といいますか。","c":["放電","帯電","電磁誘導","分解"],"a":0,"e":"たまっていた電気が流れ出す現象を放電といい、気圧を非常に低くした空間に電流が流れる現象を真空放電といいます。"},{"t":"陰極線","q":"クルックス管（真空放電管）で見られる陰極線の正体は何ですか。","c":["−の電気をもつ電子の流れ","＋の電気をもつ粒子の流れ","光そのもの","あたためられた空気の流れ"],"a":0,"e":"陰極線は−極から＋極へ向かう電子の流れです。電子は−の電気をもつため、電圧を加えると＋極のほうへ引かれて曲がります。"},{"t":"電子と電流","q":"回路の中を移動する電子の向きと、電流の向きの関係として正しいものはどれですか。","c":["電子は電流と逆向きに、−極から＋極へ移動する","電子は電流と同じ向きに、＋極から−極へ移動する","電子は電流と同じ向きに、−極から＋極へ移動する","電子は移動していない"],"a":0,"e":"電流の向きは＋極から−極と決められていますが、実際に移動している電子は−極から＋極へ動いています。"},{"t":"磁力線","q":"図のように、磁界の中に置いた方位磁針のN極がさす向きを順につないでできる線を何といいますか。","fig":"<svg viewBox='0 0 300 150'><rect x='110' y='62' width='80' height='26' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='150' y1='62' x2='150' y2='88' stroke='#4a6cf7' stroke-width='2'/><text x='124' y='80' font-size='11' fill='#333'>N</text><text x='166' y='80' font-size='11' fill='#333'>S</text><path d='M110,64 C95,25 205,25 190,64' fill='none' stroke='#94a3b8' stroke-width='2'/><path d='M110,68 C40,5 260,5 190,68' fill='none' stroke='#94a3b8' stroke-width='2'/><path d='M110,86 C95,125 205,125 190,86' fill='none' stroke='#94a3b8' stroke-width='2'/><path d='M110,82 C40,145 260,145 190,82' fill='none' stroke='#94a3b8' stroke-width='2'/><polygon points='158,35 148,31 148,40' fill='#4a6cf7'/><polygon points='158,21 148,17 148,26' fill='#4a6cf7'/><polygon points='158,115 148,111 148,120' fill='#4a6cf7'/><polygon points='158,129 148,125 148,134' fill='#4a6cf7'/></svg>","c":["磁力線","磁束","電気力線","等圧線"],"a":0,"e":"方位磁針のN極がさす向きが磁界の向きで、それをつないだ線を磁力線といいます。磁力線はN極から出てS極に入る向きにかきます。"},{"t":"電流と磁界","q":"図のように、まっすぐな導線に電流を流したとき、そのまわりにできる磁界のようすとして正しいものはどれですか。","fig":"<svg viewBox='0 0 300 160'><polygon points='40,110 200,110 260,70 100,70' fill='none' stroke='#94a3b8' stroke-width='1'/><ellipse cx='150' cy='90' rx='30' ry='12' fill='none' stroke='#4a6cf7' stroke-width='2'/><ellipse cx='150' cy='90' rx='55' ry='22' fill='none' stroke='#4a6cf7' stroke-width='2'/><ellipse cx='150' cy='90' rx='80' ry='32' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='150' y1='16' x2='150' y2='152' stroke='#4a6cf7' stroke-width='2'/><polygon points='150,8 144,22 156,22' fill='#4a6cf7'/><text x='158' y='24' font-size='11' fill='#333'>電流</text><text x='186' y='134' font-size='11' fill='#333'>導線のまわりの磁界</text></svg>","c":["導線を中心とした同心円状の磁界ができる","導線と平行な直線状の磁界ができる","導線から放射状に広がる磁界ができる","磁界はまったくできない"],"a":0,"e":"まっすぐな導線のまわりには、導線を中心とする同心円状の磁界ができます。電流の向きに右ねじを進めるときの、ねじを回す向きが磁界の向きです。"},{"t":"コイルの磁界","q":"コイルに電流を流したときにできる磁界を強くする方法として、正しくないものはどれですか。","c":["コイルの巻数を減らす","コイルの巻数を増やす","流す電流を大きくする","コイルの中に鉄心を入れる"],"a":0,"e":"巻数を増やす、電流を大きくする、鉄心を入れる、のいずれも磁界を強くします。巻数を減らすと磁界は弱くなります。"},{"t":"電流が受ける力","q":"磁界の中に置いた導線に電流を流すと、導線は力を受けて動きました。電流の向きだけを逆にすると、力の向きはどうなりますか。","c":["逆向きになる","変わらない","力がはたらかなくなる","磁界と同じ向きになる"],"a":0,"e":"導線が受ける力の向きは電流の向きと磁界の向きで決まります。どちらか一方だけを逆にすると力の向きも逆になり、両方を逆にすると力の向きは変わりません。"},{"t":"電磁誘導","q":"図のように、コイルの中で棒磁石を出し入れすると検流計の針がふれ、電流が流れました。この現象を何といいますか。","fig":"<svg viewBox='0 0 300 160'><ellipse cx='120' cy='75' rx='9' ry='30' fill='none' stroke='#4a6cf7' stroke-width='2'/><ellipse cx='142' cy='75' rx='9' ry='30' fill='none' stroke='#4a6cf7' stroke-width='2'/><ellipse cx='164' cy='75' rx='9' ry='30' fill='none' stroke='#4a6cf7' stroke-width='2'/><ellipse cx='186' cy='75' rx='9' ry='30' fill='none' stroke='#4a6cf7' stroke-width='2'/><rect x='24' y='62' width='70' height='26' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='59' y1='62' x2='59' y2='88' stroke='#4a6cf7' stroke-width='2'/><text x='36' y='80' font-size='11' fill='#333'>S</text><text x='74' y='80' font-size='11' fill='#333'>N</text><line x1='62' y1='40' x2='98' y2='40' stroke='#4a6cf7' stroke-width='2'/><polygon points='106,40 94,35 94,45' fill='#4a6cf7'/><text x='22' y='36' font-size='11' fill='#333'>動かす</text><line x1='120' y1='45' x2='120' y2='24' stroke='#4a6cf7' stroke-width='2'/><line x1='120' y1='24' x2='230' y2='24' stroke='#4a6cf7' stroke-width='2'/><line x1='230' y1='24' x2='230' y2='109' stroke='#4a6cf7' stroke-width='2'/><line x1='186' y1='105' x2='186' y2='142' stroke='#4a6cf7' stroke-width='2'/><line x1='186' y1='142' x2='230' y2='142' stroke='#4a6cf7' stroke-width='2'/><circle cx='230' cy='125' r='16' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='225' y='130' font-size='11' fill='#333'>G</text><text x='250' y='128' font-size='11' fill='#333'>検流計</text></svg>","c":["電磁誘導","静電気","真空放電","オームの法則"],"a":0,"e":"コイルの中の磁界が変化すると電圧が生じて電流が流れます。この現象を電磁誘導、このとき流れる電流を誘導電流といいます。"},{"t":"誘導電流","q":"誘導電流を大きくする方法として、正しくないものはどれですか。","c":["磁石をゆっくり動かす","磁石を速く動かす","磁力の強い磁石を使う","コイルの巻数を増やす"],"a":0,"e":"磁石を速く動かす、磁力の強い磁石を使う、コイルの巻数を増やすと誘導電流は大きくなります。ゆっくり動かすと磁界の変化が小さいので誘導電流は小さくなります。"}],"6":[{"t":"消化","q":"デンプンを分解する消化酵素はどれですか。","c":["アミラーゼ","ペプシン","リパーゼ","トリプシン"],"a":0,"e":"だ液にふくまれるアミラーゼはデンプンを麦芽糖に分解します。ペプシンはタンパク質、リパーゼは脂肪を分解します。"},{"t":"消化酵素","q":"胃液にふくまれ、タンパク質を分解する消化酵素はどれですか。","c":["ペプシン","アミラーゼ","リパーゼ","トリプシン"],"a":0,"e":"胃液にふくまれる消化酵素はペプシンで、タンパク質を分解します。トリプシンは同じくタンパク質を分解しますが、すい液にふくまれます。"},{"t":"胆汁","q":"消化酵素をふくまないのに、脂肪の消化を助けるはたらきをする液はどれですか。","c":["胆汁","すい液","胃液","だ液"],"a":0,"e":"胆汁は肝臓でつくられ胆のうにたくわえられる液で、消化酵素はふくみませんが脂肪を細かい粒にして消化酵素がはたらきやすくします。"},{"t":"吸収","q":"小腸の柔毛で毛細血管に吸収される養分の組み合わせはどれですか。","c":["ブドウ糖とアミノ酸","脂肪酸とモノグリセリド","デンプンとタンパク質","脂肪とデンプン"],"a":0,"e":"ブドウ糖とアミノ酸は柔毛の毛細血管に吸収されます。脂肪酸とモノグリセリドは柔毛で脂肪にもどってリンパ管に入ります。"},{"t":"柔毛","q":"小腸の内側のかべに多数の柔毛があることの利点はどれですか。","c":["表面積が大きくなり効率よく養分を吸収できる","食物を細かくくだくことができる","消化酵素を大量につくることができる","食物が通る速さを速くできる"],"a":0,"e":"柔毛があることで小腸の内側の表面積が非常に大きくなり、養分を効率よく吸収できます。"},{"t":"肺のつくり","q":"肺が多数の小さな肺胞に分かれていることの利点はどれですか。","c":["空気とふれる表面積が大きくなる","空気を強く押し出す力が大きくなる","肺が軽くなり動かしやすくなる","二酸化炭素をたくわえられる"],"a":0,"e":"肺胞に分かれることで空気とふれる表面積が大きくなり、酸素と二酸化炭素の交換を効率よく行えます。"},{"t":"呼吸運動","q":"息を吸いこむときの、横隔膜とろっ骨の動きの組み合わせとして正しいものはどれですか。","c":["横隔膜は下がり、ろっ骨は上がる","横隔膜は上がり、ろっ骨は下がる","横隔膜もろっ骨も上がる","横隔膜もろっ骨も下がる"],"a":0,"e":"横隔膜が下がりろっ骨が上がると胸の空間が広がり、肺の中の気圧が下がって空気が入ってきます。"},{"t":"血液循環","q":"図は血液の流れを示したものです。肺で受け取った酸素を心臓へ運ぶ血管はどれですか。","fig":"<svg viewBox='0 0 300 195'><rect x='105' y='8' width='90' height='34' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='139' y='30' font-size='11' fill='#333'>肺</text><rect x='105' y='72' width='90' height='52' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='133' y='103' font-size='11' fill='#333'>心臓</text><rect x='105' y='154' width='90' height='30' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='133' y='174' font-size='11' fill='#333'>全身</text><line x1='128' y1='72' x2='128' y2='42' stroke='#333' stroke-width='1.5'/><polyline points='124,50 128,42 132,50' fill='none' stroke='#333' stroke-width='1.5'/><text x='104' y='62' font-size='11' fill='#333'>ア</text><line x1='172' y1='42' x2='172' y2='72' stroke='#333' stroke-width='1.5'/><polyline points='168,64 172,72 176,64' fill='none' stroke='#333' stroke-width='1.5'/><text x='180' y='62' font-size='11' fill='#333'>イ</text><line x1='172' y1='124' x2='172' y2='154' stroke='#333' stroke-width='1.5'/><polyline points='168,146 172,154 176,146' fill='none' stroke='#333' stroke-width='1.5'/><text x='180' y='144' font-size='11' fill='#333'>ウ</text><line x1='128' y1='154' x2='128' y2='124' stroke='#333' stroke-width='1.5'/><polyline points='124,132 128,124 132,132' fill='none' stroke='#333' stroke-width='1.5'/><text x='104' y='144' font-size='11' fill='#333'>エ</text></svg>","c":["イ","ア","ウ","エ"],"a":0,"e":"肺から心臓へもどる血管イが肺静脈です。矢印の向きが肺から心臓へ向かっていることに注目します。"},{"t":"心臓","q":"全身に血液を送り出すため、かべの筋肉が最も厚くなっている部屋はどこですか。","c":["左心室","右心室","左心房","右心房"],"a":0,"e":"左心室は全身に血液を押し出すので強い力が必要で、かべの筋肉が最も厚くなっています。"},{"t":"赤血球","q":"赤血球にふくまれ、酸素を運ぶはたらきをする物質は何ですか。","c":["ヘモグロビン","フィブリン","アミラーゼ","グリコーゲン"],"a":0,"e":"赤血球中のヘモグロビンは、酸素の多いところで酸素と結びつき、少ないところで酸素をはなす性質があります。"},{"t":"血液","q":"出血したときに血液を固めて出血を止めるはたらきをするのはどれですか。","c":["血小板","赤血球","白血球","血しょう"],"a":0,"e":"血小板は出血したところで血液を固めるはたらきをします。白血球は細菌をとらえ、赤血球は酸素を運びます。"},{"t":"組織液","q":"血しょうが毛細血管のかべからしみ出して、細胞のまわりを満たしている液を何といいますか。","c":["組織液","リンパ液","血清","消化液"],"a":0,"e":"組織液は血液と細胞の間で養分や酸素、不要物のやりとりを仲立ちします。"},{"t":"排出","q":"血液中から尿素などの不要な物質をこしとり、尿をつくる器官はどこですか。","c":["じん臓","肝臓","ぼうこう","すい臓"],"a":0,"e":"じん臓は血液をこして尿素などの不要物を取り除きます。ぼうこうは尿を一時的にためる器官です。"},{"t":"排出","q":"細胞の活動でできた有害なアンモニアを、害の少ない尿素に変える器官はどこですか。","c":["肝臓","じん臓","ひ臓","小腸"],"a":0,"e":"アンモニアは肝臓で尿素に変えられ、じん臓でこしとられて尿として排出されます。"},{"t":"感覚器官","q":"目のつくりのうち、光の刺激を受け取る細胞が並んでいる部分はどこですか。","c":["網膜","レンズ","角膜","虹彩"],"a":0,"e":"レンズで屈折した光は網膜上に像を結び、網膜の細胞が刺激を受け取ります。"},{"t":"感覚器官","q":"耳で、音の刺激を受けて最初に振動する部分はどこですか。","c":["鼓膜","耳小骨","うずまき管","聴神経"],"a":0,"e":"音の振動はまず鼓膜をふるわせ、耳小骨を通ってうずまき管に伝わります。"},{"t":"反射","q":"熱いものに手がふれたとき、思わず手を引っこめる反応があります。この反応で命令を出す中枢はどこですか。","fig":"<svg viewBox='0 0 320 155'><ellipse cx='45' cy='28' rx='28' ry='18' fill='none' stroke='#94a3b8' stroke-width='1.5'/><text x='34' y='32' font-size='11' fill='#333'>脳</text><rect x='30' y='46' width='30' height='86' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='14' y='148' font-size='11' fill='#333'>せきずい</text><rect x='250' y='40' width='60' height='26' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='268' y='58' font-size='11' fill='#333'>皮ふ</text><rect x='250' y='100' width='60' height='26' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='268' y='118' font-size='11' fill='#333'>筋肉</text><line x1='250' y1='53' x2='60' y2='53' stroke='#333' stroke-width='1.5'/><polyline points='67,49 60,53 67,57' fill='none' stroke='#333' stroke-width='1.5'/><text x='128' y='46' font-size='11' fill='#333'>感覚神経</text><line x1='60' y1='113' x2='250' y2='113' stroke='#333' stroke-width='1.5'/><polyline points='243,109 250,113 243,117' fill='none' stroke='#333' stroke-width='1.5'/><text x='128' y='108' font-size='11' fill='#333'>運動神経</text></svg>","c":["せきずい","大脳","小脳","筋肉"],"a":0,"e":"反射では信号が脳に届く前にせきずいから命令が出されるため、意識とは関係なくすばやく反応できます。"},{"t":"神経","q":"感覚神経と運動神経をまとめて何といいますか。","c":["末しょう神経","中枢神経","反射神経","交感神経"],"a":0,"e":"脳とせきずいを中枢神経といい、そこから枝分かれした感覚神経や運動神経をまとめて末しょう神経といいます。"},{"t":"細胞","q":"植物の細胞にはあり、動物の細胞にはないつくりはどれですか。","c":["細胞壁","核","細胞膜","細胞質"],"a":0,"e":"細胞壁は植物の細胞だけにあり、細胞の形を保ち植物のからだを支えています。核や細胞膜は両方にあります。"},{"t":"細胞","q":"細胞の核を赤く染めて観察しやすくする染色液はどれですか。","c":["酢酸カーミン液","ヨウ素液","ベネジクト液","BTB溶液"],"a":0,"e":"酢酸カーミン液や酢酸オルセイン液は核や染色体を赤く染めます。ヨウ素液はデンプンの検出に使います。"},{"t":"生物の階層","q":"多細胞生物のからだのなりたちを、小さい順に正しく並べたものはどれですか。","c":["細胞→組織→器官→個体","細胞→器官→組織→個体","組織→細胞→器官→個体","細胞→組織→個体→器官"],"a":0,"e":"同じはたらきの細胞が集まって組織、いくつかの組織が集まって器官、器官が集まって個体になります。"},{"t":"湿度","q":"下の表を使います。気温20℃の空気1m3中に水蒸気が12.1gふくまれているとき、湿度は約何%ですか。","fig":"<svg viewBox='0 0 300 95'><line x1='10' y1='20' x2='290' y2='20' stroke='#94a3b8' stroke-width='1'/><line x1='10' y1='50' x2='290' y2='50' stroke='#94a3b8' stroke-width='1'/><line x1='10' y1='80' x2='290' y2='80' stroke='#94a3b8' stroke-width='1'/><line x1='10' y1='20' x2='10' y2='80' stroke='#94a3b8' stroke-width='1'/><line x1='100' y1='20' x2='100' y2='80' stroke='#94a3b8' stroke-width='1'/><line x1='148' y1='20' x2='148' y2='80' stroke='#94a3b8' stroke-width='1'/><line x1='196' y1='20' x2='196' y2='80' stroke='#94a3b8' stroke-width='1'/><line x1='243' y1='20' x2='243' y2='80' stroke='#94a3b8' stroke-width='1'/><line x1='290' y1='20' x2='290' y2='80' stroke='#94a3b8' stroke-width='1'/><text x='20' y='41' font-size='11' fill='#333'>気温 [℃]</text><text x='16' y='71' font-size='10' fill='#333'>飽和水蒸気量</text><text x='116' y='41' font-size='11' fill='#333'>10</text><text x='164' y='41' font-size='11' fill='#333'>15</text><text x='211' y='41' font-size='11' fill='#333'>20</text><text x='258' y='41' font-size='11' fill='#333'>25</text><text x='110' y='71' font-size='11' fill='#333'>9.4</text><text x='156' y='71' font-size='11' fill='#333'>12.8</text><text x='203' y='71' font-size='11' fill='#333'>17.3</text><text x='250' y='71' font-size='11' fill='#333'>23.1</text></svg>","c":["70%","61%","52%","86%"],"a":0,"e":"湿度は 12.1 わる 17.3 かける 100 で約70%です。20℃の飽和水蒸気量17.3g/m3を分母に使います。"},{"t":"露点","q":"空気を冷やしていったとき、ふくまれる水蒸気が凝結して水滴になり始める温度を何といいますか。","c":["露点","融点","沸点","凝固点"],"a":0,"e":"露点は空気中の水蒸気量で決まり、水蒸気が多いほど露点は高くなります。"},{"t":"雲のでき方","q":"雲ができるしくみの説明として正しいものはどれですか。","c":["空気が上昇すると膨張して温度が下がり、水蒸気が凝結する","空気が上昇すると圧縮されて温度が上がり、水蒸気が凝結する","空気が下降すると膨張して温度が下がり、水蒸気が凝結する","空気が下降すると温度が下がり、水蒸気がそのまま氷になる"],"a":0,"e":"上空ほど気圧が低いので、上昇した空気は膨張して温度が下がります。露点以下になると水蒸気が凝結して雲ができます。"},{"t":"寒冷前線","q":"図は寒冷前線付近の断面を表しています。この前線が通過するときの天気の特徴はどれですか。","fig":"<svg viewBox='0 0 300 155'><line x1='8' y1='132' x2='292' y2='132' stroke='#94a3b8' stroke-width='1.5'/><path d='M 8 132 L 150 132 L 100 30' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='40' y='118' font-size='11' fill='#333'>寒気</text><text x='218' y='118' font-size='11' fill='#333'>暖気</text><ellipse cx='145' cy='55' rx='36' ry='30' fill='none' stroke='#94a3b8' stroke-width='1.5'/><line x1='128' y1='88' x2='124' y2='120' stroke='#94a3b8' stroke-width='1'/><line x1='146' y1='90' x2='142' y2='122' stroke='#94a3b8' stroke-width='1'/><line x1='164' y1='86' x2='160' y2='118' stroke='#94a3b8' stroke-width='1'/><line x1='196' y1='58' x2='260' y2='58' stroke='#333' stroke-width='1.5'/><polyline points='253,54 260,58 253,62' fill='none' stroke='#333' stroke-width='1.5'/><text x='198' y='50' font-size='11' fill='#333'>進む向き</text></svg>","c":["せまい範囲に短時間の強い雨がふり、通過後は気温が下がる","広い範囲に長時間おだやかな雨がふり、通過後は気温が上がる","雨はふらず、通過後は気温が上がる","広い範囲に雪がふり、通過後は気温が変わらない"],"a":0,"e":"寒気が暖気を急激におし上げるので積乱雲ができ、せまい範囲に短時間の強い雨がふります。通過後は寒気におおわれて気温が下がります。"},{"t":"温暖前線","q":"温暖前線が通過したあとの気温と天気の変化として正しいものはどれですか。","c":["気温は上がり、天気は回復する","気温は下がり、天気は回復する","気温は上がり、強い雨がふり始める","気温は下がり、雨が長く続く"],"a":0,"e":"温暖前線が通過すると暖気におおわれるため気温が上がり、乱層雲による長時間の雨がやんで天気が回復します。"},{"t":"低気圧","q":"図のような北半球の低気圧で、地上の風のふき方として正しいものはどれですか。","fig":"<svg viewBox='0 0 260 165'><circle cx='130' cy='82' r='20' fill='none' stroke='#94a3b8' stroke-width='1'/><circle cx='130' cy='82' r='42' fill='none' stroke='#94a3b8' stroke-width='1'/><circle cx='130' cy='82' r='64' fill='none' stroke='#94a3b8' stroke-width='1'/><text x='122' y='87' font-size='13' fill='#4a6cf7'>低</text><text x='60' y='158' font-size='11' fill='#333'>曲線は等圧線</text></svg>","c":["反時計回りに中心へふきこむ","時計回りに中心へふきこむ","反時計回りに中心からふき出す","時計回りに中心からふき出す"],"a":0,"e":"北半球の低気圧では、風は反時計回りに中心へふきこみます。中心付近では上昇気流が生じて雲ができやすくなります。"},{"t":"気圧","q":"気圧の単位はhPaで表します。1気圧はおよそ何hPaですか。","c":["1013hPa","760hPa","100hPa","10hPa"],"a":0,"e":"1気圧は約1013hPaです。760は水銀柱の高さをmmで表した値で、単位がちがいます。"},{"t":"日本の冬","q":"日本の冬に特徴的な気圧配置と、その原因となる気団の組み合わせはどれですか。","c":["西高東低とシベリア気団","南高北低と小笠原気団","西高東低と小笠原気団","南高北低とオホーツク海気団"],"a":0,"e":"冬は大陸のシベリア気団が発達して西に高気圧、東に低気圧という西高東低の気圧配置になり、北西の季節風がふきます。"},{"t":"梅雨","q":"梅雨の時期に日本付近で停滞前線ができるのは、どの2つの気団がぶつかり合うためですか。","c":["オホーツク海気団と小笠原気団","シベリア気団と小笠原気団","シベリア気団とオホーツク海気団","小笠原気団と揚子江気団"],"a":0,"e":"冷たくしめったオホーツク海気団とあたたかくしめった小笠原気団がぶつかり、勢力がつり合って停滞前線（梅雨前線）ができます。"}],"7":[{"t":"力の合成","q":"一直線上で同じ向きにはたらく5Nと3Nの2つの力の合力の大きさはいくらですか。","c":["8N","2N","15N","4N"],"a":0,"e":"一直線上で同じ向きの2力の合力は、2力の大きさの和になります。5＋3で8Nです。"},{"t":"力の合成","q":"図のように、たがいに垂直な3Nと4Nの力が1点にはたらいています。合力の大きさはいくらですか。","fig":"<svg viewBox='0 0 260 175'><line x1='40' y1='140' x2='160' y2='140' stroke='#4a6cf7' stroke-width='2'/><polyline points='152,135 160,140 152,145' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='94' y='160' font-size='11' fill='#333'>4N</text><line x1='40' y1='140' x2='40' y2='50' stroke='#4a6cf7' stroke-width='2'/><polyline points='35,58 40,50 45,58' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='14' y='96' font-size='11' fill='#333'>3N</text><line x1='160' y1='140' x2='160' y2='50' stroke='#94a3b8' stroke-width='1' stroke-dasharray='4 3'/><line x1='40' y1='50' x2='160' y2='50' stroke='#94a3b8' stroke-width='1' stroke-dasharray='4 3'/><line x1='40' y1='140' x2='160' y2='50' stroke='#333' stroke-width='1.5'/><polyline points='150,52 160,50 156,60' fill='none' stroke='#333' stroke-width='1.5'/><text x='106' y='88' font-size='11' fill='#333'>合力</text><circle cx='40' cy='140' r='3' fill='#333'/></svg>","c":["5N","7N","12N","1N"],"a":0,"e":"垂直な2力の合力は平行四辺形（長方形）の対角線で表され、3対4対5の直角三角形の関係から5Nになります。"},{"t":"力の合成","q":"一直線上で反対向きにはたらく7Nと4Nの2つの力の合力について、正しいものはどれですか。","c":["7Nの力の向きに3N","4Nの力の向きに3N","7Nの力の向きに11N","合力は0になる"],"a":0,"e":"反対向きの2力の合力は差になり、向きは大きいほうの力と同じです。7引く4で3Nとなります。"},{"t":"力の分解","q":"図のように斜面上に台車を置きました。斜面の傾きを大きくすると、重力の斜面に平行な分力はどうなりますか。","fig":"<svg viewBox='0 0 280 165'><polygon points='20,140 250,140 250,45' fill='none' stroke='#94a3b8' stroke-width='1.5'/><polygon points='131,73 138,91 109,103 101,85' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='120' y1='88' x2='120' y2='143' stroke='#333' stroke-width='1.5'/><polyline points='116,136 120,143 124,136' fill='none' stroke='#333' stroke-width='1.5'/><text x='126' y='138' font-size='11' fill='#333'>重力</text><text x='30' y='134' font-size='11' fill='#333'>傾き</text></svg>","c":["大きくなる","小さくなる","変わらない","0になる"],"a":0,"e":"斜面の傾きが大きいほど重力の斜面に平行な分力が大きくなるため、台車の速さの増え方も大きくなります。"},{"t":"力のつり合い","q":"1つの物体にはたらく2力がつり合う条件として、あてはまらないものはどれですか。","c":["2力が別々の物体にはたらいている","2力の大きさが等しい","2力の向きが反対である","2力が同一直線上にある"],"a":0,"e":"つり合う2力は同じ1つの物体にはたらきます。別々の物体にはたらくのは作用と反作用の関係です。"},{"t":"作用反作用","q":"作用と反作用の関係にある2力の説明として正しいものはどれですか。","c":["2つの物体の間で、大きさが等しく向きが反対にはたらく","1つの物体にはたらき、つり合って物体が静止する","作用のほうが反作用より大きい","反作用は作用よりおくれてはたらく"],"a":0,"e":"作用と反作用は2つの物体の間で同時にはたらき、大きさが等しく向きが反対で同一直線上にあります。"},{"t":"作用反作用","q":"人が壁を手でおしたとき、人が壁からおし返される力は何とよばれますか。","c":["反作用","つり合いの力","慣性力","摩擦力"],"a":0,"e":"人が壁をおす力が作用、壁が人をおし返す力が反作用です。この2力は別々の物体にはたらくのでつり合いではありません。"},{"t":"等速直線運動","q":"等速直線運動をしている物体について、正しい説明はどれですか。","c":["速さが一定で、移動距離は時間に比例する","速さがしだいに大きくなる","移動距離は時間の2乗に比例する","運動の向きに力がはたらき続けている"],"a":0,"e":"等速直線運動では速さが一定なので、移動距離は時間に比例し、グラフは原点を通る直線になります。"},{"t":"速さのグラフ","q":"図は物体の速さと時間の関係を表したグラフです。この物体の運動はどれですか。","fig":"<svg viewBox='0 0 260 160'><line x1='34' y1='130' x2='240' y2='130' stroke='#333' stroke-width='1.5'/><line x1='34' y1='130' x2='34' y2='20' stroke='#333' stroke-width='1.5'/><text x='196' y='148' font-size='11' fill='#333'>時間</text><text x='6' y='16' font-size='11' fill='#333'>速さ</text><line x1='34' y1='70' x2='230' y2='70' stroke='#4a6cf7' stroke-width='2'/></svg>","c":["等速直線運動","だんだん速くなる運動","だんだんおそくなる運動","静止したままの状態"],"a":0,"e":"速さと時間のグラフが横軸に平行な直線なので、速さが変わらない等速直線運動です。"},{"t":"記録タイマー","q":"1秒間に50打点する記録タイマーで、5打点分のテープが表す時間は何秒ですか。","c":["0.1秒","0.5秒","0.02秒","5秒"],"a":0,"e":"1打点にかかる時間は50分の1秒で0.02秒です。5打点分では0.02かける5で0.1秒になります。"},{"t":"速さの計算","q":"1秒間に50打点する記録タイマーで、5打点分のテープの長さが6cmでした。この間の平均の速さは何m/sですか。","c":["0.6m/s","6m/s","0.06m/s","30m/s"],"a":0,"e":"5打点は0.1秒、6cmは0.06mです。0.06わる0.1で0.6m/sとなります。"},{"t":"斜面の運動","q":"なめらかな斜面を下る台車の運動について、正しい説明はどれですか。","c":["速さが一定の割合でしだいに大きくなる","速さは変わらない","速さが一定の割合でしだいに小さくなる","はじめだけ速くなりあとは一定になる"],"a":0,"e":"斜面上では重力の斜面に平行な分力が運動の向きに一定にはたらき続けるため、速さは一定の割合で増加します。"},{"t":"自由落下","q":"物体を静かに手からはなしたときの落下運動を何といいますか。","c":["自由落下","等速直線運動","慣性運動","放物運動"],"a":0,"e":"自由落下は重力だけがはたらく落下運動で、速さが一定の割合で増えていきます。"},{"t":"慣性","q":"止まっていたバスが急に発進すると、乗客のからだが後ろにたおれそうになるのはなぜですか。","c":["からだがそのまま静止し続けようとするから","からだに後ろ向きの力がはたらくから","バスがからだを後ろへおすから","からだの重力が大きくなるから"],"a":0,"e":"物体には運動の状態を保とうとする慣性があり、静止していたからだはその場にとどまろうとするため後ろにたおれそうになります。"},{"t":"慣性の法則","q":"物体に力がはたらいていないか、はたらく力がつり合っているとき、動いている物体はどうなりますか。","c":["等速直線運動を続ける","しだいにおそくなって止まる","しだいに速くなる","向きを変えながら動く"],"a":0,"e":"これが慣性の法則です。力がはたらかなければ、静止している物体は静止を続け、動いている物体は等速直線運動を続けます。"},{"t":"仕事","q":"物体に20Nの力を加え、力の向きに3m動かしたときの仕事はいくらですか。","c":["60J","23J","6.7J","20J"],"a":0,"e":"仕事は力の大きさかける力の向きに動いた距離で求めます。20かける3で60Jです。"},{"t":"仕事","q":"質量2kgの物体を1.5m真上に持ち上げたときの仕事はいくらですか。質量100gの物体にはたらく重力を1Nとします。","c":["30J","3J","300J","20J"],"a":0,"e":"2kgは2000gなので重力は20Nです。仕事は20かける1.5で30Jとなります。"},{"t":"仕事","q":"荷物を持ったまま水平な床を10m歩いたとき、荷物を持ち上げる力がした仕事はいくらですか。","c":["0J","10J","100J","わからない"],"a":0,"e":"力の向き（上向き）と移動の向き（水平）が垂直で、力の向きには動いていないため仕事は0Jです。"},{"t":"仕事の原理","q":"図のように動滑車を使って質量6kgの物体を2m引き上げます。引く力とひもを引く距離の組み合わせはどれですか。質量100gの物体にはたらく重力を1Nとします。","fig":"<svg viewBox='0 0 240 195'><line x1='50' y1='20' x2='105' y2='20' stroke='#94a3b8' stroke-width='2'/><line x1='82' y1='20' x2='82' y2='108' stroke='#333' stroke-width='1.5'/><circle cx='100' cy='108' r='18' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='118' y1='108' x2='118' y2='25' stroke='#333' stroke-width='1.5'/><polyline points='114,33 118,25 122,33' fill='none' stroke='#333' stroke-width='1.5'/><text x='126' y='40' font-size='11' fill='#333'>引く力</text><line x1='100' y1='126' x2='100' y2='145' stroke='#333' stroke-width='1.5'/><rect x='76' y='145' width='48' height='32' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='84' y='166' font-size='11' fill='#333'>6kg</text><text x='140' y='120' font-size='11' fill='#333'>動滑車</text></svg>","c":["30Nで4m","60Nで2m","30Nで2m","60Nで4m"],"a":0,"e":"6kgの物体の重力は60Nで、動滑車を使うと力は半分の30N、引く距離は2倍の4mになります。仕事は120Jで変わりません。"},{"t":"仕事率","q":"600Jの仕事を20秒間で行ったときの仕事率はいくらですか。","c":["30W","12000W","0.03W","620W"],"a":0,"e":"仕事率は仕事わる時間で求めます。600わる20で30Wです。"},{"t":"位置エネルギー","q":"高いところにある物体がもつ位置エネルギーの大きさについて、正しい説明はどれですか。","c":["物体の質量が大きいほど、また高さが高いほど大きい","高さだけで決まり、質量には関係しない","質量だけで決まり、高さには関係しない","速さが速いほど大きい"],"a":0,"e":"位置エネルギーは物体の質量と基準面からの高さの両方に比例して大きくなります。"},{"t":"運動エネルギー","q":"運動している物体がもつ運動エネルギーについて、正しい説明はどれですか。","c":["質量に比例し、速さの2乗に比例する","質量にも速さにも比例する","速さだけで決まり、質量には関係しない","高さが高いほど大きい"],"a":0,"e":"運動エネルギーは質量に比例し、速さの2乗に比例します。速さが2倍になるとエネルギーは4倍になります。"},{"t":"エネルギー保存","q":"図の振り子で、おもりの運動エネルギーが最も大きくなるのはどの位置ですか。摩擦や空気の抵抗は考えません。","fig":"<svg viewBox='0 0 280 165'><line x1='40' y1='18' x2='240' y2='18' stroke='#94a3b8' stroke-width='2'/><circle cx='140' cy='20' r='3' fill='#333'/><path d='M 62 98 A 110 110 0 0 0 218 98' fill='none' stroke='#94a3b8' stroke-width='1' stroke-dasharray='4 3'/><line x1='140' y1='20' x2='62' y2='98' stroke='#94a3b8' stroke-width='1'/><line x1='140' y1='20' x2='140' y2='130' stroke='#4a6cf7' stroke-width='1.5'/><line x1='140' y1='20' x2='218' y2='98' stroke='#94a3b8' stroke-width='1'/><circle cx='62' cy='98' r='8' fill='none' stroke='#333' stroke-width='1.5'/><text x='40' y='120' font-size='11' fill='#333'>ア</text><circle cx='140' cy='130' r='8' fill='none' stroke='#333' stroke-width='1.5'/><text x='136' y='154' font-size='11' fill='#333'>イ</text><circle cx='218' cy='98' r='8' fill='none' stroke='#333' stroke-width='1.5'/><text x='230' y='120' font-size='11' fill='#333'>ウ</text></svg>","c":["イ","ア","ウ","どこでも同じ"],"a":0,"e":"最下点のイで高さが最も低くなり位置エネルギーが最小になるため、そのぶん運動エネルギーが最大になります。"},{"t":"エネルギー保存","q":"摩擦や空気の抵抗がないとき、位置エネルギーと運動エネルギーの和はどうなりますか。","c":["常に一定に保たれる","しだいに小さくなる","しだいに大きくなる","最下点だけ大きくなる"],"a":0,"e":"位置エネルギーと運動エネルギーの和を力学的エネルギーといい、摩擦などがなければ一定に保たれます。これを力学的エネルギーの保存といいます。"},{"t":"エネルギー変換","q":"実際の機械では、加えたエネルギーがすべて目的のエネルギーに変わりません。その主な理由はどれですか。","c":["一部が熱や音になって逃げるから","エネルギーが消えてなくなるから","エネルギーが増えてしまうから","仕事の原理が成り立たないから"],"a":0,"e":"エネルギーの総量は保存されますが、一部が熱や音、光となって逃げるため目的のエネルギーは加えた量より小さくなります。"},{"t":"水圧","q":"図は水中のいろいろな深さではたらく水圧を矢印の長さで表したものです。この図から分かることはどれですか。","fig":"<svg viewBox='0 0 280 170'><rect x='30' y='25' width='220' height='130' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='30' y1='45' x2='250' y2='45' stroke='#94a3b8' stroke-width='1.5'/><text x='36' y='40' font-size='11' fill='#333'>水面</text><line x1='140' y1='70' x2='170' y2='70' stroke='#333' stroke-width='1.5'/><polyline points='163,66 170,70 163,74' fill='none' stroke='#333' stroke-width='1.5'/><line x1='140' y1='70' x2='110' y2='70' stroke='#333' stroke-width='1.5'/><polyline points='117,66 110,70 117,74' fill='none' stroke='#333' stroke-width='1.5'/><line x1='140' y1='105' x2='185' y2='105' stroke='#333' stroke-width='1.5'/><polyline points='178,101 185,105 178,109' fill='none' stroke='#333' stroke-width='1.5'/><line x1='140' y1='105' x2='95' y2='105' stroke='#333' stroke-width='1.5'/><polyline points='102,101 95,105 102,109' fill='none' stroke='#333' stroke-width='1.5'/><line x1='140' y1='140' x2='200' y2='140' stroke='#333' stroke-width='1.5'/><polyline points='193,136 200,140 193,144' fill='none' stroke='#333' stroke-width='1.5'/><line x1='140' y1='140' x2='80' y2='140' stroke='#333' stroke-width='1.5'/><polyline points='87,136 80,140 87,144' fill='none' stroke='#333' stroke-width='1.5'/></svg>","c":["水圧は深いところほど大きい","水圧は浅いところほど大きい","水圧はどの深さでも同じ","水圧は水面近くだけにはたらく"],"a":0,"e":"水圧は上にある水の重さによって生じるので、深いところほど大きくなります。またあらゆる向きにはたらきます。"},{"t":"水圧の計算","q":"水の深さ2mのところにはたらく水圧は約何Paですか。水1cm3の質量を1g、質量100gの物体にはたらく重力を1Nとします。","c":["20000Pa","2000Pa","200000Pa","200Pa"],"a":0,"e":"底面積1m2の上にある水は2m3で質量2000kg、重力は20000Nです。20000わる1で20000Paとなります。"},{"t":"浮力","q":"図のように、空気中で2.5Nを示した物体を水中に完全に沈めたところ、ばねばかりは1.6Nを示しました。この物体にはたらく浮力の大きさはいくらですか。","fig":"<svg viewBox='0 0 280 185'><line x1='70' y1='15' x2='70' y2='45' stroke='#333' stroke-width='1.5'/><rect x='50' y='45' width='42' height='26' fill='none' stroke='#4a6cf7' stroke-width='1.5'/><text x='54' y='63' font-size='11' fill='#333'>2.5N</text><line x1='70' y1='71' x2='70' y2='95' stroke='#333' stroke-width='1.5'/><rect x='55' y='95' width='30' height='26' fill='none' stroke='#333' stroke-width='1.5'/><text x='44' y='150' font-size='11' fill='#333'>空気中</text><line x1='195' y1='15' x2='195' y2='45' stroke='#333' stroke-width='1.5'/><rect x='174' y='45' width='42' height='26' fill='none' stroke='#4a6cf7' stroke-width='1.5'/><text x='178' y='63' font-size='11' fill='#333'>1.6N</text><line x1='195' y1='71' x2='195' y2='115' stroke='#333' stroke-width='1.5'/><rect x='150' y='88' width='95' height='70' fill='none' stroke='#4a6cf7' stroke-width='2'/><line x1='150' y1='100' x2='245' y2='100' stroke='#94a3b8' stroke-width='1.5'/><rect x='180' y='115' width='30' height='26' fill='none' stroke='#333' stroke-width='1.5'/><text x='176' y='178' font-size='11' fill='#333'>水中</text></svg>","c":["0.9N","1.6N","2.5N","4.1N"],"a":0,"e":"浮力は空気中での重さから水中でのばねばかりの値を引いて求めます。2.5引く1.6で0.9Nです。"},{"t":"浮力","q":"物体を水中に完全に沈めたまま、さらに深いところへ移動させると浮力の大きさはどうなりますか。","c":["変わらない","大きくなる","小さくなる","0になる"],"a":0,"e":"浮力は物体が押しのけた水の重さに等しく、完全に沈んでいれば押しのける水の体積は変わらないので浮力も変わりません。"},{"t":"大気圧","q":"山の頂上で密閉した空のペットボトルを、ふもとまで持ってくるとどうなりますか。","c":["まわりの大気圧が大きくなるためへこむ","まわりの大気圧が小さくなるためふくらむ","変化しない","中の空気が増えてふくらむ"],"a":0,"e":"標高が低いほど大気圧は大きくなります。外から強くおされるため、密閉したペットボトルはへこみます。"}],"8":[{"t":"原子の構造","q":"原子核をつくっている粒子の組み合わせとして正しいものはどれですか。","c":["陽子と中性子","陽子と電子","中性子と電子","電子だけ"],"a":0,"e":"原子は中心の原子核と、そのまわりの電子からできています。原子核は+の電気をもつ陽子と電気をもたない中性子でできています。"},{"t":"原子の構造","q":"図のイの粒子について、正しい説明はどれですか。","fig":"<svg viewBox='0 0 260 160'><circle cx='130' cy='80' r='55' fill='none' stroke='#94a3b8' stroke-width='1' stroke-dasharray='4 3'/><circle cx='130' cy='80' r='18' fill='none' stroke='#4a6cf7' stroke-width='2'/><text x='124' y='85' font-size='11' fill='#333'>ア</text><circle cx='185' cy='80' r='6' fill='none' stroke='#333' stroke-width='1.5'/><text x='196' y='84' font-size='11' fill='#333'>イ</text><circle cx='130' cy='25' r='6' fill='none' stroke='#333' stroke-width='1.5'/></svg>","c":["電子で、−の電気をもつ","陽子で、+の電気をもつ","中性子で、電気をもたない","原子核で、+の電気をもつ"],"a":0,"e":"中心のアが原子核、そのまわりを回っているイが電子です。電子は−の電気をもっています。"},{"t":"原子","q":"原子が全体として電気を帯びていないのはなぜですか。","c":["陽子の数と電子の数が等しいから","中性子が電気を打ち消すから","電子が原子核の中にあるから","陽子が電気をもたないから"],"a":0,"e":"+の電気をもつ陽子の数と−の電気をもつ電子の数が等しいため、原子全体では電気的に中性になります。"},{"t":"同位体","q":"同じ元素の原子で、中性子の数がちがうために質量がちがうものを何といいますか。","c":["同位体","同素体","分子","イオン"],"a":0,"e":"同位体は陽子の数が同じで中性子の数がちがう原子どうしのことで、化学的な性質はほぼ同じです。"},{"t":"陽イオン","q":"原子が陽イオンになるのはどのようなときですか。","c":["電子を失ったとき","電子を受け取ったとき","陽子を失ったとき","中性子を受け取ったとき"],"a":0,"e":"−の電気をもつ電子を失うと+の電気が多くなり、陽イオンになります。"},{"t":"陰イオン","q":"塩素原子が電子を1個受け取ってできるイオンを、イオンを表す記号で正しく書いたものはどれですか。","c":["Cl-","Cl+","Cl2-","Cl2+"],"a":0,"e":"電子を1個受け取ると−の電気が1つ分多くなるので、Cl-（塩化物イオン）になります。"},{"t":"イオン式","q":"マグネシウムイオンを表す記号として正しいものはどれですか。","c":["Mg2+","Mg+","Mg2-","Mg-"],"a":0,"e":"マグネシウム原子は電子を2個失って2価の陽イオンになるため、Mg2+と表します。"},{"t":"イオン式","q":"水酸化物イオンを表す記号として正しいものはどれですか。","c":["OH-","OH+","H+","O2-"],"a":0,"e":"水酸化物イオンはOH-で、アルカリに共通する性質のもとになるイオンです。"},{"t":"電離","q":"塩化ナトリウムが水にとけて電離するようすを表した式として正しいものはどれですか。","c":["NaCl → Na+ + Cl-","NaCl → Na- + Cl+","NaCl → Na2+ + Cl2-","NaCl → Na + Cl"],"a":0,"e":"塩化ナトリウムは水にとけるとナトリウムイオンNa+と塩化物イオンCl-に分かれます。+と−の数が等しくなることを確かめましょう。"},{"t":"電解質","q":"次のうち、水にとかしても電流が流れない非電解質はどれですか。","c":["砂糖","塩化ナトリウム","水酸化ナトリウム","塩化銅"],"a":0,"e":"砂糖は水にとけてもイオンに分かれないため電流が流れません。他の3つは電離して電流が流れる電解質です。"},{"t":"電気分解","q":"図のように塩化銅水溶液に電流を流したとき、陰極の表面に付着する赤色の物質は何ですか。","fig":"<svg viewBo
